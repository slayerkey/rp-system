<!DOCTYPE html>
<html>
	<head lang="en">
		<title>Round Phase</title>
		<meta charset="utf-8" />
		<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
	</head>
	<body>
		<sdpi-item label="Freezetime">
			<sdpi-color setting="freezeColor" default="#3b82f6"></sdpi-color>
		</sdpi-item>
		<sdpi-item label="Live">
			<sdpi-color setting="liveColor" default="#30e27b"></sdpi-color>
		</sdpi-item>
		<sdpi-item label="Bomb planted">
			<sdpi-color setting="bombColor" default="#ff9d2e"></sdpi-color>
		</sdpi-item>
		<sdpi-item label="Round over">
			<sdpi-color setting="overColor" default="#5b6168"></sdpi-color>
		</sdpi-item>
		<sdpi-item label="GSI Port">
			<sdpi-textfield setting="port" global default="3000" placeholder="3000"></sdpi-textfield>
		</sdpi-item>
		<p style="font-size:11px;color:#9aa6c4;margin:4px 6px;line-height:1.4;">Leave this at <b>3000</b> — it already matches the included config file and works automatically. No setup needed unless you changed the port in the .cfg.</p>
		<sdpi-item label="Tip">
			<sdpi-text>With no game running, press the key to preview each phase.</sdpi-text>
		</sdpi-item>
	</body>
</html>
