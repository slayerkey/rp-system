<!DOCTYPE html>
<html>
	<head lang="en">
		<title>Respawn Timer</title>
		<meta charset="utf-8" />
		<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
	</head>
	<body>
		<sdpi-item label="GSI Port">
			<sdpi-textfield setting="port" global default="3001" placeholder="3001"></sdpi-textfield>
		</sdpi-item>
		<p style="font-size:11px;color:#9aa6c4;margin:4px 6px;line-height:1.4;">Fully automatic — shows <b>ALIVE</b> while you're up and counts down the seconds to respawn when you die. Leave the port at 3001.</p>
	</body>
</html>
