<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Text Expander</title>
<style>
:root{color-scheme:dark}body{font:14px system-ui;background:#0f0f10;color:#f5f5f5;margin:0}.wrap{max-width:1120px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;align-items:end;gap:16px}.muted{color:#a9a9ae}.grid{display:grid;grid-template-columns:320px 1fr;gap:18px;margin-top:22px}.panel{background:#19191b;border:1px solid #303034;border-radius:14px;padding:16px}.list{max-height:70vh;overflow:auto}.item{padding:10px;border-radius:8px;cursor:pointer}.item:hover,.item.active{background:#29292d}.item small{display:block;color:#92929a}label{display:block;margin:12px 0}label span{display:block;font-weight:650;margin-bottom:6px}input,textarea{width:100%;box-sizing:border-box;background:#0e0e10;color:#fff;border:1px solid #3c3c42;border-radius:7px;padding:9px}textarea{min-height:300px;resize:vertical;font-family:ui-monospace,monospace}.row{display:flex;gap:8px;flex-wrap:wrap}button{background:#2b2b30;color:#fff;border:1px solid #43434a;border-radius:8px;padding:9px 13px;font-weight:650;cursor:pointer}.primary{background:#f4f4f4;color:#111}.danger{margin-left:auto}.vars{margin-top:22px}.vars textarea{min-height:130px}.status{min-height:20px}.pill{display:inline-block;border:1px solid #3b3b40;border-radius:999px;padding:4px 8px;margin:2px;color:#bbb}@media(max-width:760px){.grid{grid-template-columns:1fr}.list{max-height:260px}}
</style></head><body><div class="wrap"><header><div><h1 id="title">Text Expander</h1><div class="muted" id="meta"></div></div><button id="new">New snippet</button></header>
<div class="grid"><section class="panel list" id="list"></section><section class="panel"><label><span>Name</span><input id="name"></label><label id="folderWrap"><span>Folder / category</span><input id="folder"></label><label><span>Text</span><textarea id="content" spellcheck="false"></textarea></label><div class="row"><button class="primary" id="save">Save library</button><button class="danger" id="delete">Delete snippet</button></div><p class="status muted" id="status"></p>
<div class="vars" id="varsWrap"><h3>Reusable variables</h3><p class="muted">One per line: <code>name=value</code>. Use it as <code>{name}</code> in any snippet.</p><textarea id="vars" spellcheck="false"></textarea></div>
<h3>Variables</h3><div id="help"></div></section></div></div>
<script>
const token=new URLSearchParams(location.search).get("token"),$=id=>document.getElementById(id);let model=null,selected=null;
const api=path=>path+"?token="+encodeURIComponent(token);
async function load(){const r=await fetch(api("/api/library"));model=await r.json();if(!model.ok)throw new Error(model.error);$("title").textContent=model.edition==="pro"?"Text Expander Pro":"Text Expander Lite";$("meta").textContent=model.library.snippets.length+" / "+model.limit+" snippets · stored locally on this PC";$("folderWrap").style.display=model.edition==="pro"?"block":"none";$("varsWrap").style.display=model.edition==="pro"?"block":"none";$("help").innerHTML=(model.edition==="pro"?["{date}","{time}","{datetime}","{clipboard}","{username}","{computer}","{app}","{counter:name}","{cursor}","{date:YYYY-MM-DD}","unknown {fields} prompt before insertion"]:["{date}","{time}","{clipboard}"]).map(x=>"<span class=pill>"+x.replaceAll("<","&lt;")+"</span>").join("");$("vars").value=Object.entries(model.library.variables||{}).map(([k,v])=>k+"="+v).join("\n");selected=model.library.snippets[0]?.id||null;render()}
function render(){const list=$("list");list.innerHTML="";for(const s of model.library.snippets){const d=document.createElement("div");d.className="item"+(s.id===selected?" active":"");const b=document.createElement("b");b.textContent=s.name;d.appendChild(b);if(model.edition==="pro"){const sm=document.createElement("small");sm.textContent=s.folder||"Unfiled";d.appendChild(sm)}d.onclick=()=>{selected=s.id;render()};list.appendChild(d)}const s=model.library.snippets.find(x=>x.id===selected);$("name").value=s?.name||"";$("folder").value=s?.folder||"";$("content").value=s?.content||"";$("meta").textContent=model.library.snippets.length+" / "+model.limit+" snippets · stored locally on this PC"}
$("new").onclick=()=>{if(model.library.snippets.length>=model.limit)return status("Snippet limit reached.");const id="snippet-"+Date.now().toString(36);model.library.snippets.push({id,name:"New snippet",folder:model.edition==="pro"?"UNFILED":"STARTER",content:""});selected=id;render()};
$("delete").onclick=()=>{if(!selected)return;model.library.snippets=model.library.snippets.filter(x=>x.id!==selected);selected=model.library.snippets[0]?.id||null;render()};
function syncEditor(){const s=model.library.snippets.find(x=>x.id===selected);if(!s)return;s.name=$("name").value.trim()||"Untitled";s.folder=$("folder").value.trim();s.content=$("content").value}
["name","folder","content"].forEach(id=>$(id).addEventListener("input",syncEditor));
function status(t){$("status").textContent=t}
$("save").onclick=async()=>{syncEditor();if(model.edition==="pro"){const vars={};for(const line of $("vars").value.split(/\r?\n/)){if(!line.trim())continue;const i=line.indexOf("=");if(i<1)return status("Reusable variables must use name=value.");vars[line.slice(0,i).trim()]=line.slice(i+1)}model.library.variables=vars}status("Saving…");const r=await fetch(api("/api/library"),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({library:model.library})});const data=await r.json();if(!data.ok)return status(data.error||"Could not save.");model.library=data.library;status("Saved locally.");render()};
load().catch(e=>status(e.message));
</script></body></html>
