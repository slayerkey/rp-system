<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Auto-Repeat</title>
		<link rel="stylesheet" href="keys.css" />
	</head>
	<body data-kind="repeat">
		<div class="row first">
			<label class="key" for="what">Repeat</label>
			<div class="field">
				<select id="what">
					<option value="key">Keyboard key</option>
					<option value="click">Mouse click</option>
				</select>
			</div>
		</div>

		<div id="key-fields">
			<div class="row">
				<label class="key">Key</label>
				<div class="field"><button id="record-keys" type="button" class="record small">Set key to repeat</button></div>
			</div>
		</div>

		<div id="click-fields">
			<div class="row">
				<label class="key" for="button">Button</label>
				<div class="field">
					<select id="button">
						<option value="left">Left</option>
						<option value="right">Right</option>
						<option value="middle">Middle</option>
					</select>
				</div>
			</div>
		</div>

		<div class="row">
			<label class="key" for="hz">Rate</label>
			<div class="field slider"><input type="number" id="hz" min="0.1" max="50" step="0.5" class="num" /><span class="unit">/sec</span></div>
		</div>
		<div class="row">
			<label class="key" for="maxSeconds">Stop after</label>
			<div class="field slider"><input type="number" id="maxSeconds" min="0" max="3600" step="1" class="num" /><span class="unit">sec</span></div>
		</div>

		<div id="summary" class="summary"></div>

		<p class="hint">Press once to start, press again to stop. 0 seconds means "until I stop it".</p>

		<script src="phase3.js"></script>
	</body>
</html>
