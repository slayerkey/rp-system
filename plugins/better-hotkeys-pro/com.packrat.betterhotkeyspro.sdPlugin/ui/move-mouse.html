<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Move Mouse</title>
		<link rel="stylesheet" href="keys.css" />
	</head>
	<body data-kind="move" data-verb="Moves">
		<div class="group first">
			<label class="mod standalone">
				<input type="checkbox" id="relative" />
				Nudge by an offset instead
			</label>
			<p class="hint">Off means it moves to an exact spot on screen.</p>
		</div>

		<div id="point-fields">
			<div class="row">
				<label class="key" for="area">Area</label>
				<div class="field">
					<select id="area">
						<option value="primary">Primary monitor</option>
						<option value="virtual">All monitors</option>
						<option value="monitor">Pick a monitor…</option>
					</select>
				</div>
			</div>

			<div class="row" id="monitor-row">
				<label class="key" for="monitor">Monitor</label>
				<div class="field"><select id="monitor"></select></div>
			</div>

			<div class="row">
				<label class="key" for="x">X</label>
				<div class="field slider">
					<input type="range" id="x" min="0" max="100" step="0.1" />
					<input type="number" id="xnum" min="0" max="100" step="0.1" class="num" />
					<span class="unit">%</span>
				</div>
			</div>

			<div class="row">
				<label class="key" for="y">Y</label>
				<div class="field slider">
					<input type="range" id="y" min="0" max="100" step="0.1" />
					<input type="number" id="ynum" min="0" max="100" step="0.1" class="num" />
					<span class="unit">%</span>
				</div>
			</div>

			<button id="capture" type="button" class="record secondary">Capture cursor position</button>
			<p id="capture-note" class="hint"></p>
		</div>

		<div id="offset-fields">
			<div class="row">
				<label class="key" for="dx">Across</label>
				<div class="field slider">
					<input type="number" id="dx" step="1" class="num wide" />
					<span class="unit">px</span>
				</div>
			</div>
			<div class="row">
				<label class="key" for="dy">Down</label>
				<div class="field slider">
					<input type="number" id="dy" step="1" class="num wide" />
					<span class="unit">px</span>
				</div>
			</div>
			<p class="hint">Negative numbers go left and up.</p>
		</div>

		<div id="summary" class="summary"></div>

		<script src="mouse.js"></script>
	</body>
</html>
