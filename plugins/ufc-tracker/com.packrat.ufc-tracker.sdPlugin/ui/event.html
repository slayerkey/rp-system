<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Next Event</title>
		<link rel="stylesheet" href="pi.css" />
	</head>
	<body data-kind="event">
		<h2>The next card</h2>
		<div class="row">
			<label class="key" for="press">On press</label>
			<div class="field">
				<select id="press">
					<option value="refresh">Refresh now</option>
					<option value="open">Open the event page</option>
				</select>
			</div>
		</div>
		<p class="hint">Shows the next card and its main event, and switches to a countdown once it is close. While the card is running it shows how far along the night is.</p>

		<p class="disclaimer">Not affiliated with or endorsed by UFC, any promotion, or any fighter. Fighter names identify the bouts on the card.</p>

		<script src="pi.js"></script>
	</body>
</html>
