<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Next Race</title>
		<link rel="stylesheet" href="pi.css" />
	</head>
	<body data-kind="event">
		<h2>The next race</h2>
		<div class="row">
			<label class="key" for="press">On press</label>
			<div class="field">
				<select id="press">
					<option value="refresh">Refresh now</option>
					<option value="open">Open the race page</option>
				</select>
			</div>
		</div>
		<p class="hint">Shows the next race and switches to a countdown once it is close. On race day it shows the race status instead.</p>

		<p class="disclaimer">Not affiliated with or endorsed by NASCAR, any team, or any driver. Driver names identify the field.</p>

		<script src="pi.js"></script>
	</body>
</html>
