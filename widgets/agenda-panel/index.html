async function refreshCalendars(force) {

    STATE.status = "unconfigured";
    STATE.message = "Paste an ICS feed URL in widget settings.";
    STATE.sourceCount = 0;
    STATE.failedCount = 0;
    render();
    scheduleRefresh();
    return;
  }

  if (!force && STATE.status === "loading") return;
  STATE.status = "loading";
  renderStatus();
  if (typeof calendarParserReady === "function") await calendarParserReady();

  var results = await Promise.all(urls.map(function (url, sourceIndex) {
    return loadCalendarText(url, sourceIndex).then(function (loaded) {
      if (!loaded) return { ok: false, transport: true, events: [] };
      try {

  var failed = 0;
  var transportFailures = 0;

    merged.sort(compareEvents);
    STATE.events = merged;
    STATE.updatedAt = Date.now();
    STATE.stale = failed > 0;
    STATE.sourceCount = urls.length;
    STATE.failedCount = failed;

      STATE.updatedAt = cached.updatedAt || 0;
      STATE.stale = true;
      STATE.sourceCount = urls.length;
      STATE.failedCount = failed;
      STATE.status = "stale";
      STATE.message = "Showing the last successful agenda.";

      STATE.events = [];
      STATE.updatedAt = 0;
      STATE.stale = true;
      STATE.sourceCount = urls.length;
      STATE.failedCount = failed;

  var tone = "";
  if (state === "fresh") { text = STATE.updatedAt ? "UPDATED " + ago(Date.now() - STATE.updatedAt) : "LIVE"; tone = "fresh"; }
  else if (state === "stale") { text = STATE.updatedAt ? "STALE • " + ago(Date.now() - STATE.updatedAt) : "STALE"; tone = "stale"; }
  else if (state === "loading") { text = "REFRESHING"; tone = ""; }
  else if (state === "error") { text = "FEED ERROR"; tone = "error"; }
  else { text = "NOT CONFIGURED"; tone = ""; }
  label.textContent = text;
  label.setAttribute("data-tone", tone);
  label.title = message || "";
}

function ago(ms) {
  if (ms < 60000) return "NOW";
  var minutes = Math.floor(ms / 60000);
  if (minutes < 60) return minutes + "M AGO";
  return Math.floor(minutes / 60) + "H AGO";
}

function renderStatus() { setStatus(STATE.status, STATE.message); }
</script>
<script>
function renderHero(now) {
  var event = nextRelevantEvent(now);
  var title = document.getElementById("heroTitle");
  var time = document.getElementById("heroTime");
  var countdown = document.getElementById("heroCountdown");
  var location = document.getElementById("heroLocation");
  var heroCard = document.getElementById("heroCard");
  countdown.setAttribute("data-tone", "");

  if (STATE.status === "unconfigured") {
    title.textContent = "Add your calendar";
    time.textContent = "Paste an ICS feed URL in settings";
    countdown.textContent = "";
    location.textContent = "";
  } else if (STATE.status === "error" && !STATE.events.length) {
    title.textContent = "Calendar feed unavailable";
    time.textContent = "Check the ICS URL or your connection, then try refresh";
    countdown.textContent = "";
    location.textContent = "";
  } else if (!event) {
    title.textContent = "Your day is clear";
    time.textContent = STATE.stale ? "Showing the last successful agenda" : "No upcoming events";
    countdown.textContent = "";
    location.textContent = "";
  } else {
    title.textContent = event.title;
    time.textContent = event.allDay ? formatDayShort(allDayStartDate(event)) + " • ALL DAY" : formatTime(event.start) + " • " + formatDuration(event);
    var count = countdownText(event, now);
    countdown.textContent = count;
    var minutes = event.allDay ? Infinity : (event.start.getTime() - now.getTime()) / 60000;
    countdown.setAttribute("data-tone", minutes <= 10 ? "urgent" : (minutes <= 30 ? "soon" : ""));
    location.textContent = event.location || "";
  }

  setText("heroToggle", STATE.mode === "today" ? "TAP FOR NEXT 3 DAYS" : "TAP FOR TODAY");
  heroCard.setAttribute("aria-label", "Switch calendar range");
  heroCard.onclick = function () {
    STATE.mode = STATE.mode === "today" ? "four" : "today";
    document.body.setAttribute("data-mode", STATE.mode);
    render();
  };
}

function allDayStartDate(event) {
  var p = dateKeyToParts(event.allDayStart);
  return new Date(p.y, p.m - 1, p.d);
}

function visibleDays(now) {
  var start = dayStart(now);
  var count = STATE.mode === "today" ? 1 : 4;
  var days = [];
  for (var i = 0; i < count; i++) days.push(new Date(start.getFullYear(), start.getMonth(), start.getDate() + i));
  return days;
}

function timelinePercent(date, day) {
  var start = dayStart(day).getTime();
  var end = nextDayStart(day).getTime();
  return Math.max(0, Math.min(100, ((date.getTime() - start) / (end - start)) * 100));
}

function dayDurationMs(day) {
  return nextDayStart(day).getTime() - dayStart(day).getTime();
}

function localHourDate(day, hour) {
  if (hour === 24) return nextDayStart(day);
  return new Date(day.getFullYear(), day.getMonth(), day.getDate(), hour, 0, 0, 0);
}

function localHourPercent(day, hour) {
  return timelinePercent(localHourDate(day, hour), day);
}

function hourLabelText(hour, use24) {
  var h = hour === 24 ? 0 : hour;
  return use24 ? pad2(h) + ":00" : (h === 0 ? "12A" : h < 12 ? h + "A" : h === 12 ? "12P" : (h - 12) + "P");
}

function daysShareDuration(days) {
  if (!days.length) return true;
  var duration = dayDurationMs(days[0]);
  return days.every(function (day) { return dayDurationMs(day) === duration; });
}

function addRowAxis(row, day) {
  var use24 = getIcueProperty("use24Hour", false) === true;
  [6, 12, 18].forEach(function (hour) {
    var pct = localHourPercent(day, hour);
    var line = document.createElement("span");
    line.className = "rowAxisLine";
    line.style.left = pct + "%";
    row.appendChild(line);
    var label = document.createElement("span");
    label.className = "rowAxisLabel";
    label.style.left = pct + "%";
    label.textContent = hourLabelText(hour, use24);
    row.appendChild(label);
  });
}

function buildAxis(days) {
  var labels = document.getElementById("axisLabels");
  var lines = document.getElementById("gridLines");
  labels.innerHTML = "";
  lines.innerHTML = "";
  var use24 = getIcueProperty("use24Hour", false) === true;
  var shared = daysShareDuration(days);
  document.body.setAttribute("data-mixed-day-lengths", shared ? "false" : "true");
  if (!shared && days.length > 1) {
    var notice = document.createElement("span");
    notice.className = "axisLabel axisNotice";
    notice.style.left = "50%";
    notice.textContent = "LOCAL TIME";
    labels.appendChild(notice);
    return false;
  }
  var reference = days.length ? days[0] : new Date();
  for (var hour = 0; hour <= 24; hour += 3) {
    var pct = localHourPercent(reference, hour);
    var label = document.createElement("span");
    label.className = "axisLabel";
    label.style.left = pct + "%";
    label.textContent = hourLabelText(hour, use24);
    labels.appendChild(label);
    var line = document.createElement("span");
    line.className = "gridLine";
    line.style.left = pct + "%";
    lines.appendChild(line);
  }
  return true;
}

function layoutLanes(segments) {
  segments.sort(function (a, b) { return a.left - b.left || a.right - b.right; });
  var laneEnds = [];
  segments.forEach(function (segment) {
    var lane = 0;
    while (lane < laneEnds.length && segment.left < laneEnds[lane] - 0.05) lane++;
    if (lane === laneEnds.length) laneEnds.push(segment.right);
    else laneEnds[lane] = segment.right;
    segment.lane = lane;
  });
  return laneEnds.length;
}

function createEventButton(event, segment, topPct, rowHeightPct, laneCount, now) {
  var button = document.createElement("button");
  button.type = "button";
  button.className = "eventBlock interactive" + ((!event.allDay && event.end.getTime() <= now.getTime()) ? " past" : "");
  button.style.left = segment.left + "%";
  button.style.width = Math.max(2.4, segment.right - segment.left) + "%";
  var laneHeight = Math.max(44, (document.getElementById("timelineViewport").clientHeight * rowHeightPct / 100 - 18) / Math.max(1, laneCount));
  button.style.top = "calc(" + topPct + "% + " + (8 + segment.lane * laneHeight) + "px)";
  button.style.height = Math.max(44, laneHeight - 5) + "px";
  var title = document.createElement("span");
  title.className = "eventTitle";
  title.textContent = event.title;
  var meta = document.createElement("span");
  meta.className = "eventMeta";
  meta.textContent = formatRange(event) + (event.location ? " • " + event.location : "");
  button.appendChild(title);
  button.appendChild(meta);
  button.onclick = function () { openDetail(event); };
  return button;
}

function renderTimeline(now, days) {
  var allDay = [];
  days.forEach(function (day) {
    STATE.events.filter(function (event) { return allDayActiveOn(event, day); }).forEach(function (event) {
      if (!allDay.some(function (item) { return item.id === event.id; })) allDay.push(event);
    });
  });
  renderAllDay(allDay);
  var sharedAxis = buildAxis(days);
  var rows = document.getElementById("eventRows");
  rows.innerHTML = "";
  var rowHeight = 100 / days.length;
  var totalVisible = 0;
  days.forEach(function (day, index) {
    var row = document.createElement("div");
    row.className = "dayRow";
    row.style.top = (index * rowHeight) + "%";
    row.style.height = rowHeight + "%";
    var rowLabel = document.createElement("span");
    rowLabel.className = "dayRowLabel";
    rowLabel.textContent = STATE.mode === "four" ? formatDayShort(day).toUpperCase() : "";
    row.appendChild(rowLabel);
    if (!sharedAxis && days.length > 1) addRowAxis(row, day);
    rows.appendChild(row);

    var start = dayStart(day);
    var end = nextDayStart(day);
    var segments = [];
    STATE.events.filter(function (event) { return timedIntersectsDay(event, day); }).forEach(function (event) {
      var segStart = new Date(Math.max(event.start.getTime(), start.getTime()));
      var segEnd = new Date(Math.min(event.end.getTime(), end.getTime()));
      var left = timelinePercent(segStart, day);
      var right = timelinePercent(segEnd, day);
      segments.push({ event: event, left: left, right: Math.max(left + 0.5, right), lane: 0 });
    });
    totalVisible += segments.length;
    var laneCount = layoutLanes(segments);
    var rowPixels = document.getElementById("timelineViewport").clientHeight * rowHeight / 100;
    var laneCapacity = Math.max(1, Math.floor(Math.max(0, rowPixels - 18) / 49));
    var maxLanes = Math.min(STATE.mode === "four" ? 2 : 4, laneCapacity);
    var hidden = 0;
    segments.forEach(function (segment) {
      if (segment.lane >= maxLanes) { hidden++; return; }
      rows.appendChild(createEventButton(segment.event, segment, index * rowHeight, rowHeight, Math.min(maxLanes, laneCount), now));
    });
    if (hidden) {
      var more = document.createElement("button");
      more.type = "button";
      more.className = "overflowButton interactive";
      more.textContent = "+" + hidden;
      more.style.bottom = "calc(" + ((days.length - index - 1) * rowHeight) + "% + 7px)";
      more.onclick = function () { openDaySummary(day); };
      rows.appendChild(more);
    }
  });

  var today = days[0];
  var marker = document.getElementById("nowMarker");
  if (now >= dayStart(today) && now < nextDayStart(today)) {
    marker.style.display = "block";
    marker.style.left = timelinePercent(now, today) + "%";
    marker.style.top = "0";
    marker.style.height = rowHeight + "%";
  } else marker.style.display = "none";

  var empty = document.getElementById("emptyState");
  empty.style.display = totalVisible === 0 && allDay.length === 0 && STATE.status !== "unconfigured" && STATE.status !== "bridge" && STATE.status !== "error" ? "flex" : "none";
}

function renderAllDay(events) {
  var wrap = document.getElementById("allDayItems");
  wrap.innerHTML = "";
  events.slice(0, 5).forEach(function (event) {
    var button = document.createElement("button");
    button.type = "button";
    button.className = "allDayChip interactive";
    button.textContent = event.title;
    button.onclick = function () { openDetail(event); };
    wrap.appendChild(button);
  });
  if (events.length > 5) {
    var more = document.createElement("button");
    more.type = "button";
    more.className = "allDayChip interactive";
    more.textContent = "+" + (events.length - 5);
    more.onclick = function () { openAllDaySummary(events); };
    wrap.appendChild(more);
  }
}
</script>
<script>
function compactEventsForDay(day) {
  return STATE.events.filter(function (event) { return event.allDay ? allDayActiveOn(event, day) : timedIntersectsDay(event, day); });
}

function renderCompact(days, onlyDay) {
  var list = document.getElementById("compactList");
  list.innerHTML = "";
  var targetDays = onlyDay ? [onlyDay] : days;
  var shown = 0;
  targetDays.forEach(function (day) {
    var events = compactEventsForDay(day);
    if (!events.length && STATE.mode === "today" && !onlyDay) return;
    var section = document.createElement("div");
    section.className = "compactDay";
    var header = document.createElement("div");
    header.className = "compactDayHeader";
    header.textContent = formatDayLong(day);
    section.appendChild(header);
    var slot = document.body.getAttribute("data-slot") || "s-h";
    var limit = targetDays.length > 1 ? 4 : 7;
    if (slot === "s-h") limit = 4;
    else if (slot === "s-v") limit = 4;
    events.slice(0, limit).forEach(function (event) {
      shown++;
      var button = document.createElement("button");
      button.type = "button";
      button.className = "compactEvent interactive" + ((!event.allDay && event.end.getTime() <= Date.now()) ? " past" : "");
      var time = document.createElement("span");
      time.className = "compactTime";
      time.textContent = event.allDay ? "ALL DAY" : formatTime(event.start);
      var title = document.createElement("span");
      title.className = "compactTitle";
      title.textContent = event.title;
      button.appendChild(time);
      button.appendChild(title);
      button.onclick = function () { openDetail(event); };
      section.appendChild(button);
    });
    list.appendChild(section);
  });
  if (!shown) {
    var section = document.createElement("div");
    section.className = "compactDay";
    var header = document.createElement("div");
    header.className = "compactDayHeader";
    header.textContent = STATE.status === "unconfigured" ? "SETUP" : "AGENDA";
    var empty = document.createElement("div");
    empty.className = "compactEvent";
    empty.innerHTML = '<span class="compactTime">' + (STATE.status === "unconfigured" ? "ICS" : "CLEAR") + '</span><span class="compactTitle">' + (STATE.status === "unconfigured" ? "Add a feed URL in settings" : "No events here") + '</span>';
    section.appendChild(header);
    section.appendChild(empty);
    list.appendChild(section);
  }
}

function renderCompactOnly(day) {
  renderCompact([day], day);
}

function openDaySummary(day) {
  var events = STATE.events.filter(function (event) {
    return event.allDay ? allDayActiveOn(event, day) : timedIntersectsDay(event, day);
  }).sort(compareEvents);
  STATE.selected = null;
  var overlay = document.getElementById("detailOverlay");
  overlay.classList.add("open");
  overlay.setAttribute("aria-hidden", "false");
  setText("detailTitle", formatDayLong(day));
  setText("detailTime", events.length + (events.length === 1 ? " event" : " events"));
  setText("detailLocation", "");
  setText("detailDescription", events.map(function (event) {
    var when = event.allDay ? "ALL DAY" : formatRange(event);
    return when + "  " + event.title + (event.location ? "\n" + event.location : "");
  }).join("\n\n"));
}

function openAllDaySummary(events) {
  STATE.selected = null;
  var overlay = document.getElementById("detailOverlay");
  overlay.classList.add("open");
  overlay.setAttribute("aria-hidden", "false");
  setText("detailTitle", "All day events");
  setText("detailTime", events.length + (events.length === 1 ? " event" : " events"));
  setText("detailLocation", "");
  setText("detailDescription", events.map(function (event) {
    return formatDayShort(allDayStartDate(event)) + "  " + event.title + (event.location ? "\n" + event.location : "");
  }).join("\n\n"));
}

function openDetail(event) {
  STATE.selected = event;
  var overlay = document.getElementById("detailOverlay");
  overlay.classList.add("open");
  overlay.setAttribute("aria-hidden", "false");
  setText("detailTitle", event.title);
  if (event.allDay) setText("detailTime", formatDayLong(allDayStartDate(event)) + " • All day");
  else setText("detailTime", formatDayLong(event.start) + " • " + formatRange(event));
  setText("detailLocation", event.location || "");
  setText("detailDescription", event.description || "");
}

function closeDetail() {
  STATE.selected = null;
  var overlay = document.getElementById("detailOverlay");
  overlay.classList.remove("open");
  overlay.setAttribute("aria-hidden", "true");
}

function render() {
  applyAppearance();
  renderStatus();
  var now = new Date();
  var days = visibleDays(now);
  setText("dayLabel", formatDayLong(now).toUpperCase());
  renderHero(now);
  renderTimeline(now, days);
  renderCompact(days, null);
}

function minuteTick() {
  render();
  if (CLOCK_TIMER) clearTimeout(CLOCK_TIMER);
  CLOCK_TIMER = setTimeout(minuteTick, 15000);
}

async function translateStatic() {
  var keys = ["CALENDAR", "NEXT UP", "ALL DAY", "TAP FOR NEXT 3 DAYS", "Refresh calendar", "Switch calendar range", "Day timeline", "Agenda list", "Close details", "EVENT"];
  var values = await Promise.all(keys.map(t));
  var map = {};
  keys.forEach(function (key, index) { map[key] = values[index]; });
  setText("brandLabel", map["CALENDAR"]);
  setText("heroEyebrow", map["NEXT UP"]);
  setText("allDayLabel", map["ALL DAY"]);
  setText("heroToggle", map["TAP FOR NEXT 3 DAYS"]);
  setText("detailEyebrow", map["EVENT"]);
  document.getElementById("refreshButton").setAttribute("aria-label", map["Refresh calendar"]);
  document.getElementById("heroCard").setAttribute("aria-label", map["Switch calendar range"]);
  document.getElementById("timelinePanel").setAttribute("aria-label", map["Day timeline"]);
  document.getElementById("compactAgenda").setAttribute("aria-label", map["Agenda list"]);
  document.getElementById("detailClose").setAttribute("aria-label", map["Close details"]);
}

var BOOTED = false;
var LAST_ICUE_PROPERTIES = null;

function readIcuePropertySnapshot() {
  return {
    calendarUrl1: String(getIcueProperty("calendarUrl1", "") || ""),
    calendarUrl2: String(getIcueProperty("calendarUrl2", "") || ""),
    calendarUrl3: String(getIcueProperty("calendarUrl3", "") || ""),
    refreshMinutes: Number(getIcueProperty("refreshMinutes", 15)) || 15,
    use24Hour: getIcueProperty("use24Hour", false) === true,
    textColor: String(getIcueProperty("textColor", "#F4F6F8") || "#F4F6F8"),
    accentColor: String(getIcueProperty("accentColor", "#2BE86A") || "#2BE86A"),
    backgroundColor: String(getIcueProperty("backgroundColor", "#07090D") || "#07090D")
  };
}

function calendarPropertiesChanged(previous, current) {
  if (!previous) return true;
  return previous.calendarUrl1 !== current.calendarUrl1 ||
    previous.calendarUrl2 !== current.calendarUrl2 ||
    previous.calendarUrl3 !== current.calendarUrl3;
}

function onIcueInitialized() {
  if (!BOOTED) boot();
  else {
    LAST_ICUE_PROPERTIES = readIcuePropertySnapshot();
    applySlot();
    refreshCalendars(true);
  }
}

function onIcueDataUpdated() {
  if (!BOOTED) { boot(); return; }
  var previous = LAST_ICUE_PROPERTIES;
  var current = readIcuePropertySnapshot();
  LAST_ICUE_PROPERTIES = current;
  applySlot();
  translateStatic();
  if (calendarPropertiesChanged(previous, current)) refreshCalendars(true);
  else {
    render();
    if (!previous || previous.refreshMinutes !== current.refreshMinutes) scheduleRefresh();
  }
}

function installIcueEvents() {
  try {
    globalThis.icueEvents = {
      onICUEInitialized: onIcueInitialized,
      onDataUpdated: onIcueDataUpdated
    };
  } catch (error) {}
}

function boot() {
  if (BOOTED) return;
  BOOTED = true;
  LAST_ICUE_PROPERTIES = readIcuePropertySnapshot();
  var cached = cacheRead();
  if (cached && cached.events.length) {
    STATE.events = cached.events;
    STATE.updatedAt = cached.updatedAt || 0;
    STATE.stale = true;
    STATE.status = "stale";
  }
  document.getElementById("refreshButton").onclick = function () { refreshCalendars(true); };
  document.getElementById("detailClose").onclick = closeDetail;
  window.addEventListener("resize", applySlot);
  document.addEventListener("keydown", function (event) { if (event.key === "Escape") closeDetail(); });
  applySlot();
  translateStatic();
  refreshCalendars(true);
  minuteTick();
}

installIcueEvents();
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();

try {
  if (typeof iCUE_initialized !== "undefined" && iCUE_initialized) onIcueInitialized();
} catch (error) {}
</script>
<script>

  var notifying = false;

      if (Object.prototype.hasOwnProperty.call(snapshot, name) && snapshot[name] !== next) changed = true;
      snapshot[name] = next;

    started = true;
  }

  sync();
  globalThis.__ratpackIcueSyncGlobals = sync;
  globalThis.__ratpackIcueBindingSync = { version: 1, names: names.slice() };
  setInterval(sync, 200);
