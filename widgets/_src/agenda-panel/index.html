<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/svg+xml" href="resources/icon.svg" />
<title>tr('Calendar Panel')</title>

<meta name="x-icue-property" content="calendarUrl1" data-label="tr('Calendar URL 1')" data-type="textfield" data-default="''" />
<meta name="x-icue-property" content="calendarUrl2" data-label="tr('Calendar URL 2')" data-type="textfield" data-default="''" />
<meta name="x-icue-property" content="calendarUrl3" data-label="tr('Calendar URL 3')" data-type="textfield" data-default="''" />
<meta name="x-icue-property" content="refreshMinutes" data-label="tr('Refresh')" data-type="slider" data-min="1" data-max="60" data-step="1" data-unit-label="'min'" data-default="15" />
<meta name="x-icue-property" content="use24Hour" data-label="tr('24 Hour Time')" data-type="switch" data-default="false" />
<meta name="x-icue-property" content="textColor" data-label="tr('Text Color')" data-type="color" data-default="'#F4F6F8'" />
<meta name="x-icue-property" content="accentColor" data-label="tr('Accent Color')" data-type="color" data-default="'#2BE86A'" />
<meta name="x-icue-property" content="backgroundColor" data-label="tr('Background Color')" data-type="color" data-default="'#07090D'" />

<script type="application/json" id="x-icue-groups">
[
  {
    "title": "tr('Calendars')",
    "properties": ["calendarUrl1", "calendarUrl2", "calendarUrl3", "refreshMinutes", "use24Hour"],
    "info": "tr('Paste secret ICS feed URLs. Blocked feeds use Packrat\'s stateless relay; URLs and calendar data are not stored.')"
  },
  {
    "title": "tr('Appearance')",
    "properties": ["textColor", "accentColor", "backgroundColor"]
  }
]
</script>

<link rel="stylesheet" href="agenda.css" />
<link rel="stylesheet" href="agenda-responsive.css" />
</head>
<body data-slot="s-h" data-mode="today" data-state="unconfigured">
<main id="agendaStage" aria-label="Calendar Panel">
  <header id="topbar">
    <div id="brandBlock">
      <span id="brandLabel">CALENDAR</span>
      <span id="dayLabel">TODAY</span>
    </div>
    <div id="statusBlock">
      <span id="freshnessLabel">NOT CONFIGURED</span>
      <button id="refreshButton" class="interactive iconButton" type="button" aria-label="Refresh calendar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0 2 5M20 4v7h-7" /></svg>
      </button>
    </div>
  </header>

  <section id="contentGrid">
    <button id="heroCard" class="interactive" type="button" aria-label="Switch calendar range">
      <span id="heroEyebrow">NEXT UP</span>
      <span id="heroTitle">Your day is clear</span>
      <span id="heroTime"></span>
      <span id="heroCountdown"></span>
      <span id="heroLocation"></span>
      <span id="heroToggle">TAP FOR NEXT 3 DAYS</span>
    </button>

    <section id="timelinePanel" aria-label="Day timeline">
      <div id="allDayRail">
        <span id="allDayLabel">ALL DAY</span>
        <div id="allDayItems"></div>
      </div>
      <div id="axisWrap">
        <div id="axisLabels"></div>
        <div id="timelineViewport">
          <div id="gridLines"></div>
          <div id="nowMarker" aria-hidden="true"><span>NOW</span></div>
          <div id="eventRows"></div>
        </div>
      </div>
      <div id="emptyState">
        <span id="emptyTitle">Your day is clear</span>
        <span id="emptyHint">No events on the calendar.</span>
      </div>
    </section>

    <section id="compactAgenda" aria-label="Agenda list">
      <div id="compactList"></div>
    </section>
  </section>

  <section id="detailOverlay" aria-hidden="true">
    <button id="detailClose" class="interactive iconButton" type="button" aria-label="Close details">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
    </button>
    <div id="detailEyebrow">EVENT</div>
    <div id="detailTitle"></div>
    <div id="detailTime"></div>
    <div id="detailLocation"></div>
    <div id="detailDescription"></div>
  </section>
</main>
<script src="agenda-core.js"></script>
<script src="agenda-recur.js"></script>
<script src="ical-pack-01.js"></script>
<script src="ical-pack-02.js"></script>
<script src="ical-pack-03.js"></script>
<script src="ical-pack-04.js"></script>
<script src="ical-pack-05.js"></script>
<script src="ical-pack-06.js"></script>
<script src="ical-pack-07.js"></script>
<script src="ical-pack-08.js"></script>
<script src="ical-loader.js"></script>
<script src="agenda-ical.js"></script>
<script src="agenda-data.js"></script>
<script src="agenda-timeline.js"></script>
<script src="agenda-view.js"></script>
</body>
</html>
