<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/svg+xml" href="resources/icon.svg" />
<title>tr('Discord Voice Panel for XENEON Edge')</title>

<meta name="x-icue-property" content="showRecentActivity" data-label="tr('Show Recent Activity')" data-type="switch" data-default="true" />
<meta name="x-icue-property" content="textColor" data-label="tr('Text Color')" data-type="color" data-default="'#F4F6F8'" />
<meta name="x-icue-property" content="accentColor" data-label="tr('Accent Color')" data-type="color" data-default="'#2BE86A'" />
<meta name="x-icue-property" content="backgroundColor" data-label="tr('Background Color')" data-type="color" data-default="'#090B10'" />
<meta name="x-icue-property" content="panelOpacity" data-label="tr('Panel Opacity')" data-type="slider" data-min="0" data-max="100" data-step="5" data-unit-label="'%'" data-default="100" />
<meta name="x-icue-property" content="fontFamily" data-label="tr('Font')" data-type="combobox" data-values='[{"key":"default","value":"Default"},{"key":"segoe","value":"Segoe UI"},{"key":"bahnschrift","value":"Bahnschrift"},{"key":"arial","value":"Arial"},{"key":"consolas","value":"Consolas"},{"key":"georgia","value":"Georgia"}]' data-default="'default'" />

<script type="application/json" id="x-icue-groups">
[
  {
    "title": "tr('Voice')",
    "properties": ["showRecentActivity"],
    "info": "tr('Recent speaking activity stays in memory only for this widget session.')"
  },
  {
    "title": "tr('Appearance')",
    "properties": ["textColor", "accentColor", "backgroundColor", "panelOpacity", "fontFamily"]
  }
]
</script>

<link rel="stylesheet" href="discord-panel.css" />
<link rel="stylesheet" href="discord-panel-fixes.css" />
<link rel="stylesheet" href="discord-panel-roster.css" />
</head>
<body data-slot="s-h" data-state="setup">
<main id="stage" aria-label="Discord Voice Panel for XENEON Edge">
  <div id="ambient" aria-hidden="true"></div>

  <section id="shell">
    <header id="topbar">
      <div id="channelMark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M7 9v6M11 7v10M15 9v6M19 11v2M3 11v2" /></svg>
      </div>
      <div id="channelCopy">
        <div id="eyebrow" class="label">VOICE CHANNEL</div>
        <div id="channelName">Connecting to Discord</div>
      </div>
      <div id="memberCount" class="count-pill">0 members</div>
      <div id="accountChip" aria-label="Account">
        <span id="accountDot"></span>
        <span id="accountName">Discord</span>
      </div>
    </header>

    <section id="content">
      <div id="rosterPanel">
        <div id="roster" role="list" aria-label="Voice channel members"></div>
        <section id="emptyState" aria-live="polite">
          <div id="emptyIcon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M6 9a6 6 0 0 1 12 0v5a3 3 0 0 1-3 3h-1v-6h4M6 11H2v3a3 3 0 0 0 3 3h1v-6" /></svg>
          </div>
          <div id="emptyTitle">Connecting to Discord</div>
          <div id="emptyHint">The panel will update automatically.</div>
          <button id="authorizeButton" class="interactive secondary-action" type="button">Connect Discord</button>
        </section>
      </div>

      <aside id="activityPanel" aria-label="Recent activity">
        <div id="activityHeader">
          <span id="activityTitle" class="label">RECENT ACTIVITY</span>
          <span id="activityCount" class="label">0</span>
        </div>
        <ol id="activityList"></ol>
        <div id="activityEmpty">No recent speakers yet</div>
      </aside>
    </section>

    <nav id="voiceControls" aria-label="Voice controls">
      <button id="muteButton" class="voice-button interactive" type="button" disabled>
        <span class="button-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3zM5 11v1a7 7 0 0 0 14 0v-1M12 19v3M9 22h6" /></svg>
        </span>
        <span id="muteLabel">Mute</span>
      </button>
      <button id="deafenButton" class="voice-button interactive" type="button" disabled>
        <span class="button-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M4 13v-2a8 8 0 0 1 16 0v2M4 13h3v7H5a2 2 0 0 1-2-2v-3a2 2 0 0 1 1-2zM20 13h-3v7h2a2 2 0 0 0 2-2v-3a2 2 0 0 0-1-2z" /></svg>
        </span>
        <span id="deafenLabel">Deafen</span>
      </button>
    </nav>
  </section>

  <section id="memberDetail" class="detail-sheet" aria-hidden="true">
    <button id="detailClose" class="detail-close interactive" type="button" aria-label="Close details">×</button>
    <div id="detailAvatar" class="detail-avatar"></div>
    <div id="detailDisplayName"></div>
    <div id="detailUsername"></div>
    <div id="detailStates"></div>
  </section>
</main>
<script src="discord-panel-ui.js"></script>
<script src="discord-panel-appearance.js"></script>
<script src="discord-panel-stable-roster.js"></script>
<script src="discord-panel-rpc.js"></script>
<script src="discord-panel.js"></script>
</body>
</html>
