<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<link rel="icon" type="image/svg+xml" href="resources/icon.svg" />
<title>Snake</title>

<meta name="x-icue-property" content="themePreset" data-label="'Theme'" data-type="tab-buttons"
      data-default="'matrix'"
      data-values="[{'key':'matrix','value':'Matrix'},{'key':'ice','value':'Ice'},{'key':'ember','value':'Ember'},{'key':'mono','value':'Mono'}]" />
<meta name="x-icue-property" content="showTouchGuides" data-label="'Touch Guides'" data-type="switch" data-default="true" />

<script type="application/json" id="x-icue-groups">
[
  {
    "title": "'Game'",
    "properties": ["themePreset", "showTouchGuides"],
    "info": "'Swipe anywhere, tap the edge arrows, or use keyboard arrow keys while the widget has focus. High score and paused progress are stored locally on this PC.'"
  }
]
</script>

<link rel="stylesheet" href="snake.css" />
</head>
<body data-slot="s-h" data-state="ready" data-theme="matrix">
<main id="app" aria-label="Snake game">
  <header id="hud">
    <div class="brand-block">
      <div class="eyebrow">PACKRAT • SNAKE</div>
      <div id="statusText">READY</div>
    </div>

    <div class="score-block" aria-label="Score">
      <span class="score-label">SCORE</span>
      <strong id="scoreValue">0</strong>
    </div>

    <div class="score-block high-score" aria-label="High score">
      <span class="score-label">BEST</span>
      <strong id="highScoreValue">0</strong>
    </div>

    <div id="hudActions">
      <button id="pauseButton" class="hud-button" type="button" aria-label="Pause or resume game">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path class="pause-icon" d="M7 5h3v14H7zm7 0h3v14h-3z"></path>
          <path class="play-icon" d="M8 5v14l11-7z"></path>
        </svg>
        <span>Pause</span>
      </button>
      <button id="restartButton" class="hud-button" type="button" aria-label="Restart game">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.5 6.5A8 8 0 1 0 20 16h-3a5 5 0 1 1-.7-6.1L13 13h8V5l-2.5 1.5z"></path></svg>
        <span>Restart</span>
      </button>
    </div>
  </header>

  <section id="boardShell" aria-label="Snake board">
    <canvas id="gameCanvas"></canvas>

    <button class="touch-zone touch-up" data-direction="up" type="button" aria-label="Turn up">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 15l7-7 7 7"></path></svg>
    </button>
    <button class="touch-zone touch-right" data-direction="right" type="button" aria-label="Turn right">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
    </button>
    <button class="touch-zone touch-down" data-direction="down" type="button" aria-label="Turn down">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9l7 7 7-7"></path></svg>
    </button>
    <button class="touch-zone touch-left" data-direction="left" type="button" aria-label="Turn left">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </button>

    <div id="overlay" aria-live="polite">
      <div class="overlay-card">
        <div id="overlayKicker">A PACKRAT GAME</div>
        <h1 id="overlayTitle">Snake</h1>
        <p id="overlayText">Swipe, tap the edge arrows, or use your keyboard arrow keys. Eat. Grow. Don't fold.</p>
        <button id="primaryButton" type="button">Play</button>
        <button id="packratLink" type="button">More from PackRat ↗</button>
      </div>
    </div>
  </section>

  <footer id="footer">
    <span id="speedLabel">SPEED 1</span>
    <span id="controlHint">SWIPE • TAP • ARROW KEYS</span>
  </footer>
</main>
<script src="snake.js"></script>
<script src="snake-icue-live-settings.js"></script>
</body>
</html>
