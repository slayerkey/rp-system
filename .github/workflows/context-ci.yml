name: RatPack Lightweight CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  context:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate canonical context
        run: python tests/check_context.py

      - name: Validate JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('.').rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
              print(f'OK {path}')
          PY

      - name: Validate plugin release metadata
        run: python tests/check_plugin_release_metadata.py

      - name: Validate Maker Console runtime patches
        run: node tests/check_maker_console_patch.mjs

      - name: Validate local PowerShell syntax
        shell: pwsh
        run: |
          $failures = @()
          Get-ChildItem tools/local -Filter *.ps1 -File | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) {
              $failures += $_.FullName
              $errors | ForEach-Object { Write-Host "$($_.Extent.File):$($_.Extent.StartLineNumber) $($_.Message)" }
            }
          }
          if ($failures.Count) {
            throw "PowerShell syntax errors found in: $($failures -join ', ')"
          }

      - name: Validate Stream Deck profile builder
        run: node tests/check_streamdeck_profile_builder.mjs

      - name: Validate Rat Dev source resolution
        shell: pwsh
        run: ./tests/check_rat_dev_source_resolution.ps1

      - name: Validate Rat Dev profile deduplication
        shell: pwsh
        run: ./tests/check_rat_dev_profile_open.ps1

      - name: Validate Rat Dev dependency sync
        shell: pwsh
        run: ./tests/check_rat_dev_dependency_sync.ps1

      - name: Validate Rat Dev failure UX
        shell: pwsh
        run: ./tests/check_rat_dev_failure_ux.ps1

      - name: Validate Rat Dev native build locks
        shell: pwsh
        run: ./tests/check_rat_dev_native_build_lock.ps1

      - name: Validate external Rat Dev lifecycle
        shell: pwsh
        run: ./tests/check_rat_dev_external.ps1

      - name: Validate Rat Audit lifecycle
        shell: pwsh
        run: ./tests/check_rat_audit.ps1
