name: RatPack Lightweight CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  context:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Validate canonical context
        run: python tests/check_context.py

      - name: Validate JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('.').rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
              print(f'OK {path}')
          PY

      - name: Validate icon-pack Rat kit contract
        run: |
          python -m pip install Pillow
          python tests/check_icon_pack_contract.py
          python tests/check_icon_pack_rat_art.py

      - name: Validate Maker Console runtime patches
        run: node tests/check_maker_console_patch.mjs

      - name: Validate local PowerShell syntax
        shell: pwsh
        run: |
          $failures = @()
          Get-ChildItem tools/local -Filter *.ps1 -File | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) {
              $failures += $_.FullName
              $errors | ForEach-Object { Write-Host "$($_.Extent.File):$($_.Extent.StartLineNumber) $($_.Message)" }
            }
          }
          if ($failures.Count) {
            throw "PowerShell syntax errors found in: $($failures -join ', ')"
          }

      - name: Validate Rat Dev dependency sync
        shell: pwsh
        run: ./tests/check_rat_dev_dependency_sync.ps1

      - name: Validate external Rat Dev lifecycle
        shell: pwsh
        run: ./tests/check_rat_dev_external.ps1

      - name: Validate Rat Audit lifecycle
        shell: pwsh
        run: ./tests/check_rat_audit.ps1
