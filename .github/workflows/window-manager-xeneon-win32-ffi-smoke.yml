name: Window Manager XENEON Win32 FFI Smoke

on:
  push:
    branches:
      - product/window-manager-xeneon
    paths:
      - '.github/workflows/window-manager-xeneon-win32-ffi-smoke.yml'
      - 'ci/window-manager-xeneon-win32-ffi-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test Window Manager Win32 bindings
        shell: pwsh
        run: |
          npm init -y
          npm install koffi@3.1.4 --save-exact

          @'
          const fs = require("fs");
          const koffi = require("koffi");
          const user32 = koffi.load("user32.dll");
          const dwmapi = koffi.load("dwmapi.dll");

          const RECT = koffi.struct("RECT", {
            left: "long", top: "long", right: "long", bottom: "long"
          });
          const MONITORINFO = koffi.struct("MONITORINFO", {
            cbSize: "uint32_t", rcMonitor: RECT, rcWork: RECT, dwFlags: "uint32_t"
          });
          if (koffi.sizeof(MONITORINFO) !== 40) throw new Error("MONITORINFO must be 40 bytes");

          const PostMessageW = user32.func(
            "bool __stdcall PostMessageW(void *hWnd, unsigned int Msg, uintptr_t wParam, intptr_t lParam)"
          );
          const EnumWindowsProto = koffi.proto(
            "bool __stdcall WindowEnumProc(void *hWnd, long long lparam)"
          );
          const EnumWindows = user32.func(
            "bool __stdcall EnumWindows(WindowEnumProc *callback, long long lparam)"
          );
          const MonitorProto = koffi.proto(
            "bool __stdcall MonitorEnumProc(void *hMonitor, void *hdc, RECT *rect, long long lparam)"
          );
          const EnumDisplayMonitors = user32.func(
            "bool __stdcall EnumDisplayMonitors(void *hdc, RECT *clip, MonitorEnumProc *callback, long long lparam)"
          );
          const GetMonitorInfoW = user32.func(
            "bool __stdcall GetMonitorInfoW(void *hMonitor, _Inout_ MONITORINFO *lpmi)"
          );
          const DwmGetWindowAttribute = dwmapi.func(
            "long __stdcall DwmGetWindowAttribute(void *hwnd, unsigned long dwAttribute, _Out_ void *pvAttribute, unsigned long cbAttribute)"
          );

          let windowCount = 0;
          const wcb = koffi.register((hwnd) => {
            windowCount++;
            const cloaked = Buffer.alloc(4);
            DwmGetWindowAttribute(hwnd, 14, cloaked, 4);
            return true;
          }, koffi.pointer(EnumWindowsProto));
          try {
            if (!EnumWindows(wcb, 0)) throw new Error("EnumWindows failed");
          } finally {
            koffi.unregister(wcb);
          }

          let monitorCount = 0;
          const mcb = koffi.register((hmon) => {
            const info = { cbSize: koffi.sizeof(MONITORINFO) };
            if (!GetMonitorInfoW(hmon, info)) throw new Error("GetMonitorInfoW failed");
            monitorCount++;
            return true;
          }, koffi.pointer(MonitorProto));
          try {
            if (!EnumDisplayMonitors(null, null, mcb, 0)) throw new Error("EnumDisplayMonitors failed");
          } finally {
            koffi.unregister(mcb);
          }

          if (monitorCount < 1) throw new Error("No monitors enumerated");
          if (typeof PostMessageW !== "function") throw new Error("PostMessageW binding failed");

          fs.mkdirSync("ci", { recursive: true });
          fs.writeFileSync("ci/window-manager-xeneon-win32-ffi-pass.json", JSON.stringify({
            ok: true,
            node: process.version,
            platform: process.platform,
            arch: process.arch,
            koffi: require("koffi/package.json").version,
            windowCount,
            monitorCount,
            tested: [
              "MONITORINFO layout",
              "PostMessageW uintptr_t/intptr_t",
              "EnumWindows",
              "DwmGetWindowAttribute",
              "EnumDisplayMonitors",
              "GetMonitorInfoW"
            ]
          }, null, 2) + "\n");
          '@ | Set-Content -Encoding UTF8 win32-smoke.cjs

          node win32-smoke.cjs

      - name: Commit pass marker
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci/window-manager-xeneon-win32-ffi-pass.json
          git commit -m "Record Window Manager XENEON Win32 FFI smoke pass"
          git push origin HEAD:product/window-manager-xeneon
