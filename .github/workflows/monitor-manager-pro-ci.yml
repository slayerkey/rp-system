name: Monitor Manager Pro CI

on:
  push:
    branches:
      - product/monitor-manager-pro
      - main
    paths:
      - 'plugins/monitor-manager-pro/**'
      - 'plugins/monitor-manager-lite/src/runtime.ts'
      - 'plugins/_shared/monitor-manager/**'
      - 'products/monitor-manager-pro.json'
      - 'products/index.json'
      - 'products/lite-pro-map.json'
      - 'tools/art/**'
      - 'tools/local/rat-ship-plugin.ps1'
      - '.github/workflows/monitor-manager-pro-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - product/monitor-manager-lite
    paths:
      - 'plugins/monitor-manager-pro/**'
      - 'plugins/monitor-manager-lite/src/runtime.ts'
      - 'plugins/_shared/monitor-manager/**'
      - 'products/monitor-manager-pro.json'
      - 'products/index.json'
      - 'products/lite-pro-map.json'
      - '.github/workflows/monitor-manager-pro-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitor-manager-pro-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-streamdeck:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: plugins/monitor-manager-pro/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install locked dependencies
        working-directory: plugins/monitor-manager-pro
        run: npm ci --no-fund --no-audit

      - name: Install deterministic Rat Art runtime
        run: python -m pip install Pillow==11.3.0

      - name: Build plugin and bundled V2 profiles
        working-directory: plugins/monitor-manager-pro
        run: npm run build

      - name: Run fixtures
        working-directory: plugins/monitor-manager-pro
        run: npm test

      - name: Compile and scan Windows monitor helper
        working-directory: plugins/monitor-manager-pro
        shell: pwsh
        run: ./scripts/host-audit.ps1

      - name: Verify plugin icon dimensions
        working-directory: plugins/monitor-manager-pro
        shell: pwsh
        run: |
          python -c "from PIL import Image; from pathlib import Path; p=Path('com.packrat.monitormanagerpro.sdPlugin/imgs/plugin'); expected={'marketplace.png':(256,256),'marketplace@2x.png':(512,512)}; bad=[(n,Image.open(p/n).size,s) for n,s in expected.items() if Image.open(p/n).size!=s]; assert not bad,bad; print('PLUGIN ICON PASS')"

      - name: Validate with official Stream Deck CLI
        working-directory: plugins/monitor-manager-pro
        run: npx streamdeck validate com.packrat.monitormanagerpro.sdPlugin --no-update-check

      - name: Package release candidate
        working-directory: plugins/monitor-manager-pro
        run: npx streamdeck pack com.packrat.monitormanagerpro.sdPlugin --output dist --force --no-update-check --no-file-list

      - name: Render deterministic Marketplace media
        shell: pwsh
        working-directory: plugins/monitor-manager-pro
        run: ./rat-art.ps1 -Destination (Join-Path $PWD 'dist\marketplace')

      - name: Verify Marketplace media dimensions
        working-directory: plugins/monitor-manager-pro
        shell: pwsh
        run: |
          python -c "from PIL import Image; from pathlib import Path; p=Path('dist/marketplace'); expected={'01_search_icon.png':(512,512),'02_cover.png':(1920,960),'03_gallery_01.png':(1920,960),'04_gallery_02.png':(1920,960),'05_gallery_03.png':(1920,960),'06_gallery_04.png':(1920,960)}; bad=[(n,Image.open(p/n).size,s) for n,s in expected.items() if Image.open(p/n).size!=s]; assert not bad,bad; print('MARKETPLACE MEDIA PASS')"

      - name: Exercise canonical Rat Ship plugin kit
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'monitor-manager-pro-ship-kit'
          ./tools/local/rat-ship-plugin.ps1 -PluginSlug monitor-manager-pro -Destination $dest
          $required = @(
            'monitor-manager-pro.streamDeckPlugin',
            'submission.json',
            'PASTE_description.txt',
            'PASTE_release_notes.txt',
            '01_search_icon.png',
            '02_cover.png',
            '03_gallery_01.png',
            '04_gallery_02.png',
            '05_gallery_03.png',
            '06_gallery_04.png'
          )
          $missing = @($required | Where-Object { -not (Test-Path (Join-Path $dest $_)) })
          if ($missing.Count) { throw "Canonical Pro ship kit is incomplete: $($missing -join ', ')" }
          $review = Join-Path $PWD 'plugins\monitor-manager-pro\dist\ship-marketplace'
          New-Item -ItemType Directory -Force -Path $review | Out-Null
          foreach ($name in @('01_search_icon.png','02_cover.png','03_gallery_01.png','04_gallery_02.png','05_gallery_03.png','06_gallery_04.png')) {
            Copy-Item (Join-Path $dest $name) (Join-Path $review $name) -Force
          }
          Write-Host 'MONITOR MANAGER PRO RAT SHIP KIT PASS'

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: monitor-manager-pro
          path: |
            plugins/monitor-manager-pro/dist/*.streamDeckPlugin
            plugins/monitor-manager-pro/dist/marketplace/*.png
            plugins/monitor-manager-pro/dist/ship-marketplace/*.png
          if-no-files-found: error
