name: Performance Grapher Stream Deck

on:
  push:
    branches:
      - product/performance-grapher-streamdeck
    paths:
      - "plugins/performance-grapher-streamdeck/**"
      - "products/performance-grapher-streamdeck.json"
      - "products/index.json"
      - ".github/workflows/performance-grapher-streamdeck.yml"
  pull_request:
    branches:
      - main
    paths:
      - "plugins/performance-grapher-streamdeck/**"
      - "products/performance-grapher-streamdeck.json"
      - "products/index.json"
      - ".github/workflows/performance-grapher-streamdeck.yml"

permissions:
  contents: read

jobs:
  qa:
    name: Windows build, provider probe, Stream Deck validation
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: plugins/performance-grapher-streamdeck

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: plugins/performance-grapher-streamdeck/package-lock.json

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Compile Rat Art script
        run: python -m py_compile scripts/rat-art-release.py

      - name: Install Rat Art dependency
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Locked npm install
        run: npm ci

      - name: JavaScript syntax gate
        run: npm run check:syntax

      - name: Unit, failure-state, and synthetic performance QA
        run: npm test

      - name: Build plugin and pinned telemetry providers
        run: npm run build

      - name: Probe Libre Hardware Monitor helper
        shell: pwsh
        run: |
          $exe = Resolve-Path "com.packrat.performance-grapher.sdPlugin/native/telemetry/PackRat.PerformanceTelemetry.exe"
          $output = & $exe --probe
          if ($LASTEXITCODE -ne 0) { throw "Native telemetry probe failed with $LASTEXITCODE" }
          $joined = ($output -join [Environment]::NewLine)
          if ($joined -notmatch '"type":"sample"' -and $joined -notmatch '"status":"unavailable"') {
            throw "Native telemetry probe emitted neither a sample nor an explicit unavailable state."
          }
          Write-Host $joined

      - name: Sample sensor-helper overhead ceiling
        shell: pwsh
        run: |
          $exe = Resolve-Path "com.packrat.performance-grapher.sdPlugin/native/telemetry/PackRat.PerformanceTelemetry.exe"
          $stdout = Join-Path $env:RUNNER_TEMP "perf-helper-out.txt"
          $stderr = Join-Path $env:RUNNER_TEMP "perf-helper-err.txt"
          $p = Start-Process -FilePath $exe -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          Start-Sleep -Seconds 2
          $p.Refresh()
          if ($p.HasExited) {
            $out = if (Test-Path $stdout) { Get-Content $stdout -Raw } else { "" }
            $err = if (Test-Path $stderr) { Get-Content $stderr -Raw } else { "" }
            if ($p.ExitCode -eq 2 -and $out -match '"type":"status"' -and $out -match '"status":"unavailable"') {
              Write-Host "HELPER_BENCH skipped: clean runner explicitly reported hardware provider unavailable."
            } else {
              throw "Sensor helper exited unexpectedly during benchmark. exit=$($p.ExitCode) stdout=$out stderr=$err"
            }
          } else {
            $cpu0 = $p.TotalProcessorTime.TotalSeconds
            Start-Sleep -Seconds 6
            $p.Refresh()
            $cpu1 = $p.TotalProcessorTime.TotalSeconds
            $workingMb = $p.WorkingSet64 / 1MB
            $normalizedCpu = (($cpu1 - $cpu0) / 6 / [Environment]::ProcessorCount) * 100
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Write-Host ("HELPER_BENCH normalized_cpu_pct={0:N3} working_set_mb={1:N1}" -f $normalizedCpu, $workingMb)
            if ($normalizedCpu -gt 5.0) { throw "Sensor helper exceeded 5% normalized CI ceiling." }
            if ($workingMb -gt 180) { throw "Sensor helper exceeded 180 MB CI working-set ceiling." }
          }

      - name: Validate with official Elgato CLI
        run: npm run validate

      - name: Package official .streamDeckPlugin
        run: npm run pack

      - name: Verify bundled profiles are inside official package
        shell: pwsh
        run: |
          $package = Get-ChildItem -Path dist -Filter *.streamDeckPlugin | Select-Object -First 1
          if (-not $package) { throw "No .streamDeckPlugin produced." }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($package.FullName)
          try {
            $entries = @($archive.Entries | ForEach-Object { $_.FullName.Replace('\\', '/') })
            $profiles = @(
              "performance-dashboard-mk2.streamDeckProfile",
              "performance-dashboard-xl.streamDeckProfile",
              "performance-dashboard-plus.streamDeckProfile",
              "performance-dashboard-neo.streamDeckProfile"
            )
            foreach ($profile in $profiles) {
              $suffix = "/profiles/$profile"
              $matches = @($entries | Where-Object { $_ -eq "profiles/$profile" -or $_.EndsWith($suffix, [System.StringComparison]::Ordinal) })
              if ($matches.Count -ne 1) {
                throw "Official package must contain exactly one bundled profile '$profile'; found $($matches.Count)."
              }
              Write-Host "PACKAGED PROFILE PASS: $($matches[0])"
            }
          }
          finally {
            $archive.Dispose()
          }

      - name: Generate deterministic Marketplace media
        run: python scripts/rat-art-release.py --destination dist/marketplace-media

      - name: Verify media and package bounds
        shell: pwsh
        run: |
          $required = @(
            "01_search_icon.png",
            "02_cover.png",
            "03_gallery_01.png",
            "04_gallery_02.png",
            "05_gallery_03.png",
            "06_gallery_04.png"
          )
          foreach ($name in $required) {
            $path = Join-Path "dist/marketplace-media" $name
            if (-not (Test-Path $path)) { throw "Missing media: $name" }
          }
          $thumbnailReview = "dist/marketplace-qa/hero-thumbnail-review.png"
          if (-not (Test-Path $thumbnailReview)) { throw "Missing Marketplace V2 thumbnail review sheet." }
          $profiles = @(
            "performance-dashboard-mk2.streamDeckProfile",
            "performance-dashboard-xl.streamDeckProfile",
            "performance-dashboard-plus.streamDeckProfile",
            "performance-dashboard-neo.streamDeckProfile"
          )
          foreach ($profile in $profiles) {
            $profilePath = Join-Path "com.packrat.performance-grapher.sdPlugin/profiles" $profile
            if (-not (Test-Path $profilePath)) { throw "Missing bundled profile: $profile" }
          }
          foreach ($licenseEvidence in @(
            "com.packrat.performance-grapher.sdPlugin/licenses/PresentMon-MIT-v2.5.1.txt",
            "com.packrat.performance-grapher.sdPlugin/licenses/npm/NPM_LICENSE_INVENTORY.json",
            "com.packrat.performance-grapher.sdPlugin/licenses/npm/NPM_LICENSE_INVENTORY.md",
            "com.packrat.performance-grapher.sdPlugin/licenses/dotnet/NUGET_LICENSE_INVENTORY.json",
            "com.packrat.performance-grapher.sdPlugin/licenses/dotnet/NUGET_LICENSE_INVENTORY.md"
          )) {
            if (-not (Test-Path $licenseEvidence)) { throw "Missing dependency license evidence: $licenseEvidence" }
          }
          $package = Get-ChildItem -Path dist -Filter *.streamDeckPlugin | Select-Object -First 1
          if (-not $package) { throw "No .streamDeckPlugin produced." }
          $sizeMb = $package.Length / 1MB
          Write-Host ("PACKAGE size_mb={0:N1} path={1}" -f $sizeMb, $package.FullName)
          if ($sizeMb -ge 500) { throw "PackRat CI package ceiling exceeded: 500 MB." }

      - name: Stage validated release candidate
        id: stage
        shell: pwsh
        run: |
          $package = Get-ChildItem -Path dist -Filter *.streamDeckPlugin | Select-Object -First 1
          if (-not $package) { throw "No .streamDeckPlugin produced." }
          $stage = Join-Path $env:RUNNER_TEMP "performance-grapher-streamdeck-release"
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path (Join-Path $stage "dist/marketplace-art") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $stage "dist/marketplace-qa") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $stage "license-evidence") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $stage "profiles") | Out-Null
          Copy-Item $package.FullName (Join-Path $stage "dist/com.packrat.performance-grapher.streamDeckPlugin")
          Copy-Item "dist/marketplace-media/*" (Join-Path $stage "dist/marketplace-art") -Force
          Copy-Item "dist/marketplace-qa/*" (Join-Path $stage "dist/marketplace-qa") -Force
          Copy-Item "com.packrat.performance-grapher.sdPlugin/licenses/npm/NPM_LICENSE_INVENTORY.*" (Join-Path $stage "license-evidence") -Force
          Copy-Item "com.packrat.performance-grapher.sdPlugin/licenses/dotnet/NUGET_LICENSE_INVENTORY.*" (Join-Path $stage "license-evidence") -Force
          Copy-Item "com.packrat.performance-grapher.sdPlugin/licenses/PresentMon-MIT-v2.5.1.txt" (Join-Path $stage "license-evidence") -Force
          Copy-Item "com.packrat.performance-grapher.sdPlugin/licenses/THIRD_PARTY_NOTICES.md" (Join-Path $stage "license-evidence") -Force
          Copy-Item "com.packrat.performance-grapher.sdPlugin/profiles/*.streamDeckProfile" (Join-Path $stage "profiles") -Force
          Copy-Item "com.packrat.performance-grapher.sdPlugin/third_party/presentmon/provider.json" (Join-Path $stage "provider.json")
          Copy-Item "com.packrat.performance-grapher.sdPlugin/third_party/presentmon/SHA256.txt" (Join-Path $stage "SHA256.txt")
          Copy-Item "QA.md" (Join-Path $stage "QA.md")
          Copy-Item "REAL_WINDOWS_SMOKE.md" (Join-Path $stage "REAL_WINDOWS_SMOKE.md")

          $packageHash = (Get-FileHash -Algorithm SHA256 (Join-Path $stage "dist/com.packrat.performance-grapher.streamDeckPlugin")).Hash.ToLowerInvariant()
          $helperHash = (Get-FileHash -Algorithm SHA256 "com.packrat.performance-grapher.sdPlugin/native/telemetry/PackRat.PerformanceTelemetry.exe").Hash.ToLowerInvariant()
          $presentMonHash = (Get-FileHash -Algorithm SHA256 "com.packrat.performance-grapher.sdPlugin/third_party/presentmon/PresentMon.exe").Hash.ToLowerInvariant()
          $packageBytes = (Get-Item (Join-Path $stage "dist/com.packrat.performance-grapher.streamDeckPlugin")).Length
          $evidence = [ordered]@{
            product = "Performance Grapher for Stream Deck"
            version = "1.0.0.0"
            commit = "${{ github.event.pull_request.head.sha || github.sha }}"
            checkout_commit = "${{ github.sha }}"
            run_id = "${{ github.run_id }}"
            package_sha256 = $packageHash
            package_bytes = $packageBytes
            helper_sha256 = $helperHash
            presentmon_sha256 = $presentMonHash
            presentmon_version = "2.5.1"
            libre_hardware_monitor = "0.9.6"
            javascript_syntax_gate = "PASS"
            unit_fixture_tests = "PASS"
            synthetic_performance = "PASS"
            native_provider_probe = "PASS_OR_EXPLICIT_UNAVAILABLE"
            native_helper_benchmark = "PASS_OR_EXPLICIT_UNAVAILABLE"
            official_elgato_validation = "PASS"
            official_elgato_packaging = "PASS"
            deterministic_marketplace_media = "PASS"
            marketplace_v2_thumbnail_review = "PASS"
            runtime_npm_license_inventory = "PASS"
            nuget_license_inventory = "PASS"
            presentmon_standalone_license = "PASS"
            bundled_profiles = "PASS_MK2_XL_PLUS_NEO"
            real_game_hardware_smoke = "PENDING"
          }
          $evidence | ConvertTo-Json -Depth 4 | Set-Content -Path (Join-Path $stage "evidence.json") -Encoding UTF8
          "release_stage=$stage" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "PACKAGE_SHA256=$packageHash"
          Write-Host "PACKAGE_BYTES=$packageBytes"

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: performance-grapher-streamdeck-release-candidate
          path: ${{ steps.stage.outputs.release_stage }}
          if-no-files-found: error
          retention-days: 14
