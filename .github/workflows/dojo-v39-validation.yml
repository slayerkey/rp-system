name: Validate Dojo v39 on PackRat PC

on:
  push:
    branches:
      - ci/dojo-v39-validation
    paths:
      - ".github/workflows/dojo-v39-validation.yml"

permissions:
  contents: read

jobs:
  validate-dojo:
    runs-on: [self-hosted, Windows, X64, packrat]
    timeout-minutes: 20

    steps:
      - name: Verify local GitHub CLI access
        shell: powershell
        run: |
          gh --version
          gh auth status

      - name: Fetch Dojo feature branch
        shell: powershell
        run: |
          $work = Join-Path $env:RUNNER_TEMP "dojo-v39-validation"
          if (Test-Path $work) {
            Remove-Item -Recurse -Force $work
          }
          gh repo clone slayerkey/dojo-infrastructure $work -- --branch feat/activation-audit-phase1 --single-branch
          Set-Content -Path $env:GITHUB_ENV -Value "DOJO_WORK=$work"

      - name: Install dependencies
        shell: powershell
        run: |
          Set-Location (Join-Path $env:DOJO_WORK "slayerkey-dojo")
          npm install --no-audit --no-fund --ignore-scripts

      - name: Syntax checks
        shell: powershell
        run: |
          Set-Location (Join-Path $env:DOJO_WORK "slayerkey-dojo")
          node --check src/activation-core.js
          node --check src/activation-backfill.js
          node --check src/activation-audit.js
          node --check src/index-v39.js

      - name: Activation tests
        shell: powershell
        run: |
          Set-Location (Join-Path $env:DOJO_WORK "slayerkey-dojo")
          npm test

      - name: Wrangler dry run
        shell: powershell
        run: |
          Set-Location (Join-Path $env:DOJO_WORK "slayerkey-dojo")
          npx wrangler deploy --dry-run --outdir .wrangler-dry-run
