name: PackRat Marketplace Intelligence

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "tools/marketplace/**"
      - ".github/workflows/marketplace-intelligence.yml"
  pull_request:
    paths:
      - "tools/marketplace/**"
      - ".github/workflows/marketplace-intelligence.yml"
      - "skills/rat-pulse/SKILL.md"
      - "docs/STREAMDECK_MARKETPLACE_SEARCH_DATA.md"
      - "data/marketplace/**"
  schedule:
    # Daily capture of the Marketplace rolling search-demand window.
    - cron: "17 9 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: marketplace-intelligence
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Capture Query Suggestions and rebuild trend signals
        env:
          # Optional fallbacks. Normally the collector discovers the public
          # search-only Algolia credentials from the Marketplace frontend.
          PACKRAT_ALGOLIA_APP_ID: ${{ vars.PACKRAT_ALGOLIA_APP_ID }}
          PACKRAT_ALGOLIA_SEARCH_KEY: ${{ vars.PACKRAT_ALGOLIA_SEARCH_KEY }}
        run: node tools/marketplace/collect-marketplace-intelligence.mjs

      - name: Validate generated Marketplace intelligence
        run: |
          node -e "JSON.parse(require('fs').readFileSync('data/marketplace/streamdeck_search_popularity.json','utf8'))"
          node -e "const x=JSON.parse(require('fs').readFileSync('data/marketplace/marketplace-trends.json','utf8')); if(!x.latest_capture || !Array.isArray(x.terms)) process.exit(1)"

      - name: Open or refresh Marketplace intelligence PR
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain -- data/marketplace)" ]; then
            echo "Marketplace intelligence is unchanged."
            exit 0
          fi

          branch="automation/marketplace-intelligence"
          title="Refresh Marketplace intelligence $(date -u +%F)"

          git config user.name "PackRat Bot"
          git config user.email "34904637+slayerkey@users.noreply.github.com"
          git checkout -B "$branch"
          git add data/marketplace
          git commit -m "$title"
          git push --force-with-lease origin "HEAD:$branch"

          if gh pr view "$branch" --json number >/dev/null 2>&1; then
            gh pr edit "$branch" --title "$title" --body "Automated Marketplace intelligence refresh. This PR replaces the former direct-to-main bot push so main can be protected."
          else
            gh pr create --base main --head "$branch" --title "$title" --body "Automated Marketplace intelligence refresh. This PR replaces the former direct-to-main bot push so main can be protected."
          fi
