name: XENEON Public Regression Audit

on:
  push:
    branches: [main]
    paths:
      - 'tools/xeneon/inline.py'
      - 'tools/xeneon/native-style-smoke.mjs'
      - 'tools/xeneon/icue-runner-smoke.mjs'
      - 'widgets/_src/market-command-center/**'
      - '.github/workflows/xeneon-public-regression-audit.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/xeneon/inline.py'
      - 'tools/xeneon/native-style-smoke.mjs'
      - 'tools/xeneon/icue-runner-smoke.mjs'
      - 'widgets/_src/market-command-center/**'
      - '.github/workflows/xeneon-public-regression-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Public audit ${{ matrix.slug }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        slug:
          - agenda-panel
          - helldivers
          - market-command-center
          - net-dashboard
          - now-playing
          - obs-dashboard
          - pc-power-meter-pro
          - rig-battery
          - snake

    env:
      WIDGET_SLUG: ${{ matrix.slug }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generate canonical shipping widget
        shell: pwsh
        run: |
          python tools/xeneon/inline.py "$env:WIDGET_SLUG"
          python tools/xeneon/inline.py "$env:WIDGET_SLUG" --check

      - name: Official CORSAIR validate
        shell: pwsh
        run: npx --yes icuewidget-cli@0.4.47 validate "widgets/$env:WIDGET_SLUG"

      - name: Official CORSAIR package
        shell: pwsh
        run: npx --yes icuewidget-cli@0.4.47 package "widgets/$env:WIDGET_SLUG"

      - name: Extract exact official package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "artifacts/package" | Out-Null
          New-Item -ItemType Directory -Force -Path "artifacts/extracted/$env:WIDGET_SLUG" | Out-Null
          $pkg = Get-ChildItem -Path widgets -Filter *.icuewidget -File |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $pkg) { throw 'Official package command did not produce an .icuewidget archive.' }
          Copy-Item $pkg.FullName "artifacts/package/$env:WIDGET_SLUG.icuewidget"
          @'
          import os, pathlib, zipfile
          slug = os.environ['WIDGET_SLUG']
          package = pathlib.Path('artifacts/package') / f'{slug}.icuewidget'
          out = pathlib.Path('artifacts/extracted') / slug
          if not zipfile.is_zipfile(package):
              raise SystemExit(f'package is not ZIP-compatible: {package}')
          with zipfile.ZipFile(package) as archive:
              bad = archive.testzip()
              if bad:
                  raise SystemExit(f'corrupt package member: {bad}')
              archive.extractall(out)
          for required in ('index.html', 'manifest.json'):
              if not (out / required).is_file():
                  raise SystemExit(f'package missing root {required}')
          '@ | python -

      - name: Install browser test dependency
        shell: pwsh
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install chromium

      - name: Lexical iCUE settings regression
        shell: pwsh
        run: node tools/xeneon/native-style-smoke.mjs "artifacts/extracted/$env:WIDGET_SLUG/index.html" "artifacts/native-style/$env:WIDGET_SLUG"

      - name: Clone Corsair Labs iCUE Widget Runner
        shell: pwsh
        run: |
          $runnerDir = Join-Path $env:RUNNER_TEMP 'icue-widget-runner-windows'
          if (Test-Path $runnerDir) { Remove-Item -Recurse -Force $runnerDir }
          git clone --depth 1 https://github.com/Corsair-Labs/iCUE-widget-runner-windows.git $runnerDir
          git -C $runnerDir rev-parse HEAD | Set-Content "artifacts/corsair-runner-commit.txt"

      - name: Corsair Labs exact-package host smoke
        shell: pwsh
        run: |
          $runnerDir = Join-Path $env:RUNNER_TEMP 'icue-widget-runner-windows'
          $target = Join-Path (Join-Path $runnerDir 'widgets') $env:WIDGET_SLUG
          if (Test-Path $target) { Remove-Item -Recurse -Force $target }
          Copy-Item -Recurse -Force "artifacts/extracted/$env:WIDGET_SLUG" $target
          $stdout = Join-Path $env:RUNNER_TEMP "corsair-runner-$env:WIDGET_SLUG.out.log"
          $stderr = Join-Path $env:RUNNER_TEMP "corsair-runner-$env:WIDGET_SLUG.err.log"
          $process = Start-Process node -ArgumentList 'web-server.js' -WorkingDirectory $runnerDir -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              try {
                $response = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8080/api/widgets -TimeoutSec 2
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch {}
              Start-Sleep -Seconds 1
            }
            if (-not $ready) { throw 'Corsair Labs runner did not become ready.' }
            node tools/xeneon/icue-runner-smoke.mjs http://127.0.0.1:8080/ "$env:WIDGET_SLUG" "artifacts/icue-runner/$env:WIDGET_SLUG"
            if ($LASTEXITCODE -ne 0) { throw "Corsair Labs runner smoke failed with exit code $LASTEXITCODE" }
          }
          finally {
            if ($process -and -not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
            if (Test-Path $stdout) { Copy-Item $stdout "artifacts/corsair-runner.stdout.log" }
            if (Test-Path $stderr) { Copy-Item $stderr "artifacts/corsair-runner.stderr.log" }
          }

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xeneon-public-audit-${{ matrix.slug }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
