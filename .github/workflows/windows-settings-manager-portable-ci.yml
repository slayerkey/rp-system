name: Windows Settings Manager Portable CI

on:
  push:
    branches:
      - product/windows-settings-manager
    paths:
      - "products/windows-settings-manager/**"
      - "products/windows-settings-manager-lite.json"
      - "products/windows-settings-manager-pro.json"
      - "products/index.json"
      - "products/lite-pro-map.json"
      - "tools/art/**"
      - "tools/local/rat-preview-art.ps1"
      - ".github/workflows/windows-settings-manager-portable-ci.yml"
  pull_request:
    paths:
      - "products/windows-settings-manager/**"
      - "products/windows-settings-manager-lite.json"
      - "products/windows-settings-manager-pro.json"
      - "products/index.json"
      - "products/lite-pro-map.json"
      - "tools/art/**"
      - "tools/local/rat-preview-art.ps1"
      - ".github/workflows/windows-settings-manager-portable-ci.yml"
  workflow_dispatch:

concurrency:
  group: windows-settings-manager-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: products/windows-settings-manager/plugin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: products/windows-settings-manager/plugin/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: npm ci --no-fund --no-audit

      - name: Install deterministic Rat Art runtime
        run: python -m pip install Pillow==12.3.0

      - name: Build Lite and Pro
        run: npm run build

      - name: Product policy tests
        run: npm test

      - name: Official Elgato validation
        run: npm run validate

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Package Lite
        run: npx streamdeck pack out/com.packrat.windows-settings-manager-lite2.sdPlugin --output dist --force --no-update-check --no-file-list

      - name: Package Pro
        run: npx streamdeck pack out/com.packrat.windows-settings-manager-pro2.sdPlugin --output dist --force --no-update-check --no-file-list

      - name: Render Lite Marketplace media
        run: python scripts/rat-art.py --flavor lite --output dist/marketplace-lite

      - name: Render Pro Marketplace media
        run: python scripts/rat-art.py --flavor pro --output dist/marketplace-pro

      - name: Apply canonical final Rat Ship hero to Lite
        run: >
          python ../../../tools/art/render_streamdeck_ship_hero.py
          --product windows-settings-manager-lite
          --plugin-dir out/com.packrat.windows-settings-manager-lite2.sdPlugin
          --submission ../submission-lite.json
          --out dist/marketplace-lite/02_cover.png
          --keys-dir dist/marketplace-lite/rat-art-keys

      - name: Apply canonical final Rat Ship hero to Pro
        run: >
          python ../../../tools/art/render_streamdeck_ship_hero.py
          --product windows-settings-manager-pro
          --plugin-dir out/com.packrat.windows-settings-manager-pro2.sdPlugin
          --submission ../submission-pro.json
          --out dist/marketplace-pro/02_cover.png
          --keys-dir dist/marketplace-pro/rat-art-keys

      - name: Build exact five-image review sheets
        run: |
          python ../../../tools/art/build_marketplace_contact_sheet.py --input dist/marketplace-lite --output dist/marketplace-lite/review-contact-sheet.png
          python ../../../tools/art/build_marketplace_contact_sheet.py --input dist/marketplace-pro --output dist/marketplace-pro/review-contact-sheet.png

      - name: Verify Marketplace media dimensions
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          expected = {
              "01_search_icon.png": (288, 288),
              "02_cover.png": (1920, 960),
              "03_gallery_01.png": (1920, 960),
              "04_gallery_02.png": (1920, 960),
              "05_gallery_03.png": (1920, 960),
              "06_gallery_04.png": (1920, 960),
          }
          for flavor in ("lite", "pro"):
              root = Path("dist") / f"marketplace-{flavor}"
              for name, size in expected.items():
                  actual = Image.open(root / name).size
                  assert actual == size, (flavor, name, actual, size)
          print("MARKETPLACE MEDIA PASS")
          PY

      - name: Upload portable release evidence
        uses: actions/upload-artifact@v4
        with:
          name: windows-settings-manager-portable
          path: |
            products/windows-settings-manager/plugin/dist/*.streamDeckPlugin
            products/windows-settings-manager/plugin/dist/marketplace-lite/*.png
            products/windows-settings-manager/plugin/dist/marketplace-pro/*.png
            products/windows-settings-manager/plugin/dist/marketplace-lite/streamdeck-ship-hero-report.json
            products/windows-settings-manager/plugin/dist/marketplace-pro/streamdeck-ship-hero-report.json
          if-no-files-found: error
