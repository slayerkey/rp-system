name: Rat Ship Marketplace Routing CI

on:
  push:
    branches: [main]
    paths:
      - 'rat.cmd'
      - 'products/*.json'
      - 'plugins/*/submission.json'
      - 'schemas/product-workflow-state.schema.json'
      - 'tools/local/rat.ps1'
      - 'tools/local/rat-marketplace.ps1'
      - 'tools/local/rat-maker-console.ps1'
      - 'tools/local/rat-ship-plugin.ps1'
      - 'tools/local/rat-ship-local.ps1'
      - 'tools/local/rat-worktree.ps1'
      - 'tools/ship/maker_console.mjs'
      - 'tools/ship/maker_console_core.mjs'
      - 'tools/ship/maker_console_runtime_patch*.mjs'
      - 'tools/ship/maker_console_patch_test.mjs'
      - '.github/workflows/rat-ship-marketplace-routing-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'rat.cmd'
      - 'products/*.json'
      - 'plugins/*/submission.json'
      - 'schemas/product-workflow-state.schema.json'
      - 'tools/local/rat.ps1'
      - 'tools/local/rat-marketplace.ps1'
      - 'tools/local/rat-maker-console.ps1'
      - 'tools/local/rat-ship-plugin.ps1'
      - 'tools/local/rat-ship-local.ps1'
      - 'tools/local/rat-worktree.ps1'
      - 'tools/ship/maker_console.mjs'
      - 'tools/ship/maker_console_core.mjs'
      - 'tools/ship/maker_console_runtime_patch*.mjs'
      - 'tools/ship/maker_console_patch_test.mjs'
      - '.github/workflows/rat-ship-marketplace-routing-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-routing:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate Maker Console widget and plugin patch
        run: node tools/ship/maker_console_patch_test.mjs

      - name: Parse Marketplace PowerShell helpers
        shell: pwsh
        run: |
          $files = @(
            'tools/local/rat.ps1',
            'tools/local/rat-marketplace.ps1',
            'tools/local/rat-maker-console.ps1',
            'tools/local/rat-ship-plugin.ps1',
            'tools/local/rat-ship-local.ps1',
            'tools/local/rat-worktree.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) {
              $errors | ForEach-Object { Write-Error "${file}: $($_.Message)" }
              throw "PowerShell parse failed: $file"
            }
            Write-Host "POWERSHELL PASS: $file"
          }

      - name: Exercise canonical local ship product-type routing
        shell: pwsh
        run: |
          $scriptPath = Resolve-Path 'tools/local/rat.ps1'
          $raw = Get-Content $scriptPath -Raw
          foreach ($required in @(
            'products\$ProductSlug.json',
            'ConvertFrom-Json',
            'switch ($productType)',
            '"plugin"',
            'rat-ship-plugin.ps1',
            '-PluginSlug $ProductSlug',
            '"widget"',
            'rat-ship-local.ps1',
            '-WidgetSlug $ProductSlug',
            'Refusing to fall through to another product type'
          )) {
            if (-not $raw.Contains($required)) {
              throw "rat.ps1 local ship router is missing required contract: $required"
            }
          }

          $tokens = $null
          $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile($scriptPath, [ref]$tokens, [ref]$errors)
          if ($errors.Count) { throw 'Could not parse rat.ps1 for local routing test.' }
          $fn = $ast.Find({
            param($node)
            $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and
              $node.Name -eq 'Build-ShipKitLocally'
          }, $true)
          if ($null -eq $fn) { throw 'Build-ShipKitLocally was not found.' }
          $fnText = $fn.Extent.Text
          if ($fnText -notmatch 'rat-ship-plugin\.ps1' -or $fnText -notmatch '-PluginSlug\s+\$ProductSlug') {
            throw 'Plugin products are not explicitly routed to rat-ship-plugin.ps1.'
          }
          if ($fnText -notmatch 'rat-ship-local\.ps1' -or $fnText -notmatch '-WidgetSlug\s+\$ProductSlug') {
            throw 'Widget products are not explicitly routed to rat-ship-local.ps1.'
          }
          if ($fnText -notmatch 'default\s*\{' -or $fnText -notmatch 'Refusing to fall through') {
            throw 'Unsupported product types must fail closed instead of falling through.'
          }
          Write-Host 'LOCAL RAT SHIP PRODUCT ROUTING PASS'

      - name: Exercise disposable worktree isolation
        shell: pwsh
        run: |
          . ./tools/local/rat-worktree.ps1
          $repo = (Resolve-Path '.').Path
          Assert-RatCanonicalClean -RepoRoot $repo -Context 'CI preflight'

          foreach ($shipScript in @('tools/local/rat-ship-plugin.ps1', 'tools/local/rat-ship-local.ps1')) {
            $raw = Get-Content $shipScript -Raw
            if ($raw -notmatch 'New-RatDisposableWorktree' -or $raw -notmatch 'IsolatedBuild') {
              throw "$shipScript is not routed through disposable worktree isolation."
            }
          }

          $worktree = New-RatDisposableWorktree -RepoRoot $repo -Label 'ci-isolation'
          try {
            Add-Content -Path (Join-Path $worktree 'RAT-COMMANDS.md') -Value "`nCI isolated mutation"
            Set-Content -Path (Join-Path $worktree 'CI_UNTRACKED_SENTINEL.txt') -Value 'isolated only'
            Assert-RatCanonicalClean -RepoRoot $repo -Context 'Mutation inside disposable worktree'
          }
          finally {
            Remove-RatDisposableWorktree -RepoRoot $repo -WorktreeRoot $worktree
          }

          if (Test-Path $worktree) { throw "Disposable worktree was not removed: $worktree" }
          Assert-RatCanonicalClean -RepoRoot $repo -Context 'CI post-cleanup'
          Write-Host 'RAT SHIP ISOLATION PASS'

      - name: Exercise release-state guard
        shell: pwsh
        run: |
          $scriptPath = Resolve-Path 'tools/local/rat-marketplace.ps1'
          $tokens = $null
          $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile($scriptPath, [ref]$tokens, [ref]$errors)
          if ($errors.Count) { throw 'Could not parse rat-marketplace.ps1 for guard test.' }

          $fn = $ast.Find({
            param($node)
            $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and
              $node.Name -eq 'Assert-ProductReleaseState'
          }, $true)
          if ($null -eq $fn) { throw 'Assert-ProductReleaseState was not found.' }
          Invoke-Expression $fn.Extent.Text

          $blocked = [PSCustomObject]@{
            workflow_state = 'BLOCKED'
            blocker = 'Discord approval pending'
            final_boundary = 'approval then submission'
          }
          $ready = [PSCustomObject]@{
            workflow_state = 'READY_TO_SHIP'
            blocker = $null
            final_boundary = $null
          }
          $testing = [PSCustomObject]@{
            workflow_state = 'TESTING'
            blocker = $null
            final_boundary = 'finish automated QA'
          }
          $published = [PSCustomObject]@{
            workflow_state = 'PUBLISHED'
            blocker = $null
            final_boundary = $null
          }
          $legacyNoState = [PSCustomObject]@{
            blocker = $null
            final_boundary = $null
          }
          $legacyBlocked = [PSCustomObject]@{
            workflow_state = 'BLOCKED_EXTERNAL_APPROVAL'
            blocker = $null
            final_boundary = 'legacy approval pending'
          }

          foreach ($action in @('kit', 'stage')) {
            foreach ($fixture in @($blocked, $testing, $published)) {
              Assert-ProductReleaseState -Product $fixture -ProductSlug 'fixture' -RequestedAction $action
            }
          }
          Assert-ProductReleaseState -Product $ready -ProductSlug 'fixture' -RequestedAction 'ship'
          Assert-ProductReleaseState -Product $legacyNoState -ProductSlug 'fixture' -RequestedAction 'ship'

          foreach ($fixture in @($blocked, $legacyBlocked, $testing, $published)) {
            $threw = $false
            try {
              Assert-ProductReleaseState -Product $fixture -ProductSlug 'fixture' -RequestedAction 'ship'
            }
            catch {
              $threw = $true
              if ($_.Exception.Message -notmatch 'READY_TO_SHIP') {
                throw "Non-ready release error did not name READY_TO_SHIP: $($_.Exception.Message)"
              }
            }
            if (-not $threw) { throw "Non-ready fixture '$($fixture.workflow_state)' did not fail closed." }
          }

          $schema = Get-Content 'schemas/product-workflow-state.schema.json' -Raw | ConvertFrom-Json
          $allowedStates = @($schema.properties.workflow_state.enum)
          foreach ($file in Get-ChildItem 'products' -Filter '*.json' -File) {
            $product = Get-Content $file.FullName -Raw | ConvertFrom-Json
            $state = if ($null -ne $product.workflow_state) { ([string]$product.workflow_state).Trim() } else { '' }
            if ([string]::IsNullOrWhiteSpace($state)) { continue }
            if ($state -notin $allowedStates) {
              throw "$($file.Name) uses non-schema workflow_state '$state'."
            }
            if ($state -eq 'BLOCKED' -and [string]::IsNullOrWhiteSpace([string]$product.blocker)) {
              throw "$($file.Name) is BLOCKED but has no blocker field."
            }
          }

          $routerRaw = Get-Content $scriptPath -Raw
          if ($routerRaw -match 'throw\s+"Rat \$Action finished with') {
            throw 'Rat Marketplace still converts an expected queue stop into an unhandled exception stack trace.'
          }
          if ($routerRaw -notmatch 'Rat \$Action stopped for blocked product' -or $routerRaw -notmatch '(?m)^\s*exit 1\s*$') {
            throw 'Rat Marketplace blocked-release UX must report a blocked stop and return nonzero without an exception stack trace.'
          }

          Write-Host 'RELEASE STATE GUARD PASS'

      - name: Exercise pinned external Stream Deck release artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dest = Join-Path (Resolve-Path '.').Path 'out\ci-valorant-tracker'
          ./tools/local/rat-ship-plugin.ps1 -PluginSlug 'valorant-tracker' -Destination $dest -IsolatedBuild

          $expected = @(
            'valorant-tracker.streamDeckPlugin',
            'submission.json',
            'PASTE_description.txt',
            'PASTE_release_notes.txt',
            '01_search_icon.png',
            '02_cover.png',
            '03_gallery_01.png',
            '04_gallery_02.png',
            '05_gallery_03.png',
            '06_gallery_04.png'
          )
          foreach ($name in $expected) {
            if (-not (Test-Path (Join-Path $dest $name) -PathType Leaf)) {
              throw "External release artifact kit is missing $name"
            }
          }

          $submission = Get-Content (Join-Path $dest 'submission.json') -Raw | ConvertFrom-Json
          if ($submission.slug -ne 'valorant-tracker' -or [decimal]$submission.price_usd -ne [decimal]7.99) {
            throw 'Valorant submission metadata did not survive the external artifact shipping path.'
          }
          Write-Host 'EXTERNAL STREAM DECK RELEASE ARTIFACT PASS'

      - name: Exercise rat.cmd help path
        shell: cmd
        run: call rat.cmd help
