name: Voice Deck Release QA

on:
  push:
    branches:
      - product/voice-deck
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
    paths:
      - 'plugins/voice-deck/**'
      - '.github/workflows/voice-deck-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voice-deck-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-release:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Windows build, test, validate, pack, art
    runs-on: windows-latest
    defaults:
      run:
        working-directory: plugins/voice-deck
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Pillow
        shell: pwsh
        run: python -m pip install pillow==11.3.0

      - name: Install locked dependencies
        shell: pwsh
        run: npm ci --no-fund --no-audit

      - name: Audit dependencies
        shell: pwsh
        run: npm audit --audit-level=high

      - name: Build plugin and profiles
        shell: pwsh
        run: npm run build

      - name: Run automated tests
        shell: pwsh
        run: npm test

      - name: Validate host diagnostics
        shell: pwsh
        run: |
          node --check scripts\discord-probe.mjs
          .\scripts\host-audit.ps1 -StaticOnly

      - name: Verify immutable distribution and security boundary
        shell: pwsh
        run: |
          $bin = @(Get-ChildItem com.packrat.voice-deck.sdPlugin/bin -File)
          if ($bin.Count -ne 1 -or $bin[0].Name -ne 'plugin.js') { throw 'Expected exactly bin/plugin.js' }
          $bundle = Get-Content com.packrat.voice-deck.sdPlugin/bin/plugin.js -Raw
          if ($bundle -match 'client_secret') { throw 'Release bundle must not contain a Discord client secret' }
          $profiles = @(Get-ChildItem com.packrat.voice-deck.sdPlugin/profiles -Filter *.streamDeckProfile -File)
          if ($profiles.Count -ne 4) { throw "Expected four bundled profiles; found $($profiles.Count)" }
          $pi = Get-Content com.packrat.voice-deck.sdPlugin/ui/inspector.js -Raw
          if ($pi -match 'access_token|client_secret') { throw 'Property Inspector must not contain Discord credentials' }

      - name: Validate with official Elgato CLI
        shell: pwsh
        run: npm run validate

      - name: Package with official Elgato CLI
        shell: pwsh
        run: npm run pack

      - name: Render deterministic Marketplace media
        shell: pwsh
        run: .\rat-art.ps1 -Destination dist\marketplace

      - name: Verify output
        shell: pwsh
        run: |
          $pkg = @(Get-ChildItem dist -Filter *.streamDeckPlugin -File)
          if ($pkg.Count -ne 1) { throw "Expected one .streamDeckPlugin; found $($pkg.Count)" }
          $media = @(Get-ChildItem dist\marketplace -Filter *.png -File)
          if ($media.Count -ne 6) { throw "Expected six Marketplace images; found $($media.Count)" }
          Get-FileHash $pkg[0].FullName -Algorithm SHA256 | Format-List

      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: voice-deck-release-qa
          path: |
            plugins/voice-deck/dist/*.streamDeckPlugin
            plugins/voice-deck/dist/marketplace/*.png
            plugins/voice-deck/com.packrat.voice-deck.sdPlugin/manifest.json
            plugins/voice-deck/com.packrat.voice-deck.sdPlugin/profiles/*.streamDeckProfile
            plugins/voice-deck/QA.md
            plugins/voice-deck/REAL_WINDOWS_SMOKE.md
          if-no-files-found: error
          retention-days: 30
