name: Lite Pro Portfolio Audit

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'products/index.json'
      - 'products/lite-pro-map.json'
      - 'widgets/**'
      - 'plugins/**'
      - 'tools/lite_pro_audit.py'
      - 'tools/apply_verified_lite_pro_links.py'
      - 'tools/apply_verified_lite_pro_links_v2.py'
      - '.github/workflows/lite-pro-audit.yml'
  push:
    branches: [main]
    paths:
      - 'products/index.json'
      - 'products/lite-pro-map.json'
      - 'widgets/**'
      - 'plugins/**'
      - 'tools/lite_pro_audit.py'
  workflow_dispatch:
    inputs:
      shipping_lite_id:
        description: 'Optional Lite product id for strict shipping preflight'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: lite-pro-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply verified direct Marketplace URLs on audit branch
        if: ${{ github.head_ref == 'audit/lite-pro-sync-2026-09-01' || github.ref_name == 'audit/lite-pro-sync-2026-09-01' }}
        run: python tools/apply_verified_lite_pro_links_v2.py
      - name: Portfolio relationship audit
        run: python tools/lite_pro_audit.py
      - name: Commit verified URL synchronization
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'audit/lite-pro-sync-2026-09-01' }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products/index.json products/lite-pro-map.json widgets tools/apply_verified_lite_pro_links.py tools/apply_verified_lite_pro_links_v2.py
          if git diff --cached --quiet; then
            echo "No synchronization changes to commit."
          else
            git commit -m "Use verified Marketplace URLs for Lite upgrades"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi
      - name: Strict shipping preflight
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.shipping_lite_id != '' }}
        env:
          LITE_ID: ${{ inputs.shipping_lite_id }}
        run: python tools/lite_pro_audit.py --shipping "$LITE_ID"
