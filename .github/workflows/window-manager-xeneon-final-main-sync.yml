name: Window Manager Final Main Sync

on:
  push:
    branches:
      - product/window-manager-xeneon
    paths:
      - '.github/workflows/window-manager-xeneon-final-main-sync.yml'

permissions:
  contents: write
  actions: write

jobs:
  sync-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/window-manager-xeneon
          fetch-depth: 0

      - name: Merge latest main
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "packrat-ci"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main

          set +e
          git merge --no-edit origin/main
          merge_code=$?
          set -e

          if [ "$merge_code" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            if [ "$conflicts" != "products/index.json" ]; then
              echo "Unexpected merge conflicts:" >&2
              printf '%s\n' "$conflicts" >&2
              exit 1
            fi

            # Keep current main as the canonical registry baseline, then add
            # only this product's collision-safe registry row.
            git checkout --theirs products/index.json
            python - <<'PY'
          from pathlib import Path
          import json

          path = Path("products/index.json")
          text = path.read_text(encoding="utf-8")
          data = json.loads(text)
          products = data["products"]
          products = [item for item in products if item.get("id") != "window-manager-xeneon"]
          entry = '    {"id":"window-manager-xeneon","name":"Window Manager for XENEON","type":"widget","status":"qa_passed","price_usd":9.99,"version":"1.0.0"}'
          marker = "\n  ]\n}\n"
          if not text.endswith(marker):
              raise SystemExit("Unexpected products/index.json canonical format")
          text = text[:-len(marker)].rstrip()
          if products:
              text += ",\n" + entry + marker
          else:
              text += "\n" + entry + marker
          path.write_text(text, encoding="utf-8")
          PY
            git add products/index.json
            git commit --no-edit
          fi

          git push origin HEAD:product/window-manager-xeneon
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Dispatch and wait for full post-merge hardware-free gate
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: product/window-manager-xeneon
          MERGED_SHA: ${{ steps.merge.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run window-manager-xeneon-full-gate.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"

          run_id=""
          for i in $(seq 1 60); do
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow window-manager-xeneon-full-gate.yml --branch "$BRANCH" --event workflow_dispatch --limit 30 --json databaseId,createdAt,headSha --jq "[.[] | select(.createdAt >= \"$started\" and .headSha == \"$MERGED_SHA\")][0].databaseId // empty")"
            if [ -n "$run_id" ]; then break; fi
            sleep 3
          done
          if [ -z "$run_id" ]; then
            echo "Could not find post-merge Window Manager full gate" >&2
            exit 1
          fi

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Record final verification and remove one-time sync helper
        env:
          RUN_ID: ${{ steps.verify.outputs.run_id }}
          MERGED_SHA: ${{ steps.merge.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin product/window-manager-xeneon
          git reset --hard origin/product/window-manager-xeneon

          python - <<'PY'
          import json, os
          from pathlib import Path

          path = Path("products/window-manager-xeneon.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          evidence = data.setdefault("automated_release_evidence", {})
          evidence["post_main_sync_full_gate_run"] = int(os.environ["RUN_ID"])
          evidence["final_verified_runtime_commit"] = os.environ["MERGED_SHA"]
          data["notes"] = (
              "Version 1.0.0 is engineering-complete under the hardware-free XENEON troubleshooting/release gate. "
              "The free PackRat Window Bridge has a stable customer-accessible v1.0.0 release. "
              "Canonical Rat Ship was refreshed after the stable companion download URL was added to customer-facing metadata. "
              "The finished branch was merged with current main and the complete hardware-free full gate was rerun successfully on that merged runtime commit. "
              "Marketplace submission itself has not been claimed as completed."
          )
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          PY

          rm -f .github/workflows/window-manager-xeneon-final-main-sync.yml
          git config user.name "packrat-ci"
          git config user.email "actions@users.noreply.github.com"
          git add products/window-manager-xeneon.json .github/workflows/window-manager-xeneon-final-main-sync.yml
          git commit -m "Finalize Window Manager after main sync [skip ci]"
          git push origin HEAD:product/window-manager-xeneon
