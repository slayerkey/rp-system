name: Window Manager Stream Deck CLI Bundle

on:
  push:
    branches:
      - product/window-manager-xeneon
    paths:
      - '.github/workflows/window-manager-streamdeck-cli-bundle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install official Stream Deck CLI
        run: |
          mkdir -p bundle
          cd bundle
          npm init -y >/dev/null
          npm install @elgato/cli@1.9.0 --save-exact
          npm audit --audit-level=high
          ./node_modules/.bin/streamdeck -v
      - uses: actions/upload-artifact@v4
        with:
          name: streamdeck-cli-1.9.0
          path: bundle/
          if-no-files-found: error
          retention-days: 7
