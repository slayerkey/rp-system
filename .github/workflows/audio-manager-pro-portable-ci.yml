name: Audio Manager Pro Portable Release QA

on:
  push:
    branches:
      - product/audio-manager-pro
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build shared PackRat AudioCore
        run: dotnet build companions/packrat-audio-core/src/PackRat.AudioCore/PackRat.AudioCore.csproj -c Release

      - name: Regression build XENEON Audio Control Center bridge
        run: dotnet build companions/audio-control-center-bridge/src/PackRat.AudioBridge/PackRat.AudioBridge.csproj -c Release

      - name: Install locked plugin dependencies
        working-directory: plugins/audio-manager-pro
        run: npm ci --no-fund --no-audit

      - name: Audit plugin dependencies
        working-directory: plugins/audio-manager-pro
        run: npm audit --audit-level=high

      - name: Run syntax, endpoint resilience, and profile tests
        working-directory: plugins/audio-manager-pro
        run: npm test

      - name: Build exact shipping plugin including win-x64 helper
        working-directory: plugins/audio-manager-pro
        run: npm run build

      - name: Verify bundled helper
        shell: bash
        run: |
          test -f plugins/audio-manager-pro/com.packrat.audio-manager-pro.sdPlugin/native/win-x64/PackRat.AudioManager.Helper.exe
          test -s plugins/audio-manager-pro/com.packrat.audio-manager-pro.sdPlugin/native/win-x64/PackRat.AudioManager.Helper.exe

      - name: Validate with official Elgato CLI
        working-directory: plugins/audio-manager-pro
        run: npm run validate

      - name: Package with official Elgato CLI
        working-directory: plugins/audio-manager-pro
        run: npm run pack

      - name: Render deterministic Marketplace media
        working-directory: plugins/audio-manager-pro
        shell: bash
        run: |
          python -m pip install pillow==11.3.0
          mkdir -p dist/marketplace
          python scripts/rat-art.py --destination dist/marketplace
          test "$(find dist/marketplace -maxdepth 1 -name '*.png' | wc -l)" -eq 6

      - uses: actions/upload-artifact@v4
        with:
          name: audio-manager-pro-portable-release-qa
          path: |
            plugins/audio-manager-pro/dist/*.streamDeckPlugin
            plugins/audio-manager-pro/dist/marketplace/*.png
            plugins/audio-manager-pro/QA.md
            plugins/audio-manager-pro/REAL_WINDOWS_SMOKE.md
          if-no-files-found: error
          retention-days: 30
