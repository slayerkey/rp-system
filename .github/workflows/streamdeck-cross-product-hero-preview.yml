name: Stream Deck Cross Product Hero Preview

on:
  push:
    branches:
      - feature/streamdeck-photo-hero-v1

permissions:
  contents: read

jobs:
  cross-product:
    runs-on: windows-latest
    env:
      RATPACK_ART_FONT: C:\\Windows\\Fonts\\segoeui.ttf
      RATPACK_ART_FONT_BOLD: C:\\Windows\\Fonts\\segoeuib.ttf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install deterministic dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow==12.3.0
          npm install --no-save playwright@1.62.1
          npx playwright install chromium
      - name: Export real Voice Deck runtime keys
        shell: pwsh
        run: node tools/art/export_streamdeck_product_keys.mjs --product voice-deck --out artifacts/cross-product/voice-deck
      - name: Export real Internet Health Pro runtime keys
        shell: pwsh
        run: node tools/art/export_streamdeck_product_keys.mjs --product internet-health-pro --out artifacts/cross-product/internet-health-pro
      - name: Render Voice Deck photo hero
        shell: pwsh
        run: python tools/art/render_streamdeck_product_hero.py --product voice-deck --line1 "VOICE DECK" --line2 "FOR DISCORD" --keys-dir artifacts/cross-product/voice-deck/keys --out artifacts/cross-product/voice-deck/02_cover.png
      - name: Render Internet Health Pro photo hero
        shell: pwsh
        run: python tools/art/render_streamdeck_product_hero.py --product internet-health-pro --line1 "INTERNET" --line2 "HEALTH PRO" --keys-dir artifacts/cross-product/internet-health-pro/keys --out artifacts/cross-product/internet-health-pro/02_cover.png
      - name: Verify both products
        shell: pwsh
        run: |
          foreach ($product in @('voice-deck','internet-health-pro')) {
            $root = Join-Path 'artifacts/cross-product' $product
            $manifest = Get-Content (Join-Path $root 'runtime-key-manifest.json') -Raw | ConvertFrom-Json
            $report = Get-Content (Join-Path $root 'streamdeck-product-hero-report.json') -Raw | ConvertFrom-Json
            if ($manifest.key_count -ne 15) { throw "$product runtime key count != 15" }
            if ($manifest.image_generation -ne 'disabled') { throw "$product runtime keys used image generation" }
            if ($report.image_generation -ne 'disabled') { throw "$product hero used image generation" }
            if ($report.detected_key_count -ne 15) { throw "$product detected LCD count != 15" }
            if ($report.uncovered_lcd_pixels -ne 0) { throw "$product has uncovered LCD pixels" }
            if (($report.output.size[0] -ne 1920) -or ($report.output.size[1] -ne 960)) { throw "$product hero wrong size" }
            foreach ($name in @('02_cover.png','device-only.png','key-underlay.png','lcd-mask-debug.png','lcd-coverage-debug.png')) {
              if (-not (Test-Path (Join-Path $root $name))) { throw "$product missing $name" }
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: streamdeck-cross-product-hero-preview
          path: artifacts/cross-product/
          if-no-files-found: error
          retention-days: 3
