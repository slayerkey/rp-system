name: Stream Deck Photo Hero Preview

on:
  push:
    branches:
      - feature/streamdeck-photo-hero-v1

permissions:
  contents: read

jobs:
  render:
    runs-on: windows-latest
    env:
      RATPACK_ART_FONT: C:\\Windows\\Fonts\\segoeui.ttf
      RATPACK_ART_FONT_BOLD: C:\\Windows\\Fonts\\segoeuib.ttf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install deterministic art dependency
        shell: pwsh
        run: python -m pip install --disable-pip-version-check Pillow==12.3.0
      - name: Run compositor smoke tests
        shell: pwsh
        run: python tools/art/test_streamdeck_photo.py
      - name: Render real-photo Stream Deck hero
        shell: pwsh
        run: python tools/art/render_streamdeck_photo_hero.py --out artifacts/streamdeck-photo/02_cover.png
      - name: Verify deterministic contract
        shell: pwsh
        run: |
          $r = Get-Content artifacts/streamdeck-photo/streamdeck-photo-hero-report.json -Raw | ConvertFrom-Json
          if ($r.image_generation -ne 'disabled') { throw 'Image generation must remain disabled' }
          if ($r.hardware_source -ne 'tools/art/assets/streamdeck-mk2-straight.png') { throw 'Wrong hardware source' }
          if ($r.compositor -ne 'tools/art/streamdeck_photo.py') { throw 'Wrong compositor' }
          if ($r.composition_model -ne 'alpha-detected-lcd-underlay+untouched-hardware-overlay') { throw 'Wrong composition model' }
          if ($r.hardware_plate_modified -ne $false) { throw 'Hardware plate must remain untouched' }
          if ($r.detected_key_count -ne 15) { throw 'Expected exactly 15 detected LCDs' }
          if ($r.uncovered_lcd_pixels -ne 0) { throw 'LCD coverage must be complete' }
          if (($r.output.size[0] -ne 1920) -or ($r.output.size[1] -ne 960)) { throw 'Hero must be 1920x960' }
          $required = @(
            '02_cover.png',
            'device-only.png',
            'key-underlay.png',
            'lcd-mask-debug.png',
            'lcd-coverage-debug.png',
            'streamdeck-photo-hero-report.json'
          )
          foreach ($name in $required) {
            if (-not (Test-Path (Join-Path 'artifacts/streamdeck-photo' $name))) { throw "Missing artifact: $name" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: streamdeck-photo-hero-preview
          path: artifacts/streamdeck-photo/
          if-no-files-found: error
          retention-days: 3
