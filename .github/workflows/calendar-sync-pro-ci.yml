name: Calendar Sync Pro CI

on:
  push:
    paths:
      - "plugins/calendar-pro/**"
      - ".github/workflows/calendar-sync-pro-ci.yml"
  pull_request:
    paths:
      - "plugins/calendar-pro/**"
      - ".github/workflows/calendar-sync-pro-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test packaged Calendar Sync Pro build
        run: python plugins/calendar-pro/tests/test_calendar_pro_1_2.py
