name: Text Expander Local Release Validation
on:
  push:
    branches: [product/text-expander]
    paths:
      - "plugins/text-expander/**"
      - "products/text-expander.json"
      - "products/text-expander-pro.json"
      - "products/lite-pro-map.json"
      - ".github/workflows/local-release-validation.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-release:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Use host Python
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $python = $null
          $py = Get-Command py -ErrorAction SilentlyContinue
          if ($py) {
            foreach ($version in @("3.13", "3.12")) {
              try {
                $candidate = (& py "-$version" -c "import sys; print(sys.executable)" 2>$null | Select-Object -Last 1).Trim()
                if ($LASTEXITCODE -eq 0 -and $candidate -and (Test-Path $candidate)) { $python = $candidate; break }
              } catch {}
            }
          }
          if (-not $python) {
            $cmd = Get-Command python -ErrorAction SilentlyContinue
            if ($cmd -and (Test-Path $cmd.Source)) { $python = $cmd.Source }
          }
          if (-not $python) { throw "No usable host Python found." }
          $pythonDir = Split-Path $python -Parent
          $scriptsDir = Join-Path $pythonDir "Scripts"
          $pythonDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          if (Test-Path $scriptsDir) { $scriptsDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }
          & $python --version
          & $python -m pip --version
      - name: Install art dependency
        run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Build and test family
        working-directory: plugins/text-expander
        run: |
          npm ci --no-fund --no-audit
          npm run security:audit
          npm run qa
      - name: Install Stream Deck CLI
        run: npm install --global @elgato/cli@1.9.0
      - name: Validate and package
        shell: powershell
        run: |
          streamdeck validate plugins/text-expander/dist/com.packrat.textexpanderlite.sdPlugin --no-update-check
          streamdeck validate plugins/text-expander/dist/com.packrat.textexpanderpro.sdPlugin --no-update-check
          New-Item -ItemType Directory -Force plugins/text-expander/release | Out-Null
          streamdeck pack plugins/text-expander/dist/com.packrat.textexpanderlite.sdPlugin --output plugins/text-expander/release --force --no-update-check --no-file-list
          streamdeck pack plugins/text-expander/dist/com.packrat.textexpanderpro.sdPlugin --output plugins/text-expander/release --force --no-update-check --no-file-list
      - name: Audit Lite-to-Pro routing
        shell: powershell
        run: |
          python tools/lite_pro_audit.py --shipping text-expander
          node tools/qa/streamdeck-plugin-design-audit.mjs plugins/text-expander --require-canonical-pi --require-lite-pro-upsell
          $expected = "https://marketplace.elgato.com/product/text-expander-pro-7a939ada-53a5-49ae-99b5-2752c8e82f41"
          $hits = Get-ChildItem plugins/text-expander/dist/com.packrat.textexpanderlite.sdPlugin -Recurse -File | Select-String -SimpleMatch $expected -ErrorAction SilentlyContinue
          if (-not $hits) { throw "Verified Text Expander Pro URL was not injected into rebuilt Lite output." }
      - uses: actions/upload-artifact@v4
        with:
          name: text-expander-local-release
          path: plugins/text-expander/release/*.streamDeckPlugin
          if-no-files-found: error
