name: Audio Manager Lite Local Release Validation
on:
  push:
    branches: [product/audio-manager-lite]
    paths:
      - "plugins/audio-manager-lite/**"
      - "companions/packrat-audio-core/**"
      - "products/audio-manager-lite.json"
      - "products/lite-pro-map.json"
      - "products/index.json"
      - "tools/lite_pro_audit.py"
      - "tools/qa/streamdeck-plugin-design-audit.mjs"
      - ".github/workflows/local-release-validation.yml"
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: local-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local-release:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Use host .NET SDK
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $dotnet = Get-Command dotnet -ErrorAction SilentlyContinue
          if (-not $dotnet) { throw "dotnet SDK is not installed or not on PATH for the self-hosted runner." }
          Write-Host "Using host dotnet: $($dotnet.Source)"
          dotnet --version
          $sdks = @(dotnet --list-sdks)
          if (-not $sdks.Count) { throw "No .NET SDKs are installed on the self-hosted runner." }
          $sdks | ForEach-Object { Write-Host $_ }
      - name: Use host Python
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $python = $null
          $py = Get-Command py -ErrorAction SilentlyContinue
          if ($py) {
            foreach ($version in @("3.13", "3.12")) {
              try {
                $candidate = (& py "-$version" -c "import sys; print(sys.executable)" 2>$null | Select-Object -Last 1).Trim()
                if ($LASTEXITCODE -eq 0 -and $candidate -and (Test-Path $candidate)) { $python = $candidate; break }
              } catch {}
            }
          }
          if (-not $python) {
            $cmd = Get-Command python -ErrorAction SilentlyContinue
            if ($cmd -and (Test-Path $cmd.Source)) { $python = $cmd.Source }
          }
          if (-not $python) { throw "No usable host Python found." }
          $pythonDir = Split-Path $python -Parent
          $scriptsDir = Join-Path $pythonDir "Scripts"
          $pythonDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          if (Test-Path $scriptsDir) { $scriptsDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }
          & $python --version
          & $python -m pip --version
      - name: Build shared AudioCore
        run: dotnet build companions/packrat-audio-core/src/PackRat.AudioCore/PackRat.AudioCore.csproj -c Release
      - name: Build test validate package Lite
        working-directory: plugins/audio-manager-lite
        run: |
          npm ci --no-fund --no-audit
          npm audit --audit-level=high
          npm test
          npm run build
          npm run native:selftest
          npm run validate
          npm run pack
      - name: Record package SHA256
        shell: powershell
        run: Get-FileHash plugins/audio-manager-lite/dist/*.streamDeckPlugin -Algorithm SHA256 | Format-Table -AutoSize

      - name: Audit Lite-to-Pro routing
        shell: powershell
        run: |
          python tools/lite_pro_audit.py --shipping audio-manager-lite
          if ($LASTEXITCODE -ne 0) { throw "Audio Manager strict Lite-to-Pro audit failed." }
          node tools/qa/streamdeck-plugin-design-audit.mjs plugins/audio-manager-lite --require-canonical-pi --require-lite-pro-upsell
          if ($LASTEXITCODE -ne 0) { throw "Audio Manager canonical PI audit failed." }
          $expected = "https://marketplace.elgato.com/product/audio-manager-pro-89fcd139-e8ce-4b42-a58b-0b25a3b38cf1"
          $hits = Select-String -Path plugins/audio-manager-lite/com.packrat.audio-manager-lite.sdPlugin/bin/plugin.js -SimpleMatch $expected -ErrorAction SilentlyContinue
          if (-not $hits) { throw "Verified Audio Manager Pro URL was not found in rebuilt Lite plugin runtime." }
      - name: Upload release evidence (best effort)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: audio-manager-lite-local-release
          path: plugins/audio-manager-lite/dist/*.streamDeckPlugin
          if-no-files-found: error
