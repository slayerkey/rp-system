name: Home Assistant Public Source Import (one-time)
on:
  push:
    branches: [integration/home-assistant-streamdeck-ratship]
    paths: [.ratpack/import/home-assistant-source.tar.gz]
permissions:
  contents: write
jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify and import exact public source archive
        shell: bash
        run: |
          set -euo pipefail
          echo "1ce18780e64c07a93c0d9efa45227ec2a67fb8f0fc9a7ce0ec630c7830f8dd6c  .ratpack/import/home-assistant-source.tar.gz" | sha256sum -c -
          python - <<'PY'
          import tarfile
          from pathlib import Path
          tar=Path('.ratpack/import/home-assistant-source.tar.gz')
          with tarfile.open(tar,'r:gz') as z:
              for m in z.getmembers():
                  p=Path(m.name)
                  if m.issym() or m.islnk() or p.is_absolute() or '..' in p.parts or not (m.name.startswith('plugins/home-assistant-streamdeck/') or m.name=='qa-evidence/run_offline_gate.py'):
                      raise SystemExit('Unexpected archive entry: '+m.name)
              z.extractall('.',filter='data')
          PY
      - name: Generate deterministic manifest and approved source icons
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check "CairoSVG==2.8.2" "Pillow==12.3.0"
          python plugins/home-assistant-streamdeck/scripts/make-assets.py
          node plugins/home-assistant-streamdeck/scripts/make-manifest.mjs
          node plugins/home-assistant-streamdeck/scripts/build-profiles.mjs
          node plugins/home-assistant-streamdeck/scripts/copy-ui.mjs
      - name: Commit expanded real source and delete one-time source archive
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PackRat CI"
          git config user.email "34904637+slayerkey@users.noreply.github.com"
          git add plugins/home-assistant-streamdeck qa-evidence/run_offline_gate.py
          git rm -f .ratpack/import/home-assistant-source.tar.gz .github/workflows/bootstrap-home-assistant-public.yml
          git diff --cached --check
          git commit -m "Import public Home Assistant Stream Deck source and generated assets"
          git push origin HEAD:integration/home-assistant-streamdeck-ratship
