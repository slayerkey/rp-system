name: Windows Settings Manager CI

on:
  push:
    branches:
      - product/windows-settings-manager
      - main
    paths:
      - "products/windows-settings-manager/**"
      - "products/windows-settings-manager-lite.json"
      - "products/windows-settings-manager-pro.json"
      - "products/index.json"
      - "products/lite-pro-map.json"
      - ".github/workflows/windows-settings-manager-ci.yml"
  pull_request:
    paths:
      - "products/windows-settings-manager/**"
      - "products/windows-settings-manager-lite.json"
      - "products/windows-settings-manager-pro.json"
      - "products/index.json"
      - "products/lite-pro-map.json"
      - ".github/workflows/windows-settings-manager-ci.yml"
  workflow_dispatch:

concurrency:
  group: windows-settings-manager-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: products/windows-settings-manager/plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: products/windows-settings-manager/plugin/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-fund --no-audit
      - name: Build Lite and Pro
        run: npm run build
      - name: Tests
        run: npm test
      - name: Windows backend smoke
        shell: powershell
        run: npm run backend:smoke
      - name: Official Elgato validation
        run: npm run validate
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Package Lite
        run: npx streamdeck pack out/com.packrat.windows-settings-manager-lite2.sdPlugin --output dist --force --no-update-check --no-file-list
      - name: Package Pro
        run: npx streamdeck pack out/com.packrat.windows-settings-manager-pro2.sdPlugin --output dist --force --no-update-check --no-file-list
      - name: Record package SHA256
        shell: powershell
        working-directory: ${{ github.workspace }}
        run: Get-FileHash products/windows-settings-manager/plugin/dist/*.streamDeckPlugin -Algorithm SHA256 | Format-Table -AutoSize

      - name: Strict Lite-to-Pro release gate
        shell: powershell
        working-directory: ${{ github.workspace }}
        run: |
          python tools/lite_pro_audit.py --shipping windows-settings-manager-lite
          if ($LASTEXITCODE -ne 0) { throw "Windows Settings Manager strict Lite-to-Pro audit failed." }
          node tools/qa/streamdeck-plugin-design-audit.mjs products/windows-settings-manager/plugin/out/com.packrat.windows-settings-manager-lite2.sdPlugin --require-canonical-pi --require-lite-pro-upsell --extra-plugin-source=products/windows-settings-manager/plugin/src/plugin.ts
          if ($LASTEXITCODE -ne 0) { throw "Windows Settings Manager canonical PI audit failed." }
          $expected = "https://marketplace.elgato.com/product/windows-settings-manager-pro-a95ddbd4-32bb-4d19-a8c8-e4b8c2f3360e"
          $hits = Get-ChildItem products/windows-settings-manager/plugin/out/com.packrat.windows-settings-manager-lite2.sdPlugin/ui -Recurse -File | Select-String -SimpleMatch $expected -ErrorAction SilentlyContinue
          if (-not $hits) { throw "Verified Windows Settings Manager Pro URL is missing from rebuilt Lite UI." }

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: windows-settings-manager-packages
          path: products/windows-settings-manager/plugin/dist/*.streamDeckPlugin
