name: Windows Settings Manager CI

on:
  push:
    branches:
      - product/windows-settings-manager
    paths:
      - "products/windows-settings-manager/**"
      - "products/windows-settings-manager-lite.json"
      - "products/windows-settings-manager-pro.json"
      - "products/index.json"
      - "products/lite-pro-map.json"
      - ".github/workflows/windows-settings-manager-ci.yml"
  pull_request:
    paths:
      - "products/windows-settings-manager/**"
      - "products/windows-settings-manager-lite.json"
      - "products/windows-settings-manager-pro.json"
      - "products/index.json"
      - "products/lite-pro-map.json"
      - ".github/workflows/windows-settings-manager-ci.yml"
  workflow_dispatch:

concurrency:
  group: windows-settings-manager-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: products/windows-settings-manager/plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: products/windows-settings-manager/plugin/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-fund --no-audit
      - name: Build Lite and Pro
        run: npm run build
      - name: Tests
        run: npm test
      - name: Windows backend smoke
        shell: powershell
        run: npm run backend:smoke
      - name: Official Elgato validation
        run: npm run validate
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Package Lite
        run: npx streamdeck pack out/com.packrat.windows-settings-manager-lite.sdPlugin --output dist --force --no-update-check --no-file-list
      - name: Package Pro
        run: npx streamdeck pack out/com.packrat.windows-settings-manager-pro.sdPlugin --output dist --force --no-update-check --no-file-list
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: windows-settings-manager-packages
          path: products/windows-settings-manager/plugin/dist/*.streamDeckPlugin
