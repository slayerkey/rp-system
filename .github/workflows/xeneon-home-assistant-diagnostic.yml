name: XENEON Home Assistant Recovery

on:
  push:
    branches:
      - 'recovery/home-assistant-real-icue-diagnostic-*'
    paths:
      - 'widgets/_src/home-assistant/**'
      - 'widgets/home-assistant/**'
      - 'tools/xeneon/home-assistant-diagnostic/**'
      - 'tools/xeneon/home-assistant-diagnostic-smoke.mjs'
      - 'tools/xeneon/home-assistant-real-core-smoke.mjs'
      - 'tools/xeneon/home-assistant-real-product-smoke.mjs'
      - 'docs/XENEON_HOME_ASSISTANT_RECOVERY_2026-08-28.md'
      - '.github/workflows/xeneon-home-assistant-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  product-package:
    name: Exact Home Assistant 1.0.3 package and iCUE host gate
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generate validate package and extract exact product
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/package | Out-Null
          New-Item -ItemType Directory -Force -Path artifacts/extracted/home-assistant | Out-Null
          Get-ChildItem -Path widgets -Filter *.icuewidget -File -ErrorAction SilentlyContinue | Remove-Item -Force
          python tools/xeneon/inline.py home-assistant
          if ($LASTEXITCODE -ne 0) { throw 'Home Assistant inline generation failed' }
          python tools/xeneon/inline.py home-assistant --check
          if ($LASTEXITCODE -ne 0) { throw 'Home Assistant inline determinism failed' }
          npx --yes icuewidget-cli@0.4.47 validate widgets/home-assistant
          if ($LASTEXITCODE -ne 0) { throw 'official Home Assistant validation failed' }
          npx --yes icuewidget-cli@0.4.47 package widgets/home-assistant
          if ($LASTEXITCODE -ne 0) { throw 'official Home Assistant package failed' }
          $pkg = Get-ChildItem -Path widgets -Filter *.icuewidget -File | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $pkg) { throw 'official Home Assistant package missing' }
          Copy-Item $pkg.FullName artifacts/package/home-assistant.icuewidget
          @'
          import json, pathlib, zipfile
          package = pathlib.Path('artifacts/package/home-assistant.icuewidget')
          if not zipfile.is_zipfile(package):
              raise SystemExit('Home Assistant package is not ZIP compatible')
          with zipfile.ZipFile(package) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f'corrupt package member: {bad}')
              names = set(z.namelist())
              for required in ('index.html','manifest.json','translation.json','resources/icon.svg'):
                  if required not in names:
                      raise SystemExit(f'missing packaged file: {required}')
              z.extractall('artifacts/extracted/home-assistant')
          manifest = json.loads(pathlib.Path('artifacts/extracted/home-assistant/manifest.json').read_text(encoding='utf-8'))
          if manifest.get('id') != 'com.packrat.homeassistant':
              raise SystemExit(f'published id changed: {manifest.get("id")}')
          if manifest.get('version') != '1.0.3':
              raise SystemExit(f'candidate version mismatch: {manifest.get("version")}')
          html = pathlib.Path('artifacts/extracted/home-assistant/index.html').read_text(encoding='utf-8')
          if '/api/states' in html or 'add null to CORS' in html:
              raise SystemExit('legacy REST/CORS implementation remains in exact package')
          for token in ('/api/websocket','subscribe_events','state_changed','TOKEN REJECTED'):
              if token not in html:
                  raise SystemExit(f'WebSocket recovery contract missing: {token}')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Home Assistant exact package contract failed' }

      - name: Install Playwright
        shell: pwsh
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install chromium

      - name: Prove real iCUE lexical Custom Style behavior
        shell: pwsh
        run: |
          node tools/xeneon/native-style-autosync-smoke.mjs artifacts/extracted/home-assistant/index.html artifacts/style
          if ($LASTEXITCODE -ne 0) { throw 'Home Assistant lexical style regression failed' }

      - name: Clone Corsair Labs runner
        shell: pwsh
        run: |
          $runnerDir = Join-Path $env:RUNNER_TEMP 'icue-widget-runner-windows'
          if (Test-Path $runnerDir) { Remove-Item -Recurse -Force $runnerDir }
          git clone --depth 1 https://github.com/Corsair-Labs/iCUE-widget-runner-windows.git $runnerDir
          $target = Join-Path (Join-Path $runnerDir 'widgets') 'home-assistant'
          if (Test-Path $target) { Remove-Item -Recurse -Force $target }
          Copy-Item -Recurse -Force artifacts/extracted/home-assistant $target
          git -C $runnerDir rev-parse HEAD | Set-Content artifacts/corsair-runner-commit.txt

      - name: Corsair Labs exact package host smoke
        shell: pwsh
        run: |
          $runnerDir = Join-Path $env:RUNNER_TEMP 'icue-widget-runner-windows'
          $stdout = Join-Path $env:RUNNER_TEMP 'corsair-ha-product.out.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'corsair-ha-product.err.log'
          $process = Start-Process node -ArgumentList 'web-server.js' -WorkingDirectory $runnerDir -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              try {
                $response = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8080/api/widgets -TimeoutSec 2
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch {}
              Start-Sleep -Seconds 1
            }
            if (-not $ready) { throw 'Corsair Labs runner did not become ready' }
            node tools/xeneon/icue-runner-smoke.mjs http://127.0.0.1:8080/ home-assistant artifacts/icue-runner
            if ($LASTEXITCODE -ne 0) { throw 'Corsair Labs Home Assistant host smoke failed' }
          }
          finally {
            if ($process -and -not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
            if (Test-Path $stdout) { Copy-Item $stdout artifacts/corsair-runner.stdout.log }
            if (Test-Path $stderr) { Copy-Item $stderr artifacts/corsair-runner.stderr.log }
          }

      - name: Write customer handoff
        shell: pwsh
        run: |
          @'
          HOME ASSISTANT PANEL 1.0.3 — REAL iCUE TEST

          IMPORTANT: revoke the Long-Lived Access Token that appeared in the earlier screenshot and create a fresh token before testing this build.

          This candidate keeps the existing Home Assistant Panel identity and settings, but replaces the old REST-only connection with Home Assistant's native WebSocket API.

          Setup:
          1. Install home-assistant.icuewidget.
          2. Enter the same Home Assistant server address that opens on this PC.
          3. Paste a fresh Long-Lived Access Token.
          4. Copy one or more exact entity IDs from Home Assistant Developer Tools > States and separate multiple IDs with commas.
          5. No CORS allowed-origin change is required for this candidate.

          Please verify:
          - The panel says CONNECTED.
          - The configured entities appear.
          - A sensor shows its current value/unit.
          - If possible, change one Home Assistant entity and confirm the tile updates live without reopening iCUE.

          If it fails, send a screenshot of the PANEL DISPLAY only. Do not include the token/settings panel.
          '@ | Set-Content -Encoding UTF8 artifacts/package/TESTER-NOTE.txt
          Get-FileHash artifacts/package/home-assistant.icuewidget -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  home-assistant.icuewidget" } |
            Set-Content -Encoding ASCII artifacts/package/SHA256SUMS.txt

      - name: Upload Home Assistant 1.0.3 physical candidate
        uses: actions/upload-artifact@v4
        with:
          name: home-assistant-panel-1.0.3-real-icue-candidate
          path: artifacts/package/
          retention-days: 30

      - name: Upload Windows evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-assistant-panel-1.0.3-windows-evidence
          path: artifacts/
          retention-days: 30

  real-home-assistant:
    name: Exact product against real Home Assistant Core 2026.8.3
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generate validate package and extract exact product
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/real-home-assistant-product artifacts/extracted/home-assistant
          python tools/xeneon/inline.py home-assistant
          python tools/xeneon/inline.py home-assistant --check
          npx --yes icuewidget-cli@0.4.47 validate widgets/home-assistant
          npx --yes icuewidget-cli@0.4.47 package widgets/home-assistant
          pkg=$(find widgets -maxdepth 1 -type f -name '*.icuewidget' -print -quit)
          test -n "$pkg"
          cp "$pkg" artifacts/home-assistant-real-core.icuewidget
          python - <<'PY'
          import pathlib, zipfile
          package = pathlib.Path('artifacts/home-assistant-real-core.icuewidget')
          if not zipfile.is_zipfile(package):
              raise SystemExit('package is not ZIP compatible')
          with zipfile.ZipFile(package) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f'corrupt member: {bad}')
              z.extractall('artifacts/extracted/home-assistant')
          PY

      - name: Start clean Home Assistant Core 2026.8.3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ha-config
          cat > ha-config/configuration.yaml <<'YAML'
          default_config:
          YAML
          docker pull ghcr.io/home-assistant/home-assistant:2026.8.3
          docker run -d \
            --name ratpack-home-assistant \
            -p 8123:8123 \
            -e TZ=Etc/UTC \
            -v "$PWD/ha-config:/config" \
            ghcr.io/home-assistant/home-assistant:2026.8.3
          docker inspect ratpack-home-assistant --format='{{.Config.Image}}' > artifacts/real-home-assistant-product/container-image.txt

      - name: Install Chromium test dependency
        shell: bash
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Prove exact product live state updates from file origin
        shell: bash
        run: |
          set -euo pipefail
          node tools/xeneon/home-assistant-real-product-smoke.mjs \
            artifacts/extracted/home-assistant/index.html \
            http://127.0.0.1:8123 \
            artifacts/real-home-assistant-product

      - name: Capture Home Assistant container logs
        if: always()
        shell: bash
        run: |
          docker logs ratpack-home-assistant > artifacts/real-home-assistant-product/home-assistant.log 2>&1 || true
          docker inspect ratpack-home-assistant > artifacts/real-home-assistant-product/container-inspect.json 2>&1 || true

      - name: Upload real Home Assistant product evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-assistant-panel-1.0.3-real-core-evidence
          path: artifacts/real-home-assistant-product/
          retention-days: 30
