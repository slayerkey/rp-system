name: Auto Queue for Claude Code CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'plugins/claude-auto-queue/**'
      - '.github/workflows/claude-auto-queue-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-streamdeck:
    runs-on: [self-hosted, Windows, X64, packrat]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: plugins/claude-auto-queue/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install locked dependencies
        working-directory: plugins/claude-auto-queue
        run: npm ci --no-fund --no-audit

      - name: Install deterministic Rat Art runtime
        run: python -m pip install Pillow==11.3.0

      - name: Build plugin and bundled profiles
        working-directory: plugins/claude-auto-queue
        run: npm run build

      - name: Run product fixtures
        working-directory: plugins/claude-auto-queue
        run: npm test

      - name: Verify packaged plugin icon dimensions
        working-directory: plugins/claude-auto-queue
        shell: pwsh
        run: |
          python -c "from PIL import Image; from pathlib import Path; p=Path('com.packrat.claude-auto-queue.sdPlugin/imgs/plugin'); expected={'marketplace.png':(256,256),'marketplace@2x.png':(512,512)}; bad=[(n,Image.open(p/n).size,s) for n,s in expected.items() if Image.open(p/n).size!=s]; assert not bad,bad; print('PLUGIN ICON PASS')"

      - name: Validate with official Stream Deck CLI
        working-directory: plugins/claude-auto-queue
        run: npx streamdeck validate com.packrat.claude-auto-queue.sdPlugin --no-update-check

      - name: Package release candidate with official Stream Deck CLI
        working-directory: plugins/claude-auto-queue
        run: npx streamdeck pack com.packrat.claude-auto-queue.sdPlugin --output dist --force --no-update-check --no-file-list

      - name: Render deterministic Marketplace media
        shell: pwsh
        working-directory: plugins/claude-auto-queue
        run: ./rat-art.ps1 -Destination (Join-Path $PWD 'dist\marketplace')

      - name: Verify Marketplace media dimensions
        working-directory: plugins/claude-auto-queue
        shell: pwsh
        run: |
          python -c "from PIL import Image; from pathlib import Path; p=Path('dist/marketplace'); expected={'01_search_icon.png':(512,512),'02_cover.png':(1920,960),'03_gallery_01.png':(1920,960),'04_gallery_02.png':(1920,960),'05_gallery_03.png':(1920,960),'06_gallery_04.png':(1920,960)}; bad=[(n,Image.open(p/n).size,s) for n,s in expected.items() if Image.open(p/n).size!=s]; assert not bad,bad; print('MARKETPLACE MEDIA PASS')"

      - name: Exercise canonical Stream Deck Rat Ship kit builder
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'claude-auto-queue-ship-kit'
          ./tools/local/rat-ship-plugin.ps1 -PluginSlug claude-auto-queue -Destination $dest
          $required = @(
            'claude-auto-queue.streamDeckPlugin',
            'submission.json',
            'PASTE_description.txt',
            'PASTE_release_notes.txt',
            '01_search_icon.png',
            '02_cover.png',
            '03_gallery_01.png',
            '04_gallery_02.png',
            '05_gallery_03.png',
            '06_gallery_04.png'
          )
          $missing = @($required | Where-Object { -not (Test-Path (Join-Path $dest $_)) })
          if ($missing.Count) { throw "Canonical plugin ship kit is incomplete: $($missing -join ', ')" }
          $submission = Get-Content (Join-Path $dest 'submission.json') -Raw | ConvertFrom-Json
          if ($null -ne $submission.price_usd) { throw 'Release test expects price to remain intentionally unset before approval.' }
          Write-Host 'RAT SHIP PLUGIN KIT PASS: package, copy, media, and null-price kit boundary'

      - name: Reproduce Rat Dev build from Windows path with spaces
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE 'plugins\claude-auto-queue'
          $root = Join-Path $env:RUNNER_TEMP 'Claude Projects\RatPack GitHub'
          $target = Join-Path $root 'plugins\claude-auto-queue'
          Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item (Join-Path $source 'package.json') $target
          Copy-Item (Join-Path $source 'package-lock.json') $target
          Copy-Item (Join-Path $source 'rollup.config.mjs') $target
          Copy-Item (Join-Path $source 'tsconfig.json') $target
          Copy-Item (Join-Path $source 'src') $target -Recurse
          Copy-Item (Join-Path $source 'scripts') $target -Recurse
          Push-Location $target
          try {
            npm ci --no-fund --no-audit
            if ($LASTEXITCODE -ne 0) { throw 'npm ci failed in path-with-spaces regression' }
            npm run build
            if ($LASTEXITCODE -ne 0) { throw 'build failed in path-with-spaces regression' }
          }
          finally {
            Pop-Location
          }

      - name: Upload packaged release candidate and Marketplace media
        uses: actions/upload-artifact@v4
        with:
          name: auto-queue-for-claude-code
          path: |
            plugins/claude-auto-queue/dist/*.streamDeckPlugin
            plugins/claude-auto-queue/dist/marketplace/*.png
          if-no-files-found: error
