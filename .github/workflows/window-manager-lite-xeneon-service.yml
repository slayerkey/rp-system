name: Window Manager Lite XENEON Service

on:
  push:
    branches:
      - product/window-manager-xeneon
    paths:
      - 'shared/window-manager-xeneon-service/**'
      - 'widgets/_src/window-manager-xeneon/**'
      - 'widgets/window-manager-xeneon/**'
      - '.github/workflows/window-manager-lite-xeneon-service.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SLUG: window-manager-xeneon

jobs:
  lite-service-contract:
    name: Lite-hosted service + exact XENEON package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install and audit internal Lite service
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Push-Location shared/window-manager-xeneon-service
          npm install
          npm audit --audit-level=high
          npm test
          Pop-Location

      - name: Windows native FFI smoke on stable Koffi
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $tmp = Join-Path $env:RUNNER_TEMP 'window-manager-koffi-smoke'
          if (Test-Path $tmp) { Remove-Item -Recurse -Force $tmp }
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          Push-Location $tmp
          npm init -y | Out-Null
          npm install koffi@3.1.6 --save-exact
          npm audit --audit-level=high
          @'
          const koffi = require("koffi");
          const user32 = koffi.load("user32.dll");
          const dwmapi = koffi.load("dwmapi.dll");
          const RECT = koffi.struct("RECT", { left:"long", top:"long", right:"long", bottom:"long" });
          const MONITORINFO = koffi.struct("MONITORINFO", {
            cbSize:"uint32_t", rcMonitor:RECT, rcWork:RECT, dwFlags:"uint32_t"
          });
          if (koffi.sizeof(MONITORINFO) !== 40) throw new Error("MONITORINFO layout mismatch");

          const PostMessageW = user32.func("bool __stdcall PostMessageW(void *hWnd, unsigned int Msg, uintptr_t wParam, intptr_t lParam)");
          const DwmGetWindowAttribute = dwmapi.func("long __stdcall DwmGetWindowAttribute(void *hwnd, unsigned long dwAttribute, _Out_ void *pvAttribute, unsigned long cbAttribute)");
          const WindowProto = koffi.proto("bool __stdcall WindowEnumProc(void *hWnd, long long lparam)");
          const EnumWindows = user32.func("bool __stdcall EnumWindows(WindowEnumProc *callback, long long lparam)");
          const MonitorProto = koffi.proto("bool __stdcall MonitorEnumProc(void *hMonitor, void *hdc, RECT *rect, long long lparam)");
          const EnumDisplayMonitors = user32.func("bool __stdcall EnumDisplayMonitors(void *hdc, RECT *clip, MonitorEnumProc *callback, long long lparam)");
          const GetMonitorInfoW = user32.func("bool __stdcall GetMonitorInfoW(void *hMonitor, _Inout_ MONITORINFO *lpmi)");

          let windows = 0;
          const wc = koffi.register((hwnd) => {
            windows++;
            const cloaked = Buffer.alloc(4);
            DwmGetWindowAttribute(hwnd, 14, cloaked, 4);
            return true;
          }, koffi.pointer(WindowProto));
          try {
            if (!EnumWindows(wc, 0)) throw new Error("EnumWindows failed");
          } finally { koffi.unregister(wc); }

          let monitors = 0;
          const mc = koffi.register((hmon) => {
            const info = { cbSize:koffi.sizeof(MONITORINFO) };
            if (!GetMonitorInfoW(hmon, info)) throw new Error("GetMonitorInfoW failed");
            monitors++;
            return true;
          }, koffi.pointer(MonitorProto));
          try {
            if (!EnumDisplayMonitors(null, null, mc, 0)) throw new Error("EnumDisplayMonitors failed");
          } finally { koffi.unregister(mc); }

          if (monitors < 1) throw new Error("No monitor enumerated");
          if (typeof PostMessageW !== "function") throw new Error("PostMessageW binding failed");
          console.log("WINDOW MANAGER WIN32 FFI PASS", { windows, monitors });
          '@ | Set-Content -Encoding UTF8 smoke.cjs
          node smoke.cjs
          Pop-Location

      - name: Validate Lite migration tooling
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node --check tools/qa/window-manager-lite-conversion-guard.mjs
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'tools/local/import-window-manager-lite.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'Window Manager Lite importer has PowerShell parse errors.'
          }
          Write-Host 'WINDOW MANAGER LITE MIGRATION TOOLING PARSE PASS'

      - name: Install browser QA dependency
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm install --no-save playwright@1.62.1
          npx playwright install chromium

      - name: Static XENEON verification
        shell: pwsh
        run: |
          node --check widgets/_src/$env:SLUG/window-manager.js
          node --check widgets/_src/$env:SLUG/lite-service-integration.mjs
          node widgets/_src/$env:SLUG/verify.mjs .

      - name: Build canonical shipping widget
        shell: pwsh
        run: |
          python tools/xeneon/inline.py $env:SLUG
          python tools/xeneon/inline.py $env:SLUG --check

      - name: Official CORSAIR validation and package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npx --yes icuewidget-cli@0.4.47 validate "widgets/$env:SLUG"
          Get-ChildItem -Path widgets -Filter *.icuewidget -File -ErrorAction SilentlyContinue | Remove-Item -Force
          npx --yes icuewidget-cli@0.4.47 package "widgets/$env:SLUG"
          New-Item -ItemType Directory -Force -Path artifacts/package | Out-Null
          $pkg = Get-ChildItem -Path widgets -Filter *.icuewidget -File | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $pkg) { throw 'official package was not created' }
          Copy-Item $pkg.FullName "artifacts/package/$env:SLUG.icuewidget"

      - name: Extract exact official package
        shell: pwsh
        run: |
          @'
          import pathlib, zipfile
          slug = "window-manager-xeneon"
          package = pathlib.Path("artifacts/package") / f"{slug}.icuewidget"
          out = pathlib.Path("artifacts/extracted") / slug
          out.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(package) as archive:
              bad = archive.testzip()
              if bad:
                  raise SystemExit(f"corrupt package member: {bad}")
              archive.extractall(out)
          '@ | python -

      - name: Exact XENEON package to Lite-hosted service
        shell: pwsh
        run: |
          node widgets/_src/$env:SLUG/lite-service-integration.mjs "artifacts/extracted/$env:SLUG/index.html" "artifacts/lite-service"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: window-manager-lite-xeneon-service-evidence
          path: |
            artifacts/package/window-manager-xeneon.icuewidget
            artifacts/lite-service/
          if-no-files-found: warn
          retention-days: 30
