name: Discord Bridge Marketplace Kit

on:
  push:
    branches:
      - product/discord-bridge
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ship-kit:
    name: Build exact Stream Deck Maker Console kit
    runs-on: windows-latest
    steps:
      - name: Checkout product branch
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build canonical Stream Deck Rat Ship kit
        shell: pwsh
        run: |
          $destination = Join-Path $PWD 'artifacts\SHIP_KIT'
          ./tools/local/rat-ship-plugin.ps1 -PluginSlug discord-bridge -Destination $destination

      - name: Verify exact upload contract
        shell: pwsh
        run: |
          $kit = Join-Path $PWD 'artifacts\SHIP_KIT'
          $required = @(
            'discord-bridge.streamDeckPlugin',
            'submission.json',
            'PASTE_description.txt',
            'PASTE_release_notes.txt',
            '01_search_icon.png',
            '02_cover.png',
            '03_gallery_01.png',
            '04_gallery_02.png',
            '05_gallery_03.png',
            '06_gallery_04.png'
          )
          $missing = @($required | Where-Object { -not (Test-Path (Join-Path $kit $_)) })
          if ($missing.Count) { throw "Discord Bridge upload kit is incomplete: $($missing -join ', ')" }
          $submission = Get-Content (Join-Path $kit 'submission.json') -Raw | ConvertFrom-Json
          if ($submission.slug -ne 'discord-bridge') { throw 'submission slug mismatch' }
          if ($submission.type -ne 'plugin') { throw 'submission type mismatch' }
          if ([decimal]$submission.price_usd -ne [decimal]0) { throw 'Discord Bridge must remain free' }
          if ($submission.version -ne '1.0.0.0') { throw 'submission version must be 1.0.0.0' }
          if ([bool]$submission.marketplace_auto_publish) { throw 'Discord Bridge must remain draft-only until Discord production RPC approval is recorded' }

          $artSource = Get-Content (Join-Path $PWD 'plugins\discord-bridge\rat-art.ps1') -Raw
          if ($artSource.Contains('Draw-Text $g "PACKRAT"')) { throw 'Marketplace footer regressed to PACKRAT text; use the logo-only footer' }
          if (-not $artSource.Contains('ratpack-icon-transparent.png')) { throw 'Marketplace art must use the canonical PackRat footer logo asset' }
          if (-not $artSource.Contains('"FREE STREAM DECK COMPANION" 110 92 620')) { throw 'Free companion cover badge width regressed and may clip' }
          Write-Host 'DISCORD BRIDGE MARKETPLACE KIT PASS'

      - name: Upload complete Maker Console kit
        uses: actions/upload-artifact@v4
        with:
          name: discord-bridge-marketplace-kit
          path: artifacts/SHIP_KIT/
          if-no-files-found: error
          retention-days: 30
