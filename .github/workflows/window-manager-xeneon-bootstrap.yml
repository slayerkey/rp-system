name: Window Manager XENEON Bootstrap

on:
  push:
    branches:
      - product/window-manager-xeneon
    paths:
      - '.github/workflows/window-manager-xeneon-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: product/window-manager-xeneon
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/window-manager-xeneon
          fetch-depth: 0

      - name: Sync latest canonical main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "packrat-ci"
          git config user.email "actions@users.noreply.github.com"
          git merge --no-edit origin/main

      - name: Salvage validated tar members
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, io, pathlib, struct, tarfile, zlib

          parts = sorted(pathlib.Path(".bootstrap").glob("window-manager.part-*"))
          if len(parts) != 8:
              raise SystemExit(f"expected 8 staging parts, got {len(parts)}")
          encoded = "".join(p.read_text(encoding="utf-8").strip() for p in parts)
          raw = base64.b64decode(encoded, validate=True)
          if raw[:3] != b"\x1f\x8b\x08":
              raise SystemExit("not a gzip payload")

          flags = raw[3]
          pos = 10
          if flags & 4:
              xlen = struct.unpack_from("<H", raw, pos)[0]
              pos += 2 + xlen
          if flags & 8:
              pos = raw.index(b"\0", pos) + 1
          if flags & 16:
              pos = raw.index(b"\0", pos) + 1
          if flags & 2:
              pos += 2

          tar_bytes = zlib.decompress(raw[pos:-8], -zlib.MAX_WBITS)
          print("RECOVERED_TAR_BYTES", len(tar_bytes))

          with tarfile.open(fileobj=io.BytesIO(tar_bytes), mode="r:") as tf:
              members = tf.getmembers()
              print("RECOVERED_MEMBERS", len(members))
              for member in members:
                  normalized = pathlib.PurePosixPath(member.name)
                  if normalized.is_absolute() or ".." in normalized.parts:
                      raise SystemExit(f"unsafe member: {member.name}")
                  if member.isfile():
                      fh = tf.extractfile(member)
                      if fh is None:
                          raise SystemExit(f"unreadable member: {member.name}")
                      data = fh.read()
                      print(f"FILE {member.name} {len(data)}")
                  else:
                      print(f"DIR  {member.name}")
              tf.extractall(".", filter="data")

          required_core = [
              "widgets/_src/window-manager-xeneon/index.html",
              "widgets/_src/window-manager-xeneon/window-manager.js",
              "widgets/_src/window-manager-xeneon/window-manager.css",
              "widgets/_src/window-manager-xeneon/verify.mjs",
          ]
          for path in required_core:
              if not pathlib.Path(path).is_file():
                  raise SystemExit(f"core source missing from salvage: {path}")

          expected_tail = [
              "widgets/window-manager-xeneon/manifest.json",
              "companions/window-manager-xeneon/PackRat.WindowBridge/BridgeServer.cs",
              ".github/workflows/window-manager-xeneon-full-gate.yml",
          ]
          print("KNOWN_MISSING", [p for p in expected_tail if not pathlib.Path(p).is_file()])
          PY

          node --check widgets/_src/window-manager-xeneon/window-manager.js

          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("products/index.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          matches = [x for x in data["products"] if x.get("id") == "window-manager-xeneon"]
          if len(matches) > 1:
              raise SystemExit("duplicate product id")
          if not matches:
              data["products"].append({
                  "id":"window-manager-xeneon",
                  "name":"Window Manager for XENEON",
                  "type":"widget",
                  "status":"building",
                  "price_usd":9.99,
                  "version":"1.0.0"
              })
          else:
              matches[0]["status"] = "building"
              matches[0]["price_usd"] = 9.99
              matches[0]["version"] = "1.0.0"
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          PY

          rm -rf .bootstrap
          rm -f .github/workflows/window-manager-xeneon-bootstrap.yml

      - name: Commit recovered source
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git status --short
          git commit -m "Recover Window Manager XENEON source from staging"
          git push origin HEAD:${TARGET_BRANCH}
