name: Agenda Panel 1.0.1 Upload Package

on:
  push:
    branches:
      - update/agenda-panel-calendar-sync-pro-link

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generate shipping widget
        shell: pwsh
        run: |
          python tools/xeneon/inline.py agenda-panel
          python tools/xeneon/inline.py agenda-panel --check

      - name: Run Calendar Panel state regression
        shell: pwsh
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install chromium
          node widgets/_src/agenda-panel/qa/state-matrix.mjs

      - name: Validate with official CORSAIR CLI
        shell: pwsh
        run: npx --yes icuewidget-cli@0.4.47 validate widgets/agenda-panel

      - name: Package with official CORSAIR CLI
        shell: pwsh
        run: npx --yes icuewidget-cli@0.4.47 package widgets/agenda-panel

      - name: Collect exact package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $pkg = Get-ChildItem -Path widgets -Filter *.icuewidget -File |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $pkg) { throw 'No .icuewidget package produced.' }
          Copy-Item $pkg.FullName artifacts/Calendar-Panel-1.0.1.icuewidget
          Get-FileHash artifacts/Calendar-Panel-1.0.1.icuewidget -Algorithm SHA256

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: calendar-panel-1.0.1-marketplace-upload
          path: artifacts/Calendar-Panel-1.0.1.icuewidget
          if-no-files-found: error
          retention-days: 30

      - name: Publish temporary prerelease download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'agenda-panel-v1.0.1-upload'
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag artifacts/Calendar-Panel-1.0.1.icuewidget --clobber
          } else {
            gh release create $tag artifacts/Calendar-Panel-1.0.1.icuewidget --target "$env:GITHUB_SHA" --title "Calendar Panel 1.0.1 Marketplace Upload" --notes "Temporary prerelease containing the exact validated .icuewidget package for Marketplace upload." --prerelease
          }
