name: Calendar Panel Standalone Package

on:
  push:
    branches:
      - fix/agenda-panel-standalone-calendar
    paths:
      - 'widgets/_src/agenda-panel/**'
      - 'widgets/agenda-panel/**'
      - '.github/workflows/agenda-panel-standalone-package.yml'

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generate shipping widget
        shell: pwsh
        run: |
          python tools/xeneon/inline.py agenda-panel
          python tools/xeneon/inline.py agenda-panel --check

      - name: Assert standalone transport
        shell: pwsh
        run: |
          $html = Get-Content widgets/agenda-panel/index.html -Raw
          if ($html -notmatch 'https://packrat-site\.pages\.dev/api/calendar-feed') { throw 'Standalone relay URL missing from generated widget.' }
          if ($html -match 'Calendar Sync Pro|COMPANION NEEDED|127\.0\.0\.1:38765|GET CALENDAR SYNC PRO') { throw 'Calendar Panel still contains a companion dependency or upsell.' }
          $manifest = Get-Content widgets/agenda-panel/manifest.json -Raw | ConvertFrom-Json
          if ($manifest.PSObject.Properties.Name -contains 'required_plugins') { throw 'Calendar Panel must not require a plugin.' }

      - name: Run Calendar Panel state regression
        shell: pwsh
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install chromium
          node widgets/_src/agenda-panel/qa/state-matrix.mjs

      - name: Validate with official CORSAIR CLI
        shell: pwsh
        run: npx --yes icuewidget-cli@0.4.47 validate widgets/agenda-panel

      - name: Package with official CORSAIR CLI
        shell: pwsh
        run: npx --yes icuewidget-cli@0.4.47 package widgets/agenda-panel

      - name: Inspect exact package
        shell: pwsh
        run: |
          $pkg = Get-ChildItem -Path widgets -Filter *.icuewidget -File |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $pkg) { throw 'No .icuewidget package produced.' }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item $pkg.FullName artifacts/Calendar-Panel-1.0.1.icuewidget
          Copy-Item $pkg.FullName artifacts/Calendar-Panel-1.0.1.zip
          New-Item -ItemType Directory -Force -Path artifacts/extracted | Out-Null
          Expand-Archive artifacts/Calendar-Panel-1.0.1.zip artifacts/extracted -Force
          $packedHtml = Get-Content artifacts/extracted/index.html -Raw
          if ($packedHtml -notmatch 'https://packrat-site\.pages\.dev/api/calendar-feed') { throw 'Exact package is missing standalone relay.' }
          if ($packedHtml -match 'Calendar Sync Pro|COMPANION NEEDED|127\.0\.0\.1:38765|GET CALENDAR SYNC PRO') { throw 'Exact package still contains companion dependency copy.' }
          Get-FileHash artifacts/Calendar-Panel-1.0.1.icuewidget -Algorithm SHA256

      - name: Commit generated shipping HTML
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add widgets/agenda-panel/index.html
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Regenerate standalone Calendar Panel shipping HTML"
            git push origin HEAD:fix/agenda-panel-standalone-calendar
          }

      - name: Upload Marketplace package
        uses: actions/upload-artifact@v4
        with:
          name: calendar-panel-standalone-1.0.1
          path: artifacts/Calendar-Panel-1.0.1.icuewidget
          if-no-files-found: error
          retention-days: 30
