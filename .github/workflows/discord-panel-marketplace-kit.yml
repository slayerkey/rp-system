name: Discord Panel Marketplace Kit

on:
  push:
    branches:
      - product/discord-panel
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ship-kit:
    name: Build exact Maker Console upload kit
    runs-on: windows-latest
    steps:
      - name: Checkout product branch
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build canonical local Rat Ship kit
        shell: pwsh
        run: |
          $destination = Join-Path $PWD 'artifacts\SHIP_KIT'
          ./tools/local/rat-ship-local.ps1 -WidgetSlug discord-panel -Destination $destination

      - name: Verify exact upload contract
        shell: pwsh
        run: |
          $kit = Join-Path $PWD 'artifacts\SHIP_KIT'
          $required = @(
            'discord-panel.icuewidget',
            'submission.json',
            'PASTE_description.txt',
            'PASTE_release_notes.txt',
            '01_search_icon.png',
            '02_cover.png',
            '03_gallery_01.png',
            '04_gallery_02.png',
            '05_gallery_03.png',
            '06_gallery_04.png'
          )
          $missing = @($required | Where-Object { -not (Test-Path (Join-Path $kit $_)) })
          if ($missing.Count) { throw "Discord Panel upload kit is incomplete: $($missing -join ', ')" }
          $submission = Get-Content (Join-Path $kit 'submission.json') -Raw | ConvertFrom-Json
          if ($submission.slug -ne 'discord-panel') { throw 'submission slug mismatch' }
          if ($submission.type -ne 'widget') { throw 'submission type mismatch' }
          if ([decimal]$submission.price_usd -ne [decimal]7.99) { throw 'submission price must be 7.99' }
          $sourceSubmission = Get-Content 'widgets/_src/discord-panel/submission.json' -Raw | ConvertFrom-Json
          $manifest = Get-Content 'widgets/discord-panel/manifest.json' -Raw | ConvertFrom-Json
          if ($submission.version -ne $sourceSubmission.version) { throw "submission version mismatch: kit=$($submission.version) source=$($sourceSubmission.version)" }
          if ($submission.version -ne $manifest.version) { throw "submission/manifest version mismatch: submission=$($submission.version) manifest=$($manifest.version)" }
          if ([bool]$submission.marketplace_auto_publish) { throw 'Discord Panel marketplace kit must remain manual-publish' }
          Write-Host "DISCORD PANEL MARKETPLACE KIT PASS: version $($submission.version)"

      - name: Upload complete Maker Console kit
        uses: actions/upload-artifact@v4
        with:
          name: discord-panel-marketplace-kit
          path: artifacts/SHIP_KIT/
          if-no-files-found: error
          retention-days: 30
