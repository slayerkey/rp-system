name: Rat Art XENEON

on:
  workflow_dispatch:
    inputs:
      slug:
        description: XENEON widget slug
        required: true
        default: now-playing

permissions:
  contents: read

jobs:
  resolve-slug:
    name: Resolve widget slug
    runs-on: ubuntu-latest
    outputs:
      slug: ${{ steps.resolve.outputs.slug }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve slug
        id: resolve
        shell: bash
        env:
          DISPATCH_SLUG: ${{ inputs.slug }}
        run: |
          slug="$(python tools/xeneon/resolve_slug.py --slug "$DISPATCH_SLUG")"
          echo "Resolved XENEON slug: $slug"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

  rat-art:
    needs: resolve-slug
    runs-on: windows-latest
    env:
      WIDGET_SLUG: ${{ needs.resolve-slug.outputs.slug }}
      RATPACK_ART_FONT: C:\Windows\Fonts\segoeui.ttf
      RATPACK_ART_FONT_BOLD: C:\Windows\Fonts\segoeuib.ttf
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install deterministic art dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow==12.3.0
          npm install --no-save playwright@1.62.1
          npm audit --audit-level=high
          npx playwright install chromium

      - name: Build shipping widget from canonical source
        shell: pwsh
        run: python tools/xeneon/inline.py $env:WIDGET_SLUG

      - name: Capture real widget at native XENEON slots
        shell: pwsh
        run: node tools/art/capture_xeneon.mjs $env:WIDGET_SLUG "artifacts/rat-art/shots"

      - name: Render with canonical Rat Art
        shell: pwsh
        run: python tools/art/rat_art.py xeneon $env:WIDGET_SLUG --shots "artifacts/rat-art/shots" --out "artifacts/rat-art/review"

      - name: Verify shared XENEON gallery campaign and browse-scale review
        shell: pwsh
        run: python tools/art/validate_xeneon_marketplace_campaign.py $env:WIDGET_SLUG --art artifacts/rat-art/review

      - name: Verify Rat Art contract
        shell: pwsh
        run: |
          $report = Get-Content artifacts/rat-art/review/rat-art-report.json -Raw | ConvertFrom-Json
          if ($report.image_generation -ne 'disabled') { throw 'Rat Art contract violated: image generation must stay disabled' }
          if ($report.slug -ne $env:WIDGET_SLUG) { throw 'Rat Art report slug mismatch' }
          foreach ($name in @('1-hero.png','2-showcase.png','3-features.png','4-settings.png','5-sizes.png')) {
            if (-not (Test-Path "artifacts/rat-art/review/$name")) { throw "missing $name" }
          }

      - name: Upload isolated Rat Art candidate
        uses: actions/upload-artifact@v4
        with:
          name: rat-art-${{ env.WIDGET_SLUG }}
          path: artifacts/rat-art/
          if-no-files-found: error
          retention-days: 30
