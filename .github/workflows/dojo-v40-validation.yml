name: Validate Dojo v40 on PackRat PC

on:
  push:
    branches:
      - ci/dojo-v40-validation
    paths:
      - ".github/workflows/dojo-v40-validation.yml"

permissions:
  contents: read

jobs:
  validate-dojo-v40:
    runs-on: [self-hosted, Windows, X64, packrat]
    timeout-minutes: 20

    steps:
      - name: Verify GitHub CLI access
        shell: powershell
        run: |
          gh --version
          gh auth status

      - name: Fetch Dojo v40 feature branch
        shell: powershell
        run: |
          $work = Join-Path $env:RUNNER_TEMP "dojo-v40-validation"
          if (Test-Path $work) {
            Remove-Item -Recurse -Force $work
          }
          gh repo clone slayerkey/dojo-infrastructure $work -- --branch feat/activation-v40 --single-branch
          Set-Content -Path $env:GITHUB_ENV -Value "DOJO_WORK=$work"

      - name: Install dependencies
        shell: powershell
        run: |
          Set-Location (Join-Path $env:DOJO_WORK "slayerkey-dojo")
          npm install --no-audit --no-fund --ignore-scripts

      - name: Run v40 validation
        shell: powershell
        run: |
          Set-Location (Join-Path $env:DOJO_WORK "slayerkey-dojo")
          npm run check:v40

      - name: Static safety checks
        shell: powershell
        run: |
          Set-Location (Join-Path $env:DOJO_WORK "slayerkey-dojo")
          $v40 = Get-Content src\activation-v40.js,src\activation-v40-core.js,src\index-v40.js -Raw
          if ($v40 -match "MESSAGE_CONTENT") {
            throw "v40 unexpectedly references MESSAGE_CONTENT"
          }
          Write-Host "V40_STATIC_SAFETY_OK=true"
