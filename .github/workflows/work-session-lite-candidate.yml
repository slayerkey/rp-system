name: Work Session Tracker Lite candidate QA

on:
  push:
    branches: [fix/work-session-cross-screen-20261001]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate exact shipping widget
        run: |
          python tools/xeneon/inline.py work-session-tracker
          python tools/xeneon/inline.py work-session-tracker --check
      - name: Official CORSAIR validation
        run: npx --yes icuewidget-cli@0.4.47 validate widgets/work-session-tracker
      - name: Official CORSAIR packaging
        run: npx --yes icuewidget-cli@0.4.47 package widgets/work-session-tracker
      - name: Preserve exact package and check integrity
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $pkg = Get-ChildItem widgets -Filter '*.icuewidget' -File |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $pkg) { throw 'No official .icuewidget package produced' }
          Copy-Item $pkg.FullName artifacts/work-session-tracker-lite.icuewidget
          @'
          import pathlib, zipfile
          file=pathlib.Path('artifacts/work-session-tracker-lite.icuewidget')
          with zipfile.ZipFile(file) as z:
              assert z.testzip() is None
              assert {'index.html','manifest.json'}.issubset(z.namelist())
          print('Exact package integrity OK')
          '@ | python -
          $hash=(Get-FileHash artifacts/work-session-tracker-lite.icuewidget -Algorithm SHA256).Hash.ToLower()
          Set-Content artifacts/SHA256.txt "$hash  work-session-tracker-lite.icuewidget"
      - uses: actions/upload-artifact@v4
        with:
          name: work-session-tracker-lite-candidate
          path: artifacts/
          if-no-files-found: error

  exact-package-regression:
    needs: official-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: work-session-tracker-lite-candidate
          path: artifacts/input
      - name: Install browser regression prerequisites
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Run all eight layouts and cross-screen persistence regression against exact package
        run: |
          python - <<'PY'
          import pathlib,zipfile
          path=pathlib.Path('artifacts/input/work-session-tracker-lite.icuewidget')
          with zipfile.ZipFile(path) as z:
              assert z.testzip() is None
              z.extractall('artifacts/extracted')
          PY
          RATPACK_PACKAGED_ENTRY=artifacts/extracted/index.html node widgets/_src/work-session-tracker/verify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: work-session-tracker-lite-qa-report
          path: artifacts/work-session-cross-screen/
          if-no-files-found: warn
