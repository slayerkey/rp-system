name: Audio Manager Pro CI
on:
  push:
    branches:
      - product/audio-manager-pro
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: dotnet build companions/packrat-audio-core/src/PackRat.AudioCore/PackRat.AudioCore.csproj -c Release
      - run: dotnet build companions/audio-control-center-bridge/src/PackRat.AudioBridge/PackRat.AudioBridge.csproj -c Release
      - run: npm ci --no-fund --no-audit
        working-directory: plugins/audio-manager-pro
      - run: npm audit --audit-level=high
        working-directory: plugins/audio-manager-pro
      - run: npm test
        working-directory: plugins/audio-manager-pro
      - run: npm run build
        working-directory: plugins/audio-manager-pro
      - name: Run Audio Manager static host audit
        shell: pwsh
        working-directory: plugins/audio-manager-pro
        run: .\scripts\host-audit.ps1 -StaticOnly
      - run: npm run native:selftest
        working-directory: plugins/audio-manager-pro
      - name: Smoke real Windows helper snapshot protocol
        shell: pwsh
        working-directory: plugins/audio-manager-pro
        run: |
          $helper = Resolve-Path "com.packrat.audio-manager-pro.sdPlugin/native/win-x64/PackRat.AudioManager.Helper.exe"
          $response = '{"id":"snapshot-smoke","command":"snapshot"}' | & $helper | Select-Object -First 1
          if (-not $response) { throw "Audio helper returned no snapshot response." }
          $json = $response | ConvertFrom-Json
          if ($json.id -ne "snapshot-smoke") { throw "Audio helper snapshot response id mismatch." }
          if ($null -eq $json.snapshot) { throw "Audio helper snapshot payload is missing." }
          Write-Host "Helper snapshot protocol smoke: $($json.status)"

          $badResponse = '{"id":"invalid-command-smoke","command":"definitely-invalid"}' | & $helper | Select-Object -First 1
          if (-not $badResponse) { throw "Audio helper returned no invalid-command response." }
          $badJson = $badResponse | ConvertFrom-Json
          if ($badJson.id -ne "invalid-command-smoke") { throw "Audio helper lost request correlation on rejected command." }
          if ($badJson.status -ne "FAILED") { throw "Audio helper invalid-command smoke did not fail closed." }
          Write-Host "Helper rejected-command correlation smoke: PASS"
      - run: npm run validate
        working-directory: plugins/audio-manager-pro
      - run: npm run pack
        working-directory: plugins/audio-manager-pro
      - name: Verify packaged native helper
        shell: pwsh
        working-directory: plugins/audio-manager-pro
        run: |
          $package = Get-ChildItem "dist" -Filter "*.streamDeckPlugin" | Select-Object -First 1
          if (-not $package) { throw "Elgato package was not created." }
          $entries = tar -tf $package.FullName
          if (-not ($entries | Select-String -SimpleMatch "native/win-x64/PackRat.AudioManager.Helper.exe")) {
            throw "Packaged plugin is missing the Windows audio helper."
          }
          if ($entries | Select-String -Pattern "\.pdb$") {
            throw "Packaged plugin contains debug symbols."
          }
          Write-Host "Packaged helper verified and debug symbols absent in $($package.Name)"
      - run: python -m pip install pillow==11.3.0
      - run: .\rat-art.ps1 -Destination dist\marketplace
        shell: pwsh
        working-directory: plugins/audio-manager-pro
      - uses: actions/upload-artifact@v4
        with:
          name: audio-manager-pro-release-qa
          path: |
            plugins/audio-manager-pro/dist/*.streamDeckPlugin
            plugins/audio-manager-pro/dist/marketplace/*.png
            plugins/audio-manager-pro/dist/marketplace/review/*.png
            plugins/audio-manager-pro/QA.md
            plugins/audio-manager-pro/REAL_WINDOWS_SMOKE.md
            plugins/audio-manager-pro/DEMO_VIDEO.md
            plugins/audio-manager-pro/ART_REVIEW.md
          if-no-files-found: error
