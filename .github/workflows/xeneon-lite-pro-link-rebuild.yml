name: XENEON Lite Pro Link Rebuild

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - widgets/_src/weather-timeline/**
      - widgets/_shared/weather-timeline/**
      - widgets/weather-timeline/manifest.json
      - widgets/_src/work-session-tracker/**
      - widgets/work-session-tracker/manifest.json
      - widgets/_src/desk-notes/**
      - widgets/_src/desk-notes-common/**
      - widgets/desk-notes/manifest.json
      - widgets/_src/pc-power-meter/**
      - widgets/_shared/pc-power-meter/**
      - widgets/pc-power-meter/manifest.json
      - products/lite-pro-map.json
      - products/index.json
      - .github/workflows/xeneon-lite-pro-link-rebuild.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xeneon-lite-pro-links-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Package ${{ matrix.slug }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: weather-timeline
            expected_version: 1.0.1
            pro_url: https://marketplace.elgato.com/product/weather-timeline-pro-160c8019-ce77-49d8-a306-8ef1764a70c5
          - slug: work-session-tracker
            expected_version: 1.0.2
            pro_url: https://marketplace.elgato.com/product/work-session-tracker-pro-f8e12d94-4354-41ca-b6da-beb2297fb9e2
          - slug: desk-notes
            expected_version: 1.0.1
            pro_url: https://marketplace.elgato.com/product/desk-notes-pro-3d7e3110-68be-4774-a351-755c12c95268
          - slug: pc-power-meter
            expected_version: 1.0.2
            pro_url: https://marketplace.elgato.com/product/pc-power-meter-pro-53e57034-588b-498f-9882-12b4a8837098
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generate canonical shipping HTML
        shell: pwsh
        run: |
          python tools/xeneon/inline.py "${{ matrix.slug }}"
          python tools/xeneon/inline.py "${{ matrix.slug }}" --check

      - name: Assert exact Pro URL and no invalid Marketplace target
        shell: pwsh
        run: |
          $entry = "widgets/${{ matrix.slug }}/index.html"
          $html = Get-Content $entry -Raw
          $expected = "${{ matrix.pro_url }}"
          if (-not $html.Contains($expected)) { throw "Packaged source does not contain exact Pro URL: $expected" }
          $bad = @('REPLACE_WITH','TODO_PRO_URL','marketplace.elgato.com/search?','marketplace.elgato.com/icue','marketplace.elgato.com/@packrat')
          foreach ($marker in $bad) {
            if ($html.Contains($marker)) { throw "Invalid Marketplace marker remains in $entry : $marker" }
          }
          $manifest = Get-Content "widgets/${{ matrix.slug }}/manifest.json" -Raw | ConvertFrom-Json
          $expectedVersion = "${{ matrix.expected_version }}"
          if ($manifest.version -ne $expectedVersion) { throw "Expected Lite revision $expectedVersion, got $($manifest.version)" }

      - name: Validate and package with official CORSAIR CLI
        shell: pwsh
        run: |
          npx --yes icuewidget-cli@0.4.47 validate "widgets/${{ matrix.slug }}"
          npx --yes icuewidget-cli@0.4.47 package "widgets/${{ matrix.slug }}"

      - name: Collect exact package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "artifacts/${{ matrix.slug }}" | Out-Null
          $pkg = Get-ChildItem -Path widgets -Filter *.icuewidget -File | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $pkg) { throw 'Official package command did not produce an .icuewidget archive.' }
          Copy-Item $pkg.FullName "artifacts/${{ matrix.slug }}/${{ matrix.slug }}.icuewidget"
          Copy-Item "widgets/${{ matrix.slug }}/index.html" "artifacts/${{ matrix.slug }}/index.html"
          Copy-Item "widgets/${{ matrix.slug }}/manifest.json" "artifacts/${{ matrix.slug }}/manifest.json"
          Get-FileHash "artifacts/${{ matrix.slug }}/${{ matrix.slug }}.icuewidget" -Algorithm SHA256 | Format-List

      - uses: actions/upload-artifact@v4
        with:
          name: lite-pro-link-${{ matrix.slug }}
          path: artifacts/${{ matrix.slug }}/
          if-no-files-found: error
          retention-days: 30

  smoke:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Exact-package smoke ${{ matrix.slug }}
    needs: package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: weather-timeline
            expected_version: 1.0.1
            pro_url: https://marketplace.elgato.com/product/weather-timeline-pro-160c8019-ce77-49d8-a306-8ef1764a70c5
          - slug: work-session-tracker
            expected_version: 1.0.2
            pro_url: https://marketplace.elgato.com/product/work-session-tracker-pro-f8e12d94-4354-41ca-b6da-beb2297fb9e2
          - slug: desk-notes
            expected_version: 1.0.1
            pro_url: https://marketplace.elgato.com/product/desk-notes-pro-3d7e3110-68be-4774-a351-755c12c95268
          - slug: pc-power-meter
            expected_version: 1.0.2
            pro_url: https://marketplace.elgato.com/product/pc-power-meter-pro-53e57034-588b-498f-9882-12b4a8837098
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: lite-pro-link-${{ matrix.slug }}
          path: artifacts/input

      - name: Extract and verify exact package
        shell: bash
        run: |
          rm -rf artifacts/package
          mkdir -p artifacts/package
          python - <<'PY'
          import json, pathlib, zipfile
          slug = "${{ matrix.slug }}"
          expected = "${{ matrix.pro_url }}"
          expected_version = "${{ matrix.expected_version }}"
          package = pathlib.Path('artifacts/input') / f'{slug}.icuewidget'
          with zipfile.ZipFile(package) as z:
              z.extractall('artifacts/package')
          entry = pathlib.Path('artifacts/package/index.html')
          manifest_path = pathlib.Path('artifacts/package/manifest.json')
          assert entry.exists(), 'packaged index.html missing'
          assert manifest_path.exists(), 'packaged manifest.json missing'
          html = entry.read_text(encoding='utf-8')
          assert expected in html, f'exact Pro URL missing from packaged {slug}'
          for bad in ['REPLACE_WITH','TODO_PRO_URL','marketplace.elgato.com/search?','marketplace.elgato.com/icue','marketplace.elgato.com/@packrat']:
              assert bad not in html, f'invalid marker remains in exact package: {bad}'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          assert manifest.get('version') == expected_version, manifest.get('version')
          print(json.dumps({'slug':slug,'id':manifest.get('id'),'version':manifest.get('version'),'pro_url':expected}, indent=2))
          PY

      - name: Native iCUE property regression
        run: |
          npm install --no-save playwright@1.62.1 ws@8.21.3
          npx playwright install --with-deps chromium
          node tools/xeneon/native-style-smoke.mjs artifacts/package/index.html "artifacts/native-style-${{ matrix.slug }}"

      - name: Product-local verification when present
        shell: bash
        run: |
          verify="widgets/_src/${{ matrix.slug }}/verify.mjs"
          if [[ -f "$verify" ]]; then
            RATPACK_PACKAGED_ENTRY="$PWD/artifacts/package/index.html" node "$verify"
          else
            echo "No optional verify.mjs for ${{ matrix.slug }}"
          fi

      - name: Marketplace network regression when present
        shell: bash
        run: |
          smoke="widgets/_src/${{ matrix.slug }}/marketplace-network-smoke.mjs"
          if [[ ! -f "$smoke" ]]; then smoke="widgets/_src/${{ matrix.slug }}/network-smoke.mjs"; fi
          if [[ -f "$smoke" ]]; then node "$smoke" artifacts/package/index.html "artifacts/network-${{ matrix.slug }}"; else echo "No network regression required"; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lite-pro-link-evidence-${{ matrix.slug }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
