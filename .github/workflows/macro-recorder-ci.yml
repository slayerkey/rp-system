name: Macro Recorder Family Release QA

on:
  push:
    branches:
      - product/macro-recorder
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macro-recorder-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Parse Macro Recorder PowerShell release scripts
        shell: pwsh
        run: |
          $files = @(
            'plugins/macro-recorder-pro/run-family-qa.ps1',
            'plugins/macro-recorder-lite/rat-art.ps1',
            'plugins/macro-recorder-pro/rat-art.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) {
              $errors | ForEach-Object { Write-Error "\${file}: $($_.Message)" }
              throw "PowerShell parse failed: $file"
            }
            Write-Host "POWERSHELL PASS: $file"
          }

      - name: Build shared Windows input host
        shell: pwsh
        run: |
          node shared/windows-input/build-host.mjs --force
          if (!(Test-Path artifacts/input-host/PackRat.InputHost.exe)) { throw 'Input host publish did not produce PackRat.InputHost.exe' }
          if (!(Test-Path artifacts/input-host/source.sha256)) { throw 'Input host source hash stamp is missing' }

      - name: Input host selftest
        shell: pwsh
        run: |
          $self = & .\artifacts\input-host\PackRat.InputHost.exe --selftest
          if (($self -join "") -notmatch '"ok":true') { throw "Input host self-test failed: $self" }
          $ping = '{"id":"ci","command":"ping"}' | & .\artifacts\input-host\PackRat.InputHost.exe --daemon
          if (($ping -join "") -notmatch '"ok":true') { throw "Input host daemon ping failed: $ping" }

      - name: Install Lite dependencies
        working-directory: plugins/macro-recorder-lite
        run: npm ci --no-fund --no-audit

      - name: Audit Lite production dependencies
        working-directory: plugins/macro-recorder-lite
        run: npm audit --omit=dev --audit-level=high

      - name: Test build validate and pack Lite
        working-directory: plugins/macro-recorder-lite
        run: |
          npm test
          npm run build
          npm run validate
          npm run pack

      - name: Install Pro dependencies
        working-directory: plugins/macro-recorder-pro
        run: npm ci --no-fund --no-audit

      - name: Audit Pro production dependencies
        working-directory: plugins/macro-recorder-pro
        run: npm audit --omit=dev --audit-level=high

      - name: Test build validate and pack Pro
        working-directory: plugins/macro-recorder-pro
        run: |
          npm test
          npm run build
          npm run validate
          npm run pack

      - name: Install Rat Art dependency
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pillow

      - name: Render deterministic Marketplace source media
        shell: pwsh
        run: |
          python tools/art/macro_recorder_art.py --slug macro-recorder-lite --out artifacts/marketplace/macro-recorder-lite/01-hero.png
          python tools/art/macro_recorder_art.py --slug macro-recorder-pro --out artifacts/marketplace/macro-recorder-pro/01-hero.png

      - name: Exercise Rat Ship media adapters
        shell: pwsh
        run: |
          & .\plugins\macro-recorder-lite\rat-art.ps1 -Destination artifacts\ship-media\macro-recorder-lite
          & .\plugins\macro-recorder-pro\rat-art.ps1 -Destination artifacts\ship-media\macro-recorder-pro
          $expected = @(
            '01_search_icon.png',
            '02_cover.png',
            '03_gallery_01.png',
            '04_gallery_02.png',
            '05_gallery_03.png',
            '06_gallery_04.png'
          )
          foreach ($slug in @('macro-recorder-lite','macro-recorder-pro')) {
            foreach ($name in $expected) {
              $path = Join-Path "artifacts\ship-media\$slug" $name
              if (!(Test-Path $path -PathType Leaf)) { throw "$slug Rat Ship media missing $name" }
            }
          }

      - name: Verify exact family outputs
        shell: pwsh
        run: |
          $lite = @(Get-ChildItem plugins\macro-recorder-lite\dist -Filter *.streamDeckPlugin -File)
          $pro = @(Get-ChildItem plugins\macro-recorder-pro\dist -Filter *.streamDeckPlugin -File)
          if ($lite.Count -ne 1) { throw "Expected one Lite package; found $($lite.Count)" }
          if ($pro.Count -ne 1) { throw "Expected one Pro package; found $($pro.Count)" }

          foreach ($slug in @('macro-recorder-lite','macro-recorder-pro')) {
            $pluginRoot = "plugins\$slug\com.packrat.$slug.sdPlugin"
            $profileRoot = Join-Path $pluginRoot 'profiles'
            $profiles = @(Get-ChildItem $profileRoot -Filter *.streamDeckProfile -File)
            if ($profiles.Count -ne 5) { throw "$slug expected five bundled starter profiles; found $($profiles.Count)" }

            foreach ($suffix in @('mk2','mini','xl','plus','neo')) {
              if (!(Test-Path (Join-Path $profileRoot "$slug-starter-$suffix.streamDeckProfile"))) {
                throw "$slug missing starter profile $suffix"
              }
              if (!(Test-Path "artifacts\profile-maps\$slug-starter-$suffix.profile-map.json")) {
                throw "$slug missing external profile QA map $suffix"
              }
            }

            if (@(Get-ChildItem $profileRoot -Filter *.profile-map.json -File -ErrorAction SilentlyContinue).Count -ne 0) {
              throw "$slug must not ship internal profile QA maps"
            }

            if (!(Test-Path (Join-Path $pluginRoot 'helpers\PackRat.InputHost.exe'))) { throw "$slug package source is missing PackRat.InputHost.exe" }
            foreach ($notice in @('THIRD_PARTY_NOTICES.txt','DOTNET_LICENSE.txt','DOTNET_THIRD_PARTY_NOTICES.txt')) {
              $noticePath = Join-Path $pluginRoot $notice
              if (!(Test-Path $noticePath -PathType Leaf)) { throw "$slug package source is missing $notice" }
              if ((Get-Item $noticePath).Length -le 0) { throw "$slug runtime notice is empty: $notice" }
            }
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          foreach ($package in @($lite[0],$pro[0])) {
            $archive = [System.IO.Compression.ZipFile]::OpenRead($package.FullName)
            try {
              $entryNames = @($archive.Entries | ForEach-Object { $_.FullName.Replace([char]92,'/') })
              foreach ($suffix in @(
                '/manifest.json',
                '/bin/plugin.js',
                '/helpers/PackRat.InputHost.exe',
                '/ui/inspector.html',
                '/THIRD_PARTY_NOTICES.txt',
                '/DOTNET_LICENSE.txt',
                '/DOTNET_THIRD_PARTY_NOTICES.txt'
              )) {
                if (-not ($entryNames | Where-Object { $_.EndsWith($suffix) })) {
                  throw "$($package.Name) exact package is missing $suffix"
                }
              }

              $packedProfiles = @($entryNames | Where-Object { $_ -match '/profiles/.*\.streamDeckProfile$' })
              if ($packedProfiles.Count -ne 5) { throw "$($package.Name) exact package must contain five profiles; found $($packedProfiles.Count)" }
              if ($entryNames | Where-Object { $_ -match '\.profile-map\.json$' }) {
                throw "$($package.Name) exact package contains internal profile QA maps"
              }
            }
            finally {
              $archive.Dispose()
            }
          }

          Get-FileHash $lite[0].FullName -Algorithm SHA256
          Get-FileHash $pro[0].FullName -Algorithm SHA256

      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: macro-recorder-family-release-qa
          path: |
            plugins/macro-recorder-lite/dist/*.streamDeckPlugin
            plugins/macro-recorder-pro/dist/*.streamDeckPlugin
            plugins/macro-recorder-lite/com.packrat.macro-recorder-lite.sdPlugin/profiles/*
            plugins/macro-recorder-pro/com.packrat.macro-recorder-pro.sdPlugin/profiles/*
            plugins/macro-recorder-lite/submission.json
            plugins/macro-recorder-pro/submission.json
            products/macro-recorder-lite.json
            products/macro-recorder-pro.json
            products/lite-pro-map.json
            docs/MACRO_RECORDER_QA.md
            docs/MACRO_RECORDER_MARKET_RESEARCH_2026-09-12.md
            docs/MACRO_RECORDER_NATIVE_GATE.json
            docs/MACRO_RECORDER_NATIVE_RELEASE_BLOCKERS.md
            docs/MACRO_RECORDER_NATIVE_FIX_HANDOFF.md
            docs/MACRO_RECORDER_MAKER_CONSOLE.md
            artifacts/marketplace/macro-recorder-lite/*
            artifacts/marketplace/macro-recorder-pro/*
            artifacts/ship-media/macro-recorder-lite/*
            artifacts/ship-media/macro-recorder-pro/*
            artifacts/profile-maps/*
          if-no-files-found: error
          retention-days: 30
