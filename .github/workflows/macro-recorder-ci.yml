name: Macro Recorder Family Release QA

on:
  push:
    branches:
      - product/macro-recorder
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build shared Windows input host
        shell: pwsh
        run: |
          dotnet publish shared/windows-input/PackRat.InputHost/PackRat.InputHost.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o artifacts/input-host
          if (!(Test-Path artifacts/input-host/PackRat.InputHost.exe)) { throw 'Input host publish did not produce PackRat.InputHost.exe' }

      - name: Input host selftest
        shell: pwsh
        run: |
          & .\artifacts\input-host\PackRat.InputHost.exe --selftest
          $ping = '{"id":"ci","command":"ping"}' | & .\artifacts\input-host\PackRat.InputHost.exe --daemon
          if (($ping -join "") -notmatch '"ok":true') { throw "Input host daemon ping failed: $ping" }

      - name: Install Lite dependencies
        working-directory: plugins/macro-recorder-lite
        run: npm ci --no-fund --no-audit

      - name: Audit Lite dependencies
        working-directory: plugins/macro-recorder-lite
        run: npm audit --omit=dev --audit-level=high

      - name: Test and build Lite
        working-directory: plugins/macro-recorder-lite
        run: |
          npm test
          npm run build
          npm run validate
          npm run pack

      - name: Install Pro dependencies
        working-directory: plugins/macro-recorder-pro
        run: npm ci --no-fund --no-audit

      - name: Audit Pro dependencies
        working-directory: plugins/macro-recorder-pro
        run: npm audit --omit=dev --audit-level=high

      - name: Test and build Pro
        working-directory: plugins/macro-recorder-pro
        run: |
          npm test
          npm run build
          npm run validate
          npm run pack

      - name: Install Rat Art dependency
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pillow

      - name: Render deterministic Marketplace heroes
        shell: pwsh
        run: |
          python tools/art/macro_recorder_art.py --slug macro-recorder-lite --out artifacts/marketplace/macro-recorder-lite/01-hero.png
          python tools/art/macro_recorder_art.py --slug macro-recorder-pro --out artifacts/marketplace/macro-recorder-pro/01-hero.png

      - name: Verify family outputs
        shell: pwsh
        run: |
          $lite = @(Get-ChildItem plugins/macro-recorder-lite/dist -Filter *.streamDeckPlugin -File)
          $pro = @(Get-ChildItem plugins/macro-recorder-pro/dist -Filter *.streamDeckPlugin -File)
          if ($lite.Count -ne 1) { throw "Expected one Lite package; found $($lite.Count)" }
          if ($pro.Count -ne 1) { throw "Expected one Pro package; found $($pro.Count)" }
          $liteProfileRoot = "plugins/macro-recorder-lite/com.packrat.macro-recorder-lite.sdPlugin/profiles"
          $proProfileRoot = "plugins/macro-recorder-pro/com.packrat.macro-recorder-pro.sdPlugin/profiles"
          $liteProfiles = @(Get-ChildItem $liteProfileRoot -Filter *.streamDeckProfile -File)
          $proProfiles = @(Get-ChildItem $proProfileRoot -Filter *.streamDeckProfile -File)
          if ($liteProfiles.Count -ne 1) { throw "Expected one Lite starter profile; found $($liteProfiles.Count)" }
          if ($proProfiles.Count -ne 1) { throw "Expected one Pro starter profile; found $($proProfiles.Count)" }
          if (@(Get-ChildItem $liteProfileRoot -Filter *.profile-map.json -File -ErrorAction SilentlyContinue).Count -ne 0) { throw "Lite must not ship profile QA maps." }
          if (@(Get-ChildItem $proProfileRoot -Filter *.profile-map.json -File -ErrorAction SilentlyContinue).Count -ne 0) { throw "Pro must not ship profile QA maps." }
          if (!(Test-Path artifacts/profile-maps/macro-recorder-lite-starter.profile-map.json)) { throw "Missing Lite external profile QA map." }
          if (!(Test-Path artifacts/profile-maps/macro-recorder-pro-starter.profile-map.json)) { throw "Missing Pro external profile QA map." }
          if (!(Test-Path plugins/macro-recorder-lite/com.packrat.macro-recorder-lite.sdPlugin/helpers/PackRat.InputHost.exe)) { throw "Lite package source is missing PackRat.InputHost.exe." }
          if (!(Test-Path plugins/macro-recorder-pro/com.packrat.macro-recorder-pro.sdPlugin/helpers/PackRat.InputHost.exe)) { throw "Pro package source is missing PackRat.InputHost.exe." }
          Get-FileHash $lite[0].FullName -Algorithm SHA256
          Get-FileHash $pro[0].FullName -Algorithm SHA256

      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: macro-recorder-family-release-qa
          path: |
            plugins/macro-recorder-lite/dist/*.streamDeckPlugin
            plugins/macro-recorder-pro/dist/*.streamDeckPlugin
            plugins/macro-recorder-lite/com.packrat.macro-recorder-lite.sdPlugin/profiles/*
            plugins/macro-recorder-pro/com.packrat.macro-recorder-pro.sdPlugin/profiles/*
            plugins/macro-recorder-lite/submission.json
            plugins/macro-recorder-pro/submission.json
            products/macro-recorder-lite.json
            products/macro-recorder-pro.json
            products/lite-pro-map.json
            docs/MACRO_RECORDER_QA.md
            docs/MACRO_RECORDER_MARKET_RESEARCH_2026-09-12.md
            docs/MACRO_RECORDER_NATIVE_GATE.json
            docs/MACRO_RECORDER_NATIVE_RELEASE_BLOCKERS.md
            docs/MACRO_RECORDER_NATIVE_FIX_HANDOFF.md
            docs/MACRO_RECORDER_MAKER_CONSOLE.md
            artifacts/marketplace/macro-recorder-lite/*
            artifacts/marketplace/macro-recorder-pro/*
            artifacts/profile-maps/*
          if-no-files-found: error
          retention-days: 30
