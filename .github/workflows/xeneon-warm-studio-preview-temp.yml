name: XENEON Warm Studio Preview

on:
  push:
    branches:
      - promote/xeneon-warm-studio-hero-v1

permissions:
  contents: read

jobs:
  preview:
    runs-on: windows-latest
    env:
      RATPACK_ART_FONT: C:\\Windows\\Fonts\\segoeui.ttf
      RATPACK_ART_FONT_BOLD: C:\\Windows\\Fonts\\segoeuib.ttf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install deterministic dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow==12.3.0
          npm install --no-save playwright@1.62.1
          npx playwright install chromium
      - name: Build product
        shell: pwsh
        run: python tools/xeneon/inline.py pc-power-meter-pro
      - name: Capture real product
        shell: pwsh
        run: node tools/art/capture_xeneon.mjs pc-power-meter-pro artifacts/xeneon-preview/shots
      - name: Render corrected approved hero
        shell: pwsh
        run: python tools/art/rat_art.py xeneon pc-power-meter-pro --shots artifacts/xeneon-preview/shots --out artifacts/xeneon-preview/review
      - name: Verify deterministic hero
        shell: pwsh
        run: |
          $report = Get-Content artifacts/xeneon-preview/review/rat-art-report.json -Raw | ConvertFrom-Json
          if ($report.image_generation -ne 'disabled') { throw 'Image generation must stay disabled' }
          if ($report.hero_system -notlike 'approved-xeneon:*') { throw 'Approved XENEON hero system not active' }
          if (-not (Test-Path artifacts/xeneon-preview/review/1-hero.png)) { throw 'Hero missing' }
      - uses: actions/upload-artifact@v4
        with:
          name: xeneon-warm-studio-logo-source-preview
          path: artifacts/xeneon-preview/review/
          if-no-files-found: error
          retention-days: 3
