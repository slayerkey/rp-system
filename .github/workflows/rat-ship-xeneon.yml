name: Rat Ship XENEON

on:
  workflow_dispatch:
    inputs:
      slug:
        description: XENEON widget slug
        required: true
        default: now-playing

permissions:
  contents: read

jobs:
  resolve-slug:
    name: Resolve widget slug
    runs-on: ubuntu-latest
    outputs:
      slug: ${{ steps.resolve.outputs.slug }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve slug
        id: resolve
        shell: bash
        env:
          DISPATCH_SLUG: ${{ inputs.slug }}
        run: |
          slug="$(python tools/xeneon/resolve_slug.py --slug "$DISPATCH_SLUG")"
          echo "Resolved XENEON slug: $slug"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

  ship-kit:
    needs: resolve-slug
    runs-on: windows-latest
    env:
      WIDGET_SLUG: ${{ needs.resolve-slug.outputs.slug }}
      RATPACK_ART_FONT: C:\Windows\Fonts\segoeui.ttf
      RATPACK_ART_FONT_BOLD: C:\Windows\Fonts\segoeuib.ttf
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Validate local Rat command syntax and batch parsing
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'tools/local/rat.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) {
            $errors | ForEach-Object { Write-Host $_.Message }
            throw 'tools/local/rat.ps1 has PowerShell syntax errors'
          }
          & pwsh -NoLogo -NoProfile -File tools/local/rat.ps1 help weather-timeline-pro weather-timeline smoke-third-slug
          if ($LASTEXITCODE -ne 0) { throw 'rat.ps1 did not accept multiple slug arguments' }

      - name: Install deterministic ship dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow==12.3.0
          npm install --no-save playwright@1.62.1
          npm audit --audit-level=high
          npx playwright install chromium

      - name: Build canonical shipping widget
        shell: pwsh
        run: python tools/xeneon/inline.py $env:WIDGET_SLUG

      - name: Official CORSAIR validation
        shell: pwsh
        run: npx --yes icuewidget-cli@0.4.47 validate "widgets/$env:WIDGET_SLUG"

      - name: Official CORSAIR package
        shell: pwsh
        run: |
          npx --yes icuewidget-cli@0.4.47 package "widgets/$env:WIDGET_SLUG"
          New-Item -ItemType Directory -Force -Path artifacts/package | Out-Null
          $pkg = Get-ChildItem -Path widgets -Filter *.icuewidget -File | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $pkg) { throw 'official package was not created' }
          Copy-Item $pkg.FullName "artifacts/package/$env:WIDGET_SLUG.icuewidget"

      - name: Capture real widget for Rat Art
        shell: pwsh
        run: node tools/art/capture_xeneon.mjs $env:WIDGET_SLUG "artifacts/rat-art/shots"

      - name: Render deterministic Rat Art
        shell: pwsh
        run: python tools/art/rat_art.py xeneon $env:WIDGET_SLUG --shots "artifacts/rat-art/shots" --out "artifacts/rat-art/review"

      - name: Render search icon from canonical SVG
        shell: pwsh
        run: node tools/ship/render_svg_icon.mjs "widgets/$env:WIDGET_SLUG/resources/icon.svg" "artifacts/rat-art/review/icon-288x288.png"

      - name: Build Maker Console SHIP_KIT
        shell: pwsh
        run: |
          python tools/ship/make_xeneon_kit.py $env:WIDGET_SLUG `
            --package "artifacts/package/$env:WIDGET_SLUG.icuewidget" `
            --art "artifacts/rat-art/review" `
            --out "artifacts/ship/$env:WIDGET_SLUG/SHIP_KIT"

      - name: Package optional Windows companion
        shell: pwsh
        run: |
          $project = "companions/$env:WIDGET_SLUG/PackRat.SmartLighting.Companion.csproj"
          if (-not (Test-Path $project)) {
            Write-Host "No product companion project declared; skipping."
            exit 0
          }
          dotnet run --project $project -c Release -- --self-test
          if ($LASTEXITCODE -ne 0) { throw "companion self-test failed" }
          $out = "artifacts/companion/$env:WIDGET_SLUG"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          dotnet publish $project -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o $out
          if ($LASTEXITCODE -ne 0) { throw "companion publish failed" }
          $exe = Get-ChildItem $out -Filter *.exe -File | Select-Object -First 1
          if (-not $exe) { throw "companion publish produced no exe" }
          $zip = "artifacts/ship/$env:WIDGET_SLUG/SHIP_KIT/PackRat-Lighting-Companion-win-x64.zip"
          $zipInputs = @($exe.FullName)
          $customerSetup = "companions/$env:WIDGET_SLUG/CUSTOMER-SETUP.txt"
          if (Test-Path $customerSetup) {
            $setupCopy = Join-Path $out "CUSTOMER-SETUP.txt"
            Copy-Item $customerSetup $setupCopy -Force
            $zipInputs += $setupCopy
          }
          Compress-Archive -Path $zipInputs -DestinationPath $zip -Force
          if (-not (Test-Path $zip)) { throw "companion archive missing from SHIP_KIT" }

      - name: Playwright driver kit preflight
        shell: pwsh
        run: node tools/ship/maker_console.mjs $env:WIDGET_SLUG --kit="artifacts/ship/$env:WIDGET_SLUG/SHIP_KIT" --check-kit

      - name: Rat Ship invariants
        shell: pwsh
        run: |
          $kit = "artifacts/ship/$env:WIDGET_SLUG/SHIP_KIT"
          $source = Get-Content "widgets/_src/$env:WIDGET_SLUG/submission.json" -Raw | ConvertFrom-Json
          $sub = Get-Content "$kit/submission.json" -Raw | ConvertFrom-Json
          if ($source.type -ne 'widget' -or $sub.type -ne 'widget') { throw 'submission type must be widget' }
          if ($sub.slug -ne $env:WIDGET_SLUG) { throw 'submission slug mismatch' }
          if ($sub.name -ne $source.name) { throw 'submission name mismatch' }
          if ([decimal]$sub.price_usd -ne [decimal]$source.price_usd) { throw 'submission price mismatch' }
          if ($sub.version -ne $source.version) { throw 'submission version mismatch' }
          if (-not (Test-Path "$kit/$env:WIDGET_SLUG.icuewidget")) { throw 'missing official widget package' }
          foreach ($f in @('01_search_icon.png','02_cover.png','03_gallery_01.png','04_gallery_02.png','05_gallery_03.png','06_gallery_04.png')) {
            if (-not (Test-Path "$kit/$f")) { throw "missing $f" }
          }

      - name: Upload Rat Ship kit
        uses: actions/upload-artifact@v4
        with:
          name: rat-ship-${{ env.WIDGET_SLUG }}
          path: artifacts/ship/${{ env.WIDGET_SLUG }}/SHIP_KIT/
          if-no-files-found: error
          retention-days: 30
