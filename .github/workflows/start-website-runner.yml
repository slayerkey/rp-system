name: Start Website Runner Bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/start-website-runner.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  start-website-runner:
    name: Start Slayerkey website runner
    runs-on: [self-hosted, Windows, X64, packrat]
    timeout-minutes: 5
    steps:
      - name: Start website Actions runner
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $runnerDir = "C:\actions-runner-website"
          $runnerCmd = Join-Path $runnerDir "run.cmd"

          if (-not (Test-Path $runnerCmd)) {
            throw "Website runner not found at $runnerCmd"
          }

          $existing = Get-CimInstance Win32_Process |
            Where-Object {
              $_.Name -eq "Runner.Listener.exe" -and
              $_.CommandLine -like "*actions-runner-website*"
            }

          if ($existing) {
            Write-Host "Website runner is already running."
            exit 0
          }

          # GitHub runner cleanup kills child processes carrying its tracking ID.
          # Clear it before spawning the independent website runner.
          $env:RUNNER_TRACKING_ID = ""

          Start-Process -FilePath "cmd.exe" `
            -ArgumentList "/c", $runnerCmd `
            -WorkingDirectory $runnerDir `
            -WindowStyle Hidden

          Start-Sleep -Seconds 6

          $started = Get-CimInstance Win32_Process |
            Where-Object {
              $_.Name -eq "Runner.Listener.exe" -and
              $_.CommandLine -like "*actions-runner-website*"
            }

          if (-not $started) {
            throw "Website runner did not remain running after launch."
          }

          Write-Host "Website runner started successfully."
